<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>画新地图</title>
<style>
:root {
  --bg: #eef2f4; --panel: #ffffff; --ink: #15212b; --muted: #5f6f7c; --rule: #cfd8de; --accent: #b4462b;
  --ok: #2e7d4f; --bad: #b3261e; --warn: #b85c00; --sel: #ffb300;
  --t0: #4f86c6; --t1: #c9cf9f; --t2: #b99a62; --t3: #8a6a44;
  --body: system-ui, "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC", sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0e151b; --panel: #151f28; --ink: #e2e9ef; --muted: #93a3b0; --rule: #26343f; --warn: #f0a040; }
}
:root[data-theme="dark"] { --bg: #0e151b; --panel: #151f28; --ink: #e2e9ef; --muted: #93a3b0; --rule: #26343f; --warn: #f0a040; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 var(--body); }
header { padding: 14px 16px 6px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
h1 { font-size: 26px; margin: 0; }
h2 { font-size: 18px; margin: 0 0 6px; }
.note { font-size: 14.5px; color: var(--muted); }
.wrap { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 12px; padding: 0 16px 16px; }
@media (max-width: 900px) { .wrap { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; min-width: 0; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
button, select, input { font: 500 15px var(--body); color: var(--ink); background: var(--panel); border: 1px solid var(--rule);
  border-radius: 4px; padding: 5px 10px; }
button { cursor: pointer; }
button:hover { border-color: var(--ink); }
button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
button.go { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; }
input[type=text], input[type=number] { width: 100%; }
input[type=range] { width: 100%; padding: 0; }
.opts { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 15px; margin-bottom: 8px; }
.opts label { display: inline-flex; gap: 6px; align-items: center; }
.mapbox { position: relative; background: #1b2229; border-radius: 6px; overflow: hidden; touch-action: none; }
svg#map { display: block; width: 100%; height: auto; aspect-ratio: 1 / 1; user-select: none; }
.zoom { position: absolute; right: 8px; top: 8px; display: grid; gap: 4px; }
.zoom button { width: 36px; height: 36px; padding: 0; font-size: 18px; background: rgba(0,0,0,.6); color: #fff; border-color: #fff4; }
.zoom button.all { font-size: 13px; }
.coord { position: absolute; left: 8px; bottom: 8px; font: 500 14px var(--mono); background: rgba(0,0,0,.6); color: #fff;
  padding: 2px 8px; border-radius: 3px; pointer-events: none; }
.hint { position: absolute; left: 8px; top: 8px; right: 56px; font-size: 15px; background: rgba(0,0,0,.6); color: #fff;
  padding: 4px 10px; border-radius: 4px; pointer-events: none; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; padding-top: 8px; font-size: 14.5px; color: var(--muted); }
.sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; border: 1px solid #0003; }
.field { display: grid; gap: 2px; margin-bottom: 8px; font-size: 15px; }
.field > span { color: var(--muted); font-size: 14px; }
ol.layers { margin: 0; padding-left: 22px; display: grid; gap: 2px; font-size: 15px; max-height: 260px; overflow: auto; }
ol.layers li { cursor: pointer; }
ol.layers li.on { color: var(--accent); font-weight: 700; }
.row { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
.res { font-size: 15px; overflow-wrap: anywhere; }
.res ul { margin: 4px 0 8px; padding-left: 20px; }
.ok { color: var(--ok); font-weight: 700; } .bad { color: var(--bad); font-weight: 700; } .warn { color: var(--warn); font-weight: 700; }
.mono { font-family: var(--mono); font-size: 14px; }
section + section { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--rule); }
text.lbl { font-family: var(--body); fill: #fff; stroke: #000; stroke-opacity: .8; paint-order: stroke; pointer-events: none; }
</style>
</head>
<body>
<header>
  <h1>画新地图：<span id="mapname"></span></h1>
  <span class="note" id="status">正在连本机服务……</span>
</header>
<div class="wrap">
  <div class="panel">
    <div class="tools" id="tools" role="toolbar" aria-label="画图工具">
      <button data-tool="select" aria-pressed="true" title="点选、拖动地点和顶点；Delete 删除">选择 / 拖动</button>
      <button data-tool="poly" title="单击加点，双击或回车收尾，Esc 取消">多边形地块</button>
      <button data-tool="rect" title="按住拖出矩形">矩形地块</button>
      <button data-tool="circle" title="从圆心拖出半径">圆形地块</button>
      <button data-tool="wall" title="单击加点，双击收尾：一道谁都过不去的陡崖">悬崖墙</button>
      <button data-tool="ramp" title="先点低处一端，再点高处一端">坡道</button>
      <button data-tool="road" title="单击加点，双击收尾（只换地面贴图，不改高度）">路</button>
      <button data-tool="site" title="单击放一个命名地点">地点</button>
      <button data-tool="start" title="单击放玩家出生点">出生点</button>
      <button data-tool="field" title="单击放矿场（精炼厂位置，矿在它正前方 180）">矿场</button>
      <button data-tool="border" title="按住拖出可玩区">可玩区</button>
      <button data-tool="brush" title="按住涂：抬高、压低或整平（生成时叠在地块和坡道上）">地形画刷</button>
    </div>
    <div class="opts" id="opts">
      <label>层：<select id="tier">
        <option value="0">水面（海底）</option><option value="1">低地（第 1 层）</option>
        <option value="2" selected>高地（第 2 层）</option><option value="3">更高（第 3 层）</option></select></label>
      <label>宽度 <input type="number" id="width" value="160" min="20" max="800" step="10" style="width:6em"></label>
      <label>矿场朝向 <select id="facing"><option value="45">东北</option><option value="135">西北</option>
        <option value="225">西南</option><option value="315">东南</option></select></label>
      <label>矿场归属 <select id="owner"><option value="">无主</option><option value="p1">玩家</option><option value="s1">敌人</option></select></label>
      <span id="brush-opts" class="opts" style="display:none;margin:0">
        <label>画刷 <select id="b-op"><option value="raise">抬高</option><option value="lower">压低</option><option value="flatten">整平</option></select></label>
        <label>半径 <input type="number" id="b-r" value="80" min="20" max="300" step="10" style="width:5em"></label>
        <label>强度 <input type="number" id="b-s" value="3" min="0.5" max="20" step="0.5" style="width:5em"></label>
      </span>
      <button id="undo" title="Ctrl+Z">撤销</button>
      <button id="redo" title="Ctrl+Y">重做</button>
    </div>
    <div class="mapbox" id="mapbox">
      <svg id="map" xmlns="http://www.w3.org/2000/svg" aria-label="地图草图">
        <rect id="bg" x="0" y="0" width="5000" height="5000"></rect>
        <g id="g-shapes"></g>
        <g id="g-brush"></g>
        <image id="img-ground" x="0" y="0" width="5000" height="5000" preserveAspectRatio="none" opacity="0.85" style="display:none"></image>
        <image id="img-regions" x="0" y="0" width="5000" height="5000" preserveAspectRatio="none" style="display:none;image-rendering:pixelated"></image>
        <g id="g-lines"></g>
        <g id="g-marks"></g>
        <g id="g-warn"></g>
        <g id="g-draft"></g>
        <g id="g-handles"></g>
      </svg>
      <div class="hint" id="hint"></div>
      <div class="zoom"><button id="zin" aria-label="放大">+</button><button id="zout" aria-label="缩小">−</button>
        <button id="zall" class="all">全图</button></div>
      <div class="coord" id="coord"></div>
    </div>
    <div class="legend">
      <span><i class="sw" style="background:var(--t0)"></i>水面</span>
      <span><i class="sw" style="background:var(--t1)"></i>低地</span>
      <span><i class="sw" style="background:var(--t2)"></i>高地</span>
      <span><i class="sw" style="background:var(--t3)"></i>更高</span>
      <span><i class="sw" style="background:#7a5"></i>坡道</span>
      <span><i class="sw" style="background:#ddd"></i>路</span>
      <span><i class="sw" style="background:#222"></i>悬崖墙</span>
      <span><i class="sw" style="background:#ffd54f"></i>矿场</span>
      <span><i class="sw" style="background:#e8743b"></i>抬高 <i class="sw" style="background:#3b8fe8"></i>压低 <i class="sw" style="background:#9a9a9a"></i>整平</span>
      <span><i class="sw" style="background:var(--warn)"></i>可能停住 / 贴边窄缝</span>
      <span>层与层交界自动成悬崖（陡坡过不去），只有坡道能上下。</span>
    </div>
    <div class="opts" style="margin-top:6px">
      <label><input type="checkbox" id="show-ground"> 叠生成后的地面图</label>
      <label><input type="checkbox" id="show-regions"> 叠连通区（绿=出生点能走到）</label>
      <label><input type="checkbox" id="show-labels" checked> 地点名</label>
    </div>
  </div>
  <div class="panel">
    <section>
      <h2>选中的东西</h2>
      <div id="props" class="note">点"选择 / 拖动"后点图上的东西。</div>
    </section>
    <section>
      <h2>地块（按画的顺序，后画的盖住先画的）</h2>
      <ol class="layers" id="layers"></ol>
      <div class="field" style="margin-top:8px"><span>没画到的地方是</span>
        <select id="base"><option value="0">水面（海底）</option><option value="1">低地（第 1 层）</option>
          <option value="2">高地（第 2 层）</option><option value="3">更高（第 3 层）</option></select></div>
    </section>
    <section>
      <h2>生成与检查</h2>
      <p class="note">草图存在 <span class="mono" id="where"></span>；生成器写出地图模块草稿（只写到 work/，由关卡线审过再搬进 maps/），然后跑设计检查、contract、连通区和出 .map。</p>
      <div class="row"><button class="go" id="gen">生成并检查</button></div>
      <div class="res" id="result"></div>
    </section>
  </div>
</div>
<script>
/*VIEW_JS*/
</script>
<script>
"use strict";
const BOOT = /*BOOT*/null;
const W = 5000, H = 5000;
const TIER_COLOR = ["var(--t0)", "var(--t1)", "var(--t2)", "var(--t3)"];
const TIER_NAME = ["水面", "低地", "高地", "更高"];
const FACING_NAME = { 45: "东北", 135: "西北", 225: "西南", 315: "东南" };
const NS = "http://www.w3.org/2000/svg";
const $ = (id) => document.getElementById(id);
const svg = $("map");
let sk = BOOT.sketch, online = BOOT.online;
sk.brushes = sk.brushes || [];                                 // sketches drawn before the brush layer
const TIERS = BOOT.tiers;                                      // platmap.TIER: each tier's height (elevation / 16)
let tool = "select", sel = null, draft = null, drag = null, view = View.full(W, H);
const past = [], future = [];

// ---- coordinates: svg units are world units, y flipped (world +y is north)
const sy = (y) => H - y;
function worldAt(ev) {
  const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY;
  const q = p.matrixTransform(svg.getScreenCTM().inverse());
  return [Math.round(q.x), Math.round(H - q.y)];
}
const scale = () => view.w / (svg.getBoundingClientRect().width || 1);   // world units per screen pixel

// ---- history and saving
function snapshot() { past.push(JSON.stringify(sk)); if (past.length > 200) past.shift(); future.length = 0; }
function undo() { if (!past.length) return; future.push(JSON.stringify(sk)); sk = JSON.parse(past.pop()); sel = null; changed(false); }
function redo() { if (!future.length) return; past.push(JSON.stringify(sk)); sk = JSON.parse(future.pop()); sel = null; changed(false); }
let saveTimer = null;
function changed(push = true) { render(); if (push) {} clearTimeout(saveTimer); saveTimer = setTimeout(save, 500); }
async function save() {
  if (!online) { status("没连上本机服务：改动只在这页里，刷新就没了"); return; }
  try {
    const r = await fetch("/api/sketch", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(sk) });
    if (!r.ok) throw new Error((await r.json()).error || r.status);
    status("已存 " + new Date().toLocaleTimeString());
  } catch (e) { status("存不上：" + e.message); }
}
function status(t) { $("status").textContent = t; }

// ---- drawing
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const pts = (a) => a.map(([x, y]) => `${x},${sy(y)}`).join(" ");
function shapeEl(sh, parent, extra) {
  const fill = TIER_COLOR[sh.tier] || "#f0f";
  if (sh.kind === "poly") return el("polygon", { points: pts(sh.at), fill, ...extra }, parent);
  if (sh.kind === "rect") {
    const [x0, y0, x1, y1] = sh.at;
    return el("rect", { x: Math.min(x0, x1), y: sy(Math.max(y0, y1)), width: Math.abs(x1 - x0), height: Math.abs(y1 - y0), fill, ...extra }, parent);
  }
  const [x, y, r] = sh.at;
  return el("circle", { cx: x, cy: sy(y), r, fill, ...extra }, parent);
}
function rampQuad(r) {
  const [x0, y0] = r.low, [x1, y1] = r.high, d = Math.hypot(x1 - x0, y1 - y0) || 1, h = r.width / 2;
  const nx = -(y1 - y0) / d * h, ny = (x1 - x0) / d * h;
  return [[x0 + nx, y0 + ny], [x1 + nx, y1 + ny], [x1 - nx, y1 - ny], [x0 - nx, y0 - ny]];
}
function render() {
  const k = scale(), isSel = (kind, i) => sel && sel.kind === kind && sel.i === i;
  $("bg").setAttribute("fill", TIER_COLOR[sk.base]);
  const gs = $("g-shapes"), gl = $("g-lines"), gm = $("g-marks"), gh = $("g-handles"), gb = $("g-brush"), gw = $("g-warn");
  for (const g of [gs, gl, gm, gh, gb, gw]) g.replaceChildren();
  sk.brushes.forEach((st, i) => brushEl(st, gb, { "data-kind": "brushes", "data-i": i, on: isSel("brushes", i) }));
  drawWarnings(gw, k);
  sk.shapes.forEach((sh, i) => shapeEl(sh, gs, { "data-kind": "shapes", "data-i": i, stroke: isSel("shapes", i) ? "var(--sel)" : "#0005",
    "stroke-width": (isSel("shapes", i) ? 3 : 1) * k }));
  sk.walls.forEach((wl, i) => el("polyline", { points: pts(wl.points), fill: "none", stroke: isSel("walls", i) ? "var(--sel)" : "#222",
    "stroke-width": wl.width, "stroke-linejoin": "round", "stroke-linecap": "round", "data-kind": "walls", "data-i": i }, gl));
  sk.roads.forEach((rd, i) => el("polyline", { points: pts(rd.points), fill: "none", stroke: isSel("roads", i) ? "var(--sel)" : "#e4e4e4",
    "stroke-opacity": .8, "stroke-width": rd.width, "stroke-linejoin": "round", "data-kind": "roads", "data-i": i }, gl));
  sk.ramps.forEach((rp, i) => {
    el("polygon", { points: pts(rampQuad(rp)), fill: "#7a5", "fill-opacity": .85, stroke: isSel("ramps", i) ? "var(--sel)" : "#253",
      "stroke-width": 2 * k, "data-kind": "ramps", "data-i": i }, gl);
    el("line", { x1: rp.low[0], y1: sy(rp.low[1]), x2: rp.high[0], y2: sy(rp.high[1]), stroke: "#fff", "stroke-width": 2 * k,
      "marker-end": "", "pointer-events": "none" }, gl);
  });
  const borders = Object.entries(sk.borders);
  if (borders.length) {                                       // outside the playable area: dimmed
    const [x0, y0, x1, y1] = borders[0][1];
    el("path", { d: `M0,0H${W}V${H}H0Z M${x0},${sy(y1)}V${sy(y0)}H${x1}V${sy(y1)}Z`, fill: "#000", "fill-opacity": .45,
      "fill-rule": "evenodd", "pointer-events": "none" }, gl);
  }
  borders.forEach(([name, b], i) => el("rect", { x: Math.min(b[0], b[2]), y: sy(Math.max(b[1], b[3])), width: Math.abs(b[2] - b[0]),
    height: Math.abs(b[3] - b[1]), fill: "none", stroke: i ? "#9cf" : "#fff", "stroke-width": (i ? 2 : 3) * k,
    "stroke-dasharray": `${12 * k} ${8 * k}`, "pointer-events": "none" }, gl));
  sk.blocks.forEach((b) => { if (!Array.isArray(b.at)) return; const [x0, y0, x1, y1] = b.at;
    el("rect", { x: x0, y: sy(y1), width: x1 - x0, height: y1 - y0, fill: "none", stroke: "#fff6", "stroke-width": k, "pointer-events": "none" }, gl); });
  const fs = 15 * k, labels = $("show-labels").checked;
  sk.fields.forEach((f, i) => {
    const a = f.facing * Math.PI / 180, ox = f.x + 180 * Math.cos(a), oy = f.y + 180 * Math.sin(a);
    el("line", { x1: f.x, y1: sy(f.y), x2: ox, y2: sy(oy), stroke: "#ffd54f", "stroke-width": 3 * k, "pointer-events": "none" }, gm);
    el("circle", { cx: ox, cy: sy(oy), r: 40, fill: "#ffd54f", stroke: "#000", "stroke-width": k, "pointer-events": "none" }, gm);
    el("rect", { x: f.x - 60, y: sy(f.y) - 60, width: 120, height: 120, fill: "#ffd54f66", stroke: isSel("fields", i) ? "var(--sel)" : "#ffd54f",
      "stroke-width": 3 * k, "data-kind": "fields", "data-i": i }, gm);
    if (labels) el("text", { x: f.x + 70, y: sy(f.y) - 60, "font-size": fs, "stroke-width": 3 * k, class: "lbl" }, gm).textContent = `${f.name} 矿场`;
  });
  Object.entries(sk.sites).forEach(([code, s]) => {
    if (s.r) el("circle", { cx: s.x, cy: sy(s.y), r: s.r, fill: "#fff1", stroke: "#fffa", "stroke-width": k, "pointer-events": "none" }, gm);
    if (s.build) el("rect", { x: s.x - s.build / 2, y: sy(s.y) - s.build / 2, width: s.build, height: s.build, fill: "none",
      stroke: "#9cf", "stroke-width": 2 * k, "pointer-events": "none" }, gm);
    el("circle", { cx: s.x, cy: sy(s.y), r: 7 * k, fill: isSel("sites", code) ? "var(--sel)" : "#fff", stroke: "#000",
      "stroke-width": 1.5 * k, "data-kind": "sites", "data-i": code }, gm);
    if (labels) el("text", { x: s.x + 10 * k, y: sy(s.y) - 8 * k, "font-size": fs, "stroke-width": 3 * k, class: "lbl" }, gm)
      .textContent = s.zh ? `${s.zh} ${code}` : code;
  });
  const [x, y] = sk.start;
  el("path", { d: `M${x},${sy(y) - 22 * k} l${14 * k},${30 * k} h${-28 * k} z`, fill: isSel("start", 0) ? "var(--sel)" : "#4caf50",
    stroke: "#000", "stroke-width": 1.5 * k, "data-kind": "start", "data-i": 0 }, gm);
  if (labels) el("text", { x: x + 16 * k, y: sy(y) + 6 * k, "font-size": fs, "stroke-width": 3 * k, class: "lbl" }, gm).textContent = "出生点";
  drawHandles(gh, k);
  drawDraft(k);
  renderLayers(); renderProps();
  $("base").value = String(sk.base);
}
// ---- terrain brushes: strokes laid after the shapes and ramps (platmap.brush at build time)
const BRUSH_COLOR = { raise: "#e8743b", lower: "#3b8fe8", flatten: "#9a9a9a" };
const BRUSH_NAME = { raise: "抬高", lower: "压低", flatten: "整平" };
const dabPairs = (d) => { const out = []; for (let j = 0; j + 1 < d.length; j += 2) out.push([d[j], d[j + 1]]); return out; };
function brushEl(st, parent, extra = {}) {
  const g = el("g", {}, parent);
  const p = dabPairs(st.dabs), col = BRUSH_COLOR[st.op] || "#f0f";
  const attrs = extra["data-kind"] ? { "data-kind": extra["data-kind"], "data-i": extra["data-i"] } : { "pointer-events": "none" };
  if (p.length > 1) el("polyline", { points: pts(p), fill: "none", stroke: col, "stroke-opacity": .45, "stroke-width": 2 * st.r,
    "stroke-linecap": "round", "stroke-linejoin": "round", ...attrs }, g);
  else el("circle", { cx: p[0][0], cy: sy(p[0][1]), r: st.r, fill: col, "fill-opacity": .45, ...attrs }, g);
  if (extra.on) el("polyline", { points: pts(p.length > 1 ? p : [p[0], p[0]]), fill: "none", stroke: "var(--sel)", "stroke-width": 4 * scale(),
    "pointer-events": "none" }, g);
  return g;
}
// the ground tier under a point before smoothing: the last shape (or wall) drawn over it, else the base
function inPoly(a, x, y) {
  let c = false;
  for (let i = 0, j = a.length - 1; i < a.length; j = i++) {
    const [xi, yi] = a[i], [xj, yj] = a[j];

      const rest = Object.entries(sk.borders).slice(1); sk.borders = Object.fromEntries([["whole", b], ...rest]); sk.size = [b[2] - b[0], b[3] - b[1]]; }
    draft = null; drag = null; changed(); return;
  }
  drag = null;
}
svg.addEventListener("pointerup", up);
svg.addEventListener("pointercancel", up);
// a double click's two presses add one point (the second lands on the first and is dropped): that point is the last
svg.addEventListener("dblclick", (ev) => { if (draft && draft.points) finishLine(); ev.preventDefault(); });
svg.addEventListener("wheel", (ev) => {
  ev.preventDefault();
  const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY;
  const q = p.matrixTransform(svg.getScreenCTM().inverse());
  view = View.zoomAt(view, W, H, ev.deltaY < 0 ? 1.25 : 1 / 1.25, q.x, q.y); setView();
}, { passive: false });
function setView() { svg.setAttribute("viewBox", `${view.x} ${view.y} ${view.w} ${View.height(view, W, H)}`); render(); }
$("zin").onclick = () => { view = View.zoomAt(view, W, H, 1.5, view.x + view.w / 2, view.y + view.w / 2); setView(); };
$("zout").onclick = () => { view = View.zoomAt(view, W, H, 1 / 1.5, view.x + view.w / 2, view.y + view.w / 2); setView(); };
$("zall").onclick = () => { view = View.full(W, H); setView(); };
document.addEventListener("keydown", (ev) => {
  if (ev.target.matches && ev.target.matches("input, select, textarea")) return;
  if (ev.key === "Escape") { draft = null; render(); }
  else if (ev.key === "Enter") finishLine();
  else if (ev.key === "Delete" || ev.key === "Backspace") removeSel();
  else if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "z") { ev.preventDefault(); undo(); }
  else if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "y") { ev.preventDefault(); redo(); }
});
for (const b of document.querySelectorAll("#tools button")) b.onclick = () => setTool(b.dataset.tool);
$("undo").onclick = undo; $("redo").onclick = redo;
$("base").onchange = () => { snapshot(); sk.base = +$("base").value; changed(); };
$("show-labels").onchange = render;
$("show-ground").onchange = () => { $("img-ground").style.display = $("show-ground").checked ? "" : "none"; };
$("show-regions").onchange = () => { $("img-regions").style.display = $("show-regions").checked ? "" : "none"; };

// ---- generate and check (the server runs sketch2map.report)
function list(title, items, good) {
  const d = document.createElement("div");
  const h = document.createElement("div");
  h.innerHTML = `${title}：<span class="${items.length ? "bad" : "ok"}">${items.length ? items.length + " 条" : good}</span>`;
  d.appendChild(h);
  if (items.length) { const ul = document.createElement("ul"); for (const t of items) { const li = document.createElement("li"); li.textContent = t; ul.appendChild(li); } d.appendChild(ul); }
  return d;
}
// a warning list: orange, not counted as failing (the map still generates and passes)
function warnList(title, items, why) {
  const d = document.createElement("div");
  const h = document.createElement("div");
  h.innerHTML = `${title}：<span class="${items.length ? "warn" : "ok"}">${items.length ? items.length + " 处" : "没有"}</span>`;
  d.appendChild(h);
  if (items.length) {
    const ul = document.createElement("ul"); for (const t of items) { const li = document.createElement("li"); li.textContent = t; ul.appendChild(li); } d.appendChild(ul);
    const n = document.createElement("div"); n.className = "warn"; n.style.fontWeight = 500; n.textContent = why; d.appendChild(n);
  }
  return d;
}
function showReport(r) {
  const box = $("result"); box.replaceChildren();
  warn = { stops: [], narrow: [] };
  const head = document.createElement("p");
  head.innerHTML = r.ok ? '<span class="ok">全部通过</span>' : '<span class="bad">有问题，见下面</span>';
  box.appendChild(head);
  if (r.problems && r.problems.length) { box.appendChild(list("草图本身", r.problems, "")); return; }
  const m = document.createElement("p"); m.className = "mono"; m.textContent = "模块草稿 " + r.module + (r.map ? "\n.map " + r.map : "");
  m.style.whiteSpace = "pre-wrap"; box.appendChild(m);
  box.appendChild(list("设计检查（坡道、建造点、矿、桥、地块用途、缺口宽度）", r.lint, "通过"));
  box.appendChild(list("contract（空任务放在这张图上）", r.contract, "通过"));
  if (r.map_error) box.appendChild(list("写不出 .map", [r.map_error], ""));
  const g = r.regions;
  const names = (codes) => codes.map((c) => (sk.sites[c] && sk.sites[c].zh ? `${sk.sites[c].zh}（${c}）` : c));
  box.appendChild(list(`连通区（共 ${g.count} 块能走的地面）出生点走不到的地点`, names(g["cut off"]), "没有"));
  const regs = document.createElement("ul");
  for (const x of g.regions) { const li = document.createElement("li");
    li.textContent = `${x.id === g.start ? "出生点这块" : "第 " + x.id + " 块"}：${x.km2} 平方公里，地点 ${names(x.sites).join("、") || "无"}`; regs.appendChild(li); }
  box.appendChild(regs);
  const stops = r.stops || [], narrow = r.narrow || [];
  box.appendChild(warnList("可能半路停住（连通区能到，引擎线寻路模型说到不了）", stops.map((x) =>
    `去${siteName(x.to)}：模型 ${x.reason}` + (x.stop ? `，停在 (${Math.round(x.stop[0])}, ${Math.round(x.stop[1])})，离目标约 ${Math.round(x.gap)}（图上橙色叉）` : "")),
    "游戏不报错，单位会开到半路停住；脚本派兵请分段下令；模型偏保守，可能多报。"));
  box.appendChild(warnList("贴边窄缝（悬崖或墙离地图边只剩比 50 窄的缝）", narrow.map((x) =>
    `(${Math.round(x.x)}, ${Math.round(x.y)}) 宽约 ${x.width}、长 ${x.length}（图上橙色圈）`),
    "能走，所以连通区算通；但车会往缝里开然后卡住。要么把墙画到边外封死，要么让出 50 以上。"));
  warn = { stops, narrow };
  const p = document.createElement("p"); p.className = "note";
  p.textContent = "寻路：" + (typeof r.pathing === "string" ? r.pathing : r.pathing.map((x) => `${x.from}→${x.to} ${x.found ? "通" : "不通（" + x.reason + "）"}`).join("；"));
  box.appendChild(p);
  render();
  if (r.study && r.study.length) {
    const det = document.createElement("details"); const s = document.createElement("summary"); s.textContent = "和原版战役地图比（mapstudy、terrainref）"; det.appendChild(s);
    const pre = document.createElement("pre"); pre.className = "mono"; pre.style.whiteSpace = "pre-wrap"; pre.textContent = r.study.join("\n"); det.appendChild(pre);
    box.appendChild(det);
  }
  const t = Date.now();
  if (r.ground_png) { $("img-ground").setAttribute("href", `/files/${r.ground_png}?t=${t}`); }
  if (r.regions_png) { $("img-regions").setAttribute("href", `/files/${r.regions_png}?t=${t}`); }
}
$("gen").onclick = async () => {
  if (!online) { $("result").textContent = "没连上本机服务，不能生成。用 serve.py --new 打开这页。"; return; }
  const b = $("gen"); b.disabled = true; b.textContent = "正在生成和检查（十几秒）……";
  try {
    const r = await fetch("/api/generate", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(sk) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.status);
    showReport(d); status("已生成 " + new Date().toLocaleTimeString());
    if (!$("show-regions").checked && d.regions && d.regions["cut off"].length) { $("show-regions").checked = true; $("show-regions").onchange(); }
  } catch (e) { $("result").textContent = "生成失败：" + e.message; }
  b.disabled = false; b.textContent = "生成并检查";
};

// ---- start
$("mapname").textContent = sk.name;
$("where").textContent = BOOT.where;
if (BOOT.report) showReport(BOOT.report);
status(online ? "已连上本机服务，改动自动存" : "没连上本机服务：改动只在这页里");
setTool("select");
{ // open on the playable area (the first border), a little round it
  const b = Object.values(sk.borders)[0] || [0, 0, W, H], pad = 150;
  const w = Math.max(b[2] - b[0], b[3] - b[1]) + 2 * pad;
  view = View.clamp({ x: b[0] - pad, y: sy(b[3]) - pad, w }, W, H);
}
setView();
window.addEventListener("resize", render);
window.__sketch = { get sk() { return sk; }, render, setTool, get view() { return view; } };
</script>
</body>
