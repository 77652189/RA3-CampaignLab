# Bench readings of benches/script/control/checks.py#engine_conds (format: experimental/cnv/readings.py; runner: tests/conformance).
# Round 208: the retail-campaign conditions, batch 1. The bench's clock runs a second or two ahead of the simulator's
# here (fire, kills, the scripted seconds), so the readings compare the order of the states each held for two samples
# or more (one sample: the frame a kill lands in), not the seconds. A scene's until is the old test's seconds + 1.
# held(xs): the values held two samples or more in a row; column(col, before): one counter's held values, repeats
# merged (the row of second 0 dropped, as the old helpers did).

