# Bench readings of engine_air in checks.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# Moved from tests/test_simbench.py (T3 A): until is the old run's until + 1. Air (ADR 0022 item 5): flight over
# terrain, anti-air reach, air-to-ground (sim.Ground.route 'air', Sim.can_hit, Sim.in_range; simunits weapon
# inheritFrom). Bench 2026-11-08 engine_air (maps/probe_air.py): a Twinblade (Speed 150, radius 19.4) flies 1 200 over
# flat ground, a sea trench or a cliff; hovers before a flak cannon (300, radius 14-21) / a flak trooper (anti-air 300
# by inheritFrom) / a Guardian (no ANTI_AIRBORNE); attacks a NO_ATTACK Guardian 600 off. A Twinblade placed by the map
# is an air target from the start (bench 2026-11-08 land_*: shot by the flak cannon from frame ~18 and by the flak
# trooper with no order, never by a Guardian; it fires where it stands). Every reading's rows are those of seconds >= 1
# (RT: [(second, row)]), as the old helper left row 0 out.

[[reading]]
bench_id = "engine_air"
id = "air_flies_straight_over_sea_and_cliff_at_its_speed"
scene = {build = "air_fly_flat", check = "frames", until = 13}
each = [{build = "air_fly_flat"}, {build = "air_fly_sea"}, {build = "air_fly_cliff"}]
bench = "114 frames from Go to the end box, the middle box at s4-s5, whatever lies under the lane (bench 2026-11-08 engine_air fly_*; sim 106 frames)"
proves = """sim.Ground.route 'air': an aircraft flies straight over sea and cliff at its speed. The simulator has no \
acceleration (bench ~0.5 s): 8 frames early is in."""
let = {RT = "[(t, r) for t, r in zip(times, rows) if t >= 1]"}
expect = [
    "abs(next(r['飞帧'] for t, r in RT if r['到达'] == 1) - 114) <= 10",
    "[t for t, r in RT if r['中途'] == 1] and abs([t for t, r in RT if r['中途'] == 1][0] - 4) <= 1",
]

[[reading]]
bench_id = "engine_air"
id = "air_anti_air_reaches_edge_to_edge_on_the_flat"
scene = {build = "air_gun280", check = "frames", until = 26}
each = [
    {build = "air_gun280", hit = true, gone_s = 5},
    {build = "air_gun320", hit = true, gone_s = 5},
    {build = "air_gun370", hit = false, gone_s = 5},
    {build = "air_flak280", hit = true, gone_s = 22},
    {build = "air_flak312", hit = true, gone_s = 22},
]
bench = "the flak cannon fires at 320 centre to centre (300 + both radii, 2D) and not at 370; the flak trooper's anti-air weapon (inheritFrom: no damage of its own) fires in place at 280 and 312. The cannon kills by s5 (bench 4 left at s5), the trooper takes ~4 a second (bench 4 at s24; sim ~5.5, dead s18)"
proves = "sim.Sim.can_hit / in_range: anti-air reach is edge to edge in 2D (flight height not counted); an inheritFrom anti-air weapon fires in place"
let = {RT = "[(t, r) for t, r in zip(times, rows) if t >= 1]"}
expect = [
    "all(r['原地'] == 1 for t, r in RT)",
    "hit or all(r['机血'] == 100 for t, r in RT)",
    "not hit or (RT[0][1]['机血'] < 100 and abs(next(t for t, r in RT if r['机血'] <= 5) - gone_s) <= 4)",
]

[[reading]]
bench_id = "engine_air"
id = "air_flak_trooper_walks_in_from_354_when_revealed"
scene = {build = "air_flak354", check = "frames", until = 26}
bench = "with both sides revealed the idle trooper walked in on a Twinblade 354 off (334 beyond its radius, vision 200) and shot it (bench engine_air flak354)"
proves = "sim idle_chase (R8): the scan with a reveal"
let = {RT = "[(t, r) for t, r in zip(times, rows) if t >= 1]"}
expect = "any(r['原地'] == 0 for t, r in RT) and RT[-1][1]['机血'] < 50"
mismatch = """sim: the trooper stays in place (原地 1 all along) and the Twinblade keeps 机血 100; bench: it walks in and \
shoots it. idle_chase only goes within VisionRange + the target radius (R8, read unrevealed) -- the scan with a reveal \
not known"""

