texact (TEAM_FOLLOW_WAYPOINTS_EXACT): the same as team, second by second: 段2 1 at s3, 2 at s10, 3 at s17; 段3 1 at s5, \
2 at s10, 3 at s14 (bench 2026-11-10)"""
proves = "sim order_follow: the exact team follow-waypoints order walks the same as the plain one"
let = {chg = "[(t, r) for i, (t, r) in enumerate(zip(times, rows)) if i == 0 or r != rows[i - 1]]", at = "lambda k, p: next((t for t, r in chg if p(r[k])), None)", hit = "lambda k, v, b: (lambda g: g is not None and b <= g <= b + 2)(at(k, lambda x: x == v))"}
expect = [
    "hit('段2', 1, 3) and hit('段2', 2, 10) and hit('段2', 3, 17) and hit('段3', 1, 5) and hit('段3', 2, 10) and hit('段3', 3, 14)",
    "rows[-1]['段2'] == 3",
]

