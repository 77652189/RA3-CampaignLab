        "脚本动作 NAMED_USE_COMMANDBUTTON_ABILITY:Command_UnPackJapanMCV"]
scene = {build = "engine_unpack_nvl", check = "go", until = 40}
each = [{build = "engine_unpack_nvl"}, {build = "engine_unpack_jpn"}]
bench = """\
NAMED_USE_COMMANDBUTTON_ABILITY(MCV, its unpack button) untargeted, standing: j04's AlliedMCV_Naval and s02's \
JapanMCV (bench 11-23 CampUnpackNvlGo_mcp_1123_080608 s40 618 618 0 618 / CampUnpackJpnGo_mcp_1123_080739 s41 632 632 \
0 632): the MCV stays an MCV to the end, no yard within 290 of it, as the egg (pin)"""
proves = "sim named_buttons: an untargeted MCV unpack press unfolds nothing (the stop of pin)"
let = {frames = "rows[-1]['帧数']", unit = "rows[-1]['车帧']", yard = "rows[-1]['场帧']", name = "rows[-1]['名字帧']"}
expect = "frames > 500 and unit == frames and yard == 0 and name == frames"

[[reading]]
bench_id = "engine_unpack"
id = "a_driving_mcv_pressed_the_yards_pack_button_at_a_waypoint_drives_on"
item = "脚本动作 NAMED_USE_COMMANDBUTTON_ABILITY_AT_WAYPOINT:Command_PackJapanMCV"
scene = {build = "engine_unpack_jpk", check = "go", until = 41}
bench = """\
s02's escape: JapanMCV ordered 400 east at 1 s, 1 s on NAMED_USE_COMMANDBUTTON_ABILITY_AT_WAYPOINT(it, \
Command_PackJapanMCV, the point) -- a yard's button, not in the MCV's CommandSet (bench 11-23 \
CampUnpackJpkGo_mcp_1123_081035, s41 630 510630 0 630): the press changes nothing, the MCV drives on, within 100 of \
the point from frame 120 (sim 114), no yard anywhere, the name kept"""
proves = "sim named_buttons: a pack button the unit's CommandSet lacks does nothing, a move under way kept"
let = {frames = "rows[-1]['帧数']", unit = "rows[-1]['车帧']", yard = "rows[-1]['场帧']", name = "rows[-1]['名字帧']"}
expect = "unit % 1000 == frames and 105 <= frames - unit // 1000 <= 130 and yard == 0 and name == frames"

[[reading]]
bench_id = "engine_unpack"
id = "a_power_plant_egg_unfolds_at_a_far_waypoint_as_the_bench"
item = "脚本动作 NAMED_USE_COMMANDBUTTON_ABILITY_AT_WAYPOINT:Command_UnPackJapanPowerPlantEgg"
scene = {build = "engine_unpack_pwr", check = "go", until = 41}
bench = """\
NAMED_USE_COMMANDBUTTON_ABILITY_AT_WAYPOINT(egg, Command_UnPackJapanPowerPlantEgg, 400 east) (bench 11-21 \
CampUnpackPwrGo_mcp_1121_123504, s41 632 28105 527 632): the egg drives there and is the plant on the point from frame \
105 (sim 100), the name passed on; the plant never counted owned (场帧's thousands 0; sim counts it, not asserted)"""
proves = "sim unpack at a waypoint: j08's power plant egg drives to the point, becomes the plant there, the name passes on"
let = {frames = "rows[-1]['帧数']", unit = "rows[-1]['车帧']", yard = "rows[-1]['场帧']", name = "rows[-1]['名字帧']"}
expect = ["95 <= unit % 1000 <= 115 and unit // 1000 > 0", "yard % 1000 == frames - unit % 1000", "name == frames"]

