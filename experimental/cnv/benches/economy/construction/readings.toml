# Bench readings of benches/economy/construction/checks.py#engine_assistplace_e (format: experimental/cnv/readings.py; runner: tests/conformance).
# E169 (work/re/e169_assistplace.md): the retail refinery and a copy without its placement-hint include; the refinery
# queued from the sidebar, then a click 30 off the hint pad.

[[reading]]
bench_id = "engine_assistplace_e"
id = "no_refinery_stands_with_the_hint"
scene = {build = "assistpon", check = "a", until = 60}
bench = "E169 assistpon:a: 采样完成 / 矿场总数 / 提示位数量 0 throughout (to s191); the preview stayed red"
proves = "a negative baseline only: no refinery was placed -- not evidence for or against snapping (placement acceptance was not established; inventory TODO stays)"
expect = ["all(r['采样完成'] == 0 and r['矿场总数'] == 0 and r['提示位数量'] == 0 for r in rows)"]

[[reading]]
bench_id = "engine_assistplace_e"
id = "no_refinery_stands_without_it_either"
scene = {build = "assistpoff", check = "a", until = 60}
bench = "E169 assistpoff:a (only the include removed): the same, 0 / 0 / 0 throughout (to s267)"
proves = "a negative baseline only (as assistpon)"
expect = ["all(r['采样完成'] == 0 and r['矿场总数'] == 0 and r['提示位数量'] == 0 for r in rows)"]

[[reading]]
bench_id = "engine_assistplace_e"
id = "the_sidebar_queue_pays_the_refinery"
scene = {build = "assistpon", check = "a", until = 60}
bench = "E169 assistpon:a: 资金 10000 -> 8000 over about 30 s of the queue (wall s22-s52), then 8000 to the end; assistpoff the same"
proves = "the bench's sidebar queue clicks are paid -- a UI-input baseline, not an AssistedPlacement rule"
expect = "min(r['资金'] for r in rows) == 8000"
mismatch = "sim 10000 throughout: the simulator does not replay the bench's sidebar queue / placement clicks; bench 8000"

[[reading]]
bench_id = "engine_assistplace_e"
id = "the_hint_snaps_the_refinery_to_the_pad"
scene = {build = "assistpon", check = "b", until = 60}
bench = """assistpon:b, run_queue CampAsstOnB_mcp_1123_082312: 资金 / 矿场总数 / 提示位20内 / 点击处数量 10000 0 0 0 to s20, \
paid to 8000, then 8000 1 1 0 from s61 (the click 30 east of the pad at 60.9 s) to s193; frame 21: the refinery in the \
screen's middle (the pad), its dock turned to the node north-east"""
proves = """AssistedPlacementBehavior (SnappingDistance 50, FACING_TOWARDS): a click 30 off the ore's suggested pad puts the \
refinery within 20 of the pad (not within 8 of the click), turned to face the node -- against assistpoff:b, same input"""
expect = ["rows[-1]['矿场总数'] == 1", "rows[-1]['提示位20内'] == 1", "rows[-1]['点击处数量'] == 0"]
mismatch = "sim 矿场总数 0 throughout: the simulator does not replay the bench's sidebar queue / placement clicks; bench 1 1 0 from s61"

[[reading]]
bench_id = "engine_assistplace_e"
id = "without_the_hint_it_stays_by_the_click"
scene = {build = "assistpoff", check = "b", until = 60}
bench = """assistpoff:b (only the hint include removed), CampAsstOffB_mcp_1123_081929: 8000 1 0 0 from s62 (the same click at \
62.5 s) to s206; frame 20: the refinery right of the middle, under the click, in its default facing (not turned to the node)"""
proves = """the control: with the module gone the same click is not pulled to the pad (0 within 20) -- it stands by the click, \
though not within 8 of the computed click point (the bench's screen-to-world error)"""
expect = ["rows[-1]['矿场总数'] == 1", "rows[-1]['提示位20内'] == 0"]
mismatch = "sim 矿场总数 0 throughout: the simulator does not replay the bench's sidebar queue / placement clicks; bench 1 0 0 from s62"

