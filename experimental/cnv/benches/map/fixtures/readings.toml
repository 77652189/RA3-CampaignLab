# Bench readings of engine_area in checks.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# Area counts (E1), bench 2026-10-25 / 11-04.

[[reading]]
bench_id = "engine_area"
id = "area_counts_whose_units_as_the_bench"
scenes = {field = {build = "engine_area", check = "field", until = 13}, camp = {build = "engine_area", check = "camp", until = 13}}
bench = """\
In the west field, three of the player's Guardians -- the player's kind count 3, the enemy's kind count 3 too (a KindOf \
count takes every player's), the enemy's template count 0 and SKIRMISH_PLAYER_HAS_UNITS_IN_AREA(enemy) false (those \
take only the named player's); at the north base the player's kind count 2 (the enemy's warriors), the template count \
0. The bench measured "has units" only where the named player has none (the half that matters: it does not take \
another player's) (bench 2026-10-25 / 11-04)"""
proves = "sim area counts: a KindOf count takes every player's units, a template count and 'has units' only the named player's"
expect = "vals(field)[-1] == [3, 3, 0, 0] and vals(camp)[-1] == [2, 0]"

[[reading]]
bench_id = "engine_area"
id = "area_alias_masks_set_each_enemy_and_count_any"
scene = {build = "engine_area", check = "als", until = 10}
bench = "als (A347, CampAreaAls_mcp_1124_031222), 钱 有 every 0.5 s: s1.1-s1.6 12 5 | s2.1-s11.1 13 5"
proves = """PLAYER_SET_MONEY("<1st Human Player's Enemies>", 7000) sets Soviet_1 (>= 5000 after) and not the human (1000 \
kept); SKIRMISH_PLAYER_HAS_UNITS_IN_AREA with an alias is any player of the mask: the enemies at the camp yes, in the \
field (the player's Guardians) no, Allies incl Self yes, Allies (not self) no"""
expect = ["all(v[1] == 5 for v in vals(rows))", "vals(rows)[-1] == [13, 5]"]

[[reading]]
bench_id = "engine_area"
id = "area_alias_another_enemy_starts_with_money"
scene = {build = "engine_area", check = "als", until = 10}
bench = "als (CampAreaAls_mcp_1124_031222): 钱 12 before the 3 s set (4 = the alias >= 5000 while Soviet_1 holds 1000)"
proves = "the other enemies of the human (Soviet_2..6, money no script sets) hold >= 5000 from the start"
expect = "vals(rows)[0] == [12, 5]"

[[reading]]
bench_id = "engine_area"
id = "area_every_player_starts_with_ten_thousand"
scene = {build = "engine_area", check = "cash", until = 6}
bench = "cash (A349, CampAreaCash_mcp_1124_041836), 钱0..3 every 1 s: s1-s7 128 128 128 8 (8 steps = >= 10000, < 10001)"
proves = "with no script money Player_1 and Soviet_1..6 each hold exactly 10000 from the start, and keep it (idle); the bench enters through the campaign menu (nav.STEPS), so this is the campaign start: SageXML System/PlayerTemplates.xml StartingMoney Amount 10000 of Allies / Soviet / Japan (no CampaignOverrides entry), read by Money.start"
expect = "all(v[:4] == [128, 128, 128, 8] for v in vals(rows))"

# E297, engine_bridgesegment:a (CampBridgeSegA_mcp_1127_090706).
[[reading]]
bench_id = "engine_bridgesegment"
id = "short_bridge_gate_follows_proxy_damage"
scene = {build = "engine_bridgesegment", check = "a", until = 23}
bench = "Short/long gate: 100/100 at s2.8-s7.8, 80/100 at s8.87-s15.87; long remains 100 through s24.93"
proves = "The short HB_Bridge_02 gate follows 200 damage to its proxy while the undamaged long gate remains full."
expect = ["win(4, 6, '短门') == [100] * 3", "win(11, 14, '短门') == [80] * 4", "win(4, 22, '长门') == [100] * 19"]

[[reading]]
bench_id = "engine_bridgesegment"
id = "short_bridge_center_and_proxy_share_nonlethal_damage"
item = "物体模块 Body/ManagedActiveBody"
scene = {build = "engine_bridgesegment", check = "a", until = 23}
bench = "Short gate / long gate / short center / center count: 100/100/100/32 at s2.8-s7.8, 80/100/80/32 at s8.87-s15.87, 60/100/60/32 at s16.93-s24.93. ua: gives 800/1000 at f121 and 600/1000 at f241 for the short proxy and center."
proves = "The live scripted reference to the generated short HB_Bridge_02_Center follows proxy damage; 200 direct damage via that reference also reaches the proxy and gate. Both bridges keep their center counts (1 short, 2 long)."
expect = ["win(4, 6, '中血') == [100] * 3", "win(11, 14, '中血') == [80] * 4", "win(19, 22, '中血') == [60] * 4", "win(19, 22, '短门') == [60] * 4", "win(4, 22, '中量') == [32] * 19"]

[[reading]]
bench_id = "engine_bridgesegment"
id = "long_bridge_centers_alternate_by_position"
scene = {build = "engine_bridgesegment", check = "b", until = 14}
bench = "E298 (CampBridgeSegB_mcp_1127_103304): the four type bands read 1/2/1/2 at s2.87-s16.87. At f121 one 200-damage hit to the long proxy produces ua: rows at x=2400/2550/2700/2850, y=4200, z=212.5, one row in each center band, all 800/1000 HP."
proves = "The eastbound 700-unit HB_Bridge_02 pair has centers A/B/A/B at offsets 150/300/450/600 from the start. The replay checks generation by type and position band."
expect = "vals(rows)[3:12] == [[1, 2, 1, 2]] * 9"

[[reading]]
bench_id = "engine_bridgesegment"
id = "lethal_short_bridge_center_hit_breaks_proxy_and_kills_center"
item = "物体模块 Body/ManagedActiveBody"
scene = {build = "engine_bridgesegment", check = "c", until = 15}
bench = "E301 (CampBridgeSegC_mcp_1127_120419): short gate / long gate / short proxy / center count read 100/100/100/32 at s2.73-s7.73, then 1/100/1/31 at s8.67-s17.73. At f121 ua: records the short proxy at 1/1000 and its center at 0/1000."
proves = "A single 20000-point scripted hit to the short center kills it and damages the short proxy and its gatehouse in the same hit. The long gate stays full and both long A centers survive."
expect = ["vals(rows)[4:7] == [[100, 100, 100, 32]] * 3", "vals(rows)[10:15] == [[1, 100, 1, 31]] * 5"]

# Bench readings of engine_bridgefix in checks.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# The bench's watch second sN is the simulator's mission second N + 1 here: the break (timer 8.0) reads 1 from s7 on
# the bench, from 8 in the run; the press is timer 14.0.

[[reading]]
bench_id = "engine_bridgefix"
id = "an_engineer_mends_a_broken_bridge_at_its_gatehouse"
item = ["脚本动作 NAMED_USE_COMMANDBUTTON_ABILITY_ON_NAMED:Command_CaptureBuilding", "物体模块 Body/ManagedImmortalBody"]
scene = {build = "engine_bridgefix", check = "a", until = 40}
bench = "a, run 2 (CampBridgeFixA_mcp_1122_202537), 门a 态a 态b 门c: s1-s6 100 1110 110 100 | s7-s13 1 1110 110 1 | s14 1 1101 101 1 | s15-s17 1 1111 111 1 | s18-s68 100 1110 111 1"
proves = "engine/objects/bridge.py + order.capture_due: a named bridge's gatehouses '<start>_GateHouse1' (at the start, within 150) / '2' read their proxy's health (100, 1 once broken); an engineer pressed at a broken bridge's gatehouse walks up, is used up and mends the bridge to 100, the gatehouse keeping its owner; at a whole bridge's gatehouse he stays (b); a broken bridge nobody enters stays at 1 (c). The seconds of the walk (the next reading) left free"
let = {want = "lambda t: [100, 1110, 110, 100] if 2 <= t <= 7 else [1, 1110, 110, 1] if 8 <= t <= 14 else [1, 1111, 111, 1] if t == 16 else [100, 1110, 111, 1] if t >= 19 else None"}
expect = [
  "all(v == want(t) for v, t in zip(vals(rows), times) if want(t) is not None)",
  "win(15, 18, '门c') == [1] * 4",
]

[[reading]]
bench_id = "engine_bridgefix"
id = "the_engineer_takes_four_seconds_to_the_gatehouse"
scene = {build = "engine_bridgefix", check = "a", until = 40}
bench = "a, run 2: 态a s14 1101 (still home), s15-s17 1111 (away), s18 1110 (gone, 门a 100)"
proves = "order.capture_due: the walk from the press to the entry (travel and the entry's reach INFERRED, CAPTURE_REACH)"
expect = "win(15, 19, '态a') == [1101, 1111, 1111, 1111, 1110] and win(17, 18, '门a') == [1, 1]"
mismatch = "sim 态a 1111 1111 1110 1110 1110 at 15-19, 门a 100 from 17: the engineer is off home within the press's second and in 2 s early; bench still home at 15, in at 19"

