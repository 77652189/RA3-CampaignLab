[[reading]]
bench_id = "engine_lift"
id = "native_air_lifts_kill_without_a_latched_bit"
scene = {build = "engine_liftair", check = "a", until = 19, shot_clock = true}
bench = "CampLiftAirA_mcp_1116_142206: s15-26 = 0 / 100 / 100 / 10 -- the three retail air targets died and never latched LIFTED, the deleted-nugget control lived"
