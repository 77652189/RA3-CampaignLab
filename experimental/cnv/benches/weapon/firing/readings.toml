id = "guard_does_not_follow_a_target_driving_off"
scene = {build = "acquire_gst450", check = "frames", until = 33}
bench = "远 0 all along (never within 180 of F), the tank's health 50 from s12 to s33: no shot after s12 though the tank stood at N to s14"
