# B 11-26: the guard AIData fields. gst / gsc / gch: the Guardian TEAM_GUARDs the half-100 square round S from its birth
# (s1), the tank (450 north) is driven to N (180 north) at s4 and off to F (700 north) at s14; gsc / gch splice one
# AIData field into the global stream (CampAqG15/16/17Frames_mcp_1126_2017-2020, the three runs read the same, gsc 1 s
# later all through: the start's jitter). Rows: 远 原地 近敌 坦克血 = 0 0 1 100 to s5, 87 s6, 75 s8, 62 s10, 50 from s12.

[[reading]]
bench_id = "engine_acquire"
id = "guard_enemy_scan_rate_60s_does_not_hold_the_guard_back"
item = "AI 全局常量/AIData.GuardEnemyScanRate"
scenes = {st = {build = "acquire_gst450", check = "frames", until = 33}, sc = {build = "acquire_gsc450", check = "frames", until = 33}}
bench = """\
the tank first hurt at s6 (stock, scan 500 ms) and s7 (GuardEnemyScanRate 60000 ms: a scan due 60 s after the guard \
began would leave it whole to s61); the field is the guard machine's scan interval in milliseconds (work/re \
l4_aidata_readers.md), the guard takes the tank coming into its reach without waiting on it"""
proves = "sim idle_chase under a guard order: a guarding unit takes an enemy coming into its reach at once -- GuardEnemyScanRate does not hold it back"
let = {hurt = "lambda r: next(i for i, x in enumerate(r) if x['坦克血'] < 100)"}
expect = ["hurt(sc) <= hurt(st) + 3", "hurt(sc) <= 10"]

[[reading]]
bench_id = "engine_acquire"
id = "guard_chase_unit_frames_30_leaves_the_guard_as_stock"
item = "AI 全局常量/AIData.GuardChaseUnitFrames"
scenes = {st = {build = "acquire_gst450", check = "frames", until = 33}, ch = {build = "acquire_gch450", check = "frames", until = 33}}
bench = """\
GuardChaseUnitFrames 30 (stock 15000) reads second for second as stock: 远 0 all along, the tank left at 50 from s12. \
Stock does not follow the tank off here either (guard_does_not_follow_a_target_driving_off), so this shows only that a \
1 s chase limit changes nothing in this scene, not where the limit would bite"""
proves = "sim: GuardChaseUnitFrames is not read -- a short chase limit leaves the guard's run as stock"
expect = ["[r['远'] for r in st] == [r['远'] for r in ch]", "st[-1]['坦克血'] == ch[-1]['坦克血']"]

[[reading]]
bench_id = "engine_acquire"
id = "max_retaliate_distance_5000_or_1_leaves_the_guard_as_stock"
item = "AI 全局常量/AIData.MaxRetaliateDistance"
scenes = {st = {build = "acquire_gst450", check = "frames", until = 33}, sm = {build = "acquire_gsm450", check = "frames", until = 33}, sn = {build = "acquire_gsn450", check = "frames", until = 33}}
bench = """\
11-27 (CampAqG24/25/15Frames_mcp_1127_112913 / 113035 / 113152): MaxRetaliateDistance 5000 and 1 (stock 410; read as \
the guard's chase leash and x 0.3 as the guard-return scan radius, work/re l4_aidata_readers.md) read second for \
second as stock: 远 0, 近敌 1 all along, the tank 87 s6 ... 50 from s12. So the leash is not what stops the guard \
firing at s12 (guard_does_not_follow_a_target_driving_off); this shows the field changes nothing here, not where it bites"""
proves = "sim: MaxRetaliateDistance is not read -- a guard's run is the same with the leash at 5000 or 1"
expect = ["[list(r.values()) for r in st] == [list(r.values()) for r in sm] == [list(r.values()) for r in sn]"]

[[reading]]
bench_id = "engine_acquire"
id = "a_hit_tank_calls_no_friend_in_whatever_retaliate_friends_radius"
item = "AI 全局常量/AIData.RetaliateFriendsRadius"
scenes = {fs = {build = "acquire_rfs180", check = "frames", until = 26}, fz = {build = "acquire_rfz180", check = "frames", until = 26}}
