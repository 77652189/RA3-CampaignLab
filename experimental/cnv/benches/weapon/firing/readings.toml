# Bench readings of benches/weapon/firing/checks.py#engine_acquire (format: experimental/cnv/readings.py; runner: tests/conformance).
# Bench 2026-11-10 engine_acquire with a stance set at birth: an enemy Guardian (weapon 150, VisionRange 200) and the
# player's NO_ATTACK tank d north. GUARD (idle180 / 220 in test_simbench.py): fires in place at 180, walks in at 220 and
# back home by s16. Row 0 (the second before the start) is left out of every reading, as the old helper did.

[[reading]]
bench_id = "engine_acquire"
id = "test_stance_hold_position_fires_in_reach_and_goes_after_nothing"
scenes = {near = {build = "acquire_hold180", check = "frames", until = 26}, far = {build = "acquire_hold220", check = "frames", until = 26}}
bench = "hold180: 原地 1 all along, 坦克血 100 -> 86 s2 ... 3 (as GUARD's idle180). hold220: 原地 1, 近敌 0, 坦克血 100 all 26 s -- where GUARD walks in and fires"
proves = "StancesBehavior HOLD_POSITION: fires in reach and goes after nothing"
expect = [
  "all(r['原地'] == 1 for r in near[1:]) and near[-1]['坦克血'] < 50",
  "all(r['原地'] == 1 and r['近敌'] == 0 and r['坦克血'] == 100 for r in far[1:])",
]

[[reading]]
bench_id = "engine_acquire"
id = "test_stance_aggressive_walks_in_and_stays"
scenes = {a220 = {build = "acquire_agg220", check = "frames", until = 26}, a240 = {build = "acquire_agg240", check = "frames", until = 26}, a260 = {build = "acquire_agg260", check = "frames", until = 26}}
bench = "agg220: 原地 0 and 近敌 1 from s1 to s26, 坦克血 down to 3 by s14 -- it never walks back (GUARD home s16). agg240 / agg260: 原地 1, 坦克血 100 all along: the same reach as GUARD"
proves = "StancesBehavior AGGRESSIVE: walks in and stays; the same reach as GUARD"
expect = [
  "a220[-1]['坦克血'] < 50 and all(r['原地'] == 0 for r in a220[4:]) and a220[-1]['近敌'] == 1",
  "all(r['原地'] == 1 and r['坦克血'] == 100 for r in a240[1:] + a260[1:])",
]

