# stream. CampAqG18/19Frames_mcp_1127_081614 / 081457 read second for second the same: 远 起点 近敌 坦克血 = 1 0 1 100 s1,
# 87 s2-3, 74 s4-5, 60 s6-7, 0 1 0 60 from s8 to s33.

[[reading]]
bench_id = "engine_acquire"
