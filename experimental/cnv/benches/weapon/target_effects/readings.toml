# Bench readings of benches/weapon/target_effects/checks.py#engine_inform (format: experimental/cnv/readings.py).

[[reading]]
bench_id = "engine_inform"
id = "inform_target_does_not_add_damage_to_the_separate_damage_nugget"
scene = {build = "engine_inform", check = "damage", until = 16, shot_clock = true}
bench = "Check documents 79/1/79/1 (damage-isolation prediction after the second burst)."
proves = "InformTargetNugget: both lanes retain 79% HP and survive the marker and two damage hits; target notification adds no HP damage."
expect = "list(rows[-1].values()) == [79, 1, 79, 1]"

# Bench readings of benches/weapon/target_effects/checks.py#engine_inform_ai.
# Packed: 1e9 * shield before hit + 1e8 * automatic shield + 1e6 * first hit frame
# + 1000 * first shield frame + HP percent. Frame 135 is the never-seen sentinel.
# The runner includes the legacy s36 sample with until=37.

[[reading]]
bench_id = "engine_inform_ai"
id = "inform_ai_advance_response_matches_engine_inform_ai_observation[a]"
scene = {build = "engine_inform_ai", check = "a", until = 37, shot_clock = true}
bench = "second automatic run: 1187051068/87135068/101003068/87135089 in the frozen automatic window"
proves = "InformTargetNugget / miner self-defense AI: base shields before its first hit, instant shields after its first hit, player and low controls do not auto-shield"
let = {expected = "[1187051068, 87135068, 101003068, 87135089]"}
expect = [
    "vals(rows)[-1] == expected",
    "all(v == expected for sec, v in zip(times, vals(rows)) if sec >= 31)",
]
mismatch = "Final simulator 1191052068/91135068/101007068/91135089, bench 1187051068/87135068/101003068/87135089. The miners are HarvesterController's (handed over to the default team): base shields before its hit as on the bench (frames 91/52 vs 87/51, the p1 shells land 4 frames late); order shields after its hit (TrackDamage) at 7, the bench 3: the micro's round is every 8 frames (300, 308; hit 302), the bench's 2 frames after the hit (phase not read); high is hit as on the bench but 4 frames late as base: s1 plays the Heidelberg container's AIP_A03_Soviet01BaseMarshall (the game's own data, no standing LandDefense to take the gun), written out in the check."

[[reading]]
bench_id = "engine_inform_ai"
id = "inform_ai_track_damage_keeps_the_instant_hit_not_the_shell"
scenes = {a = {build = "engine_inform_ai", check = "a", until = 37, shot_clock = true}, off = {build = "engine_inform_ai", check = "off", until = 37, shot_clock = true}}
bench = "a: order 101003068 (instant 150 UNRESISTABLE, shield after the hit); off: base 87135068 (the same 30 % by a shell, no launch notice: hit, never shields)"
proves = "TrackDamage (SovietMiner TimeToTrack 2s, InstantWeaponsOnly): the micro's look-behind counts the instant hit it took, not the shell's"
item = "物体模块 Behaviors/TrackDamage"
expect = [
    "vals(a)[-1][2] // 100000000 == 1",
    "vals(off)[-1][0] // 100000000 == 0 and vals(off)[-1][0] % 1000 == 68",
]

[[reading]]
bench_id = "engine_inform_ai"
id = "inform_ai_handed_over_miner_shields_before_an_informed_hit"
scene = {build = "engine_inform_ai", check = "a", until = 37, shot_clock = true}
bench = "second automatic run: base 1187051068 (shield seen before damage and automatically), removed 87135089 (none)"
proves = "a script-made miner handed to the AI by UNIT_AI_TRANSFER_ALL is recruited (retail HarvesterController) and its micro arms the toggle on the look-ahead; the 10 % shell does not"
expect = [
    "vals(rows)[-1][0] // 100000000 == 11",
    "vals(rows)[-1][3] // 100000000 == 0",
]

[[reading]]
bench_id = "engine_inform_ai"
id = "inform_ai_advance_response_matches_engine_inform_ai_observation[off]"
scene = {build = "engine_inform_ai", check = "off", until = 37, shot_clock = true}
bench = "third run, base InformTargetNugget removed: 87135068/87135068/101003068/87135089 in the frozen automatic window"
proves = "InformTargetNugget / miner self-defense AI: base loses the automatic shield without its launch notification in this recipe"
let = {expected = "[87135068, 87135068, 101003068, 87135089]"}
expect = [
    "vals(rows)[-1] == expected",
    "all(v == expected for sec, v in zip(times, vals(rows)) if sec >= 31)",
]
mismatch = "Final simulator 91135068/91135068/101007068/91135089, bench 87135068/87135068/101003068/87135089. As [a]: base, high and removed as on the bench but 4 frames late; order shields 4 frames late (the micro's round)."

[[reading]]
bench_id = "engine_inform_expiry"
id = "inform_expiry_the_look_ahead_reads_a_row_past_its_deadline"
scenes = {stale = {build = "engine_inform_expiry", check = "stale", until = 37, shot_clock = true}, off = {build = "engine_inform_ai", check = "off", until = 37, shot_clock = true}}
bench = "11-25 CampIExpStale_mcp_1125_125805: base 1187003068 (row hit 328 / expiry 303 at launch 302, shield 3 frames after the order, row kept to 336); off (no notice) base 87135068"
proves = "TrackIncomingWeaponFire: the miner's micro reads the launch notice its table holds -- past the row's expiry too -- and shields before the shell; without the notice it never does"
item = "物体模块 Behaviors/TrackIncomingWeaponFireBehavior"
expect = [
    "vals(stale)[-1][0] // 100000000 == 11",
    "vals(off)[-1][0] // 100000000 == 0",
]

