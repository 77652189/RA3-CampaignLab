    "all(abs(p - (100 - (t - 3) * 10 / 3)) <= 2 and s == 100 for t, p, c, s, k in hp if 3 <= t <= 15)",
    "all(abs(c - 83) <= 1 and k == 1111 for t, p, c, s, k in hp if 9 <= t <= 14)",
    "all(abs(p - 60) <= 1 and abs(c - 83) <= 1 and s == 100 and k == 1110 for t, p, c, s, k in hp if t >= 16)",
    "all(k == 111 for t, p, c, s, k in hp if 3 <= t <= 7)",
]

# Bench readings of engine_invuln in checks.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# Invulnerability, bench 2026-11-04. The bench's seconds run 1-2 s ahead of the mission's timers: the simulator's
# readings, in mission seconds, are asserted at most 2 s later than the bench's.

[[reading]]
bench_id = "engine_invuln"
id = "invuln_the_modifier_alone_keeps_nothing_whole_as_the_bench"
scene = {build = "engine_invuln", check = "invuln", until = 51}
each = [{build = "engine_invuln"}, {build = "engine_invuln_enemy"}]
bench = """\
engine_invuln (targets neutral, handed to the enemy at 8 s by NAMED_TRANSFER_OWNERSHIP_PLAYER) and _enemy (enemy \
throughout): every lane hurt from s7 (A 1111, B 11), the kept-dark ones too; high's health falls at one pace through \
dark, lit and dark again -- below 90 / 75 / 60 / 45 % at s15 / s23 / s33 / s43 (bench 2026-11-04)"""
proves = "sim invulnerability: the modifier alone keeps nothing whole, every lane is hurt and health falls at one pace through dark and lit"
let = {chg = "[(t, r) for i, (t, r) in enumerate(zip(times, rows)) if i == 0 or r != rows[i - 1]]", at = "lambda k, p: next((t for t, r in chg if p(r[k])), None)"}
expect = [
    "rows[-1]['无敌甲'] == 1111 and rows[-1]['无敌乙'] == 11 and at('无敌甲', lambda v: v == 1111) <= 9",
    "all(b <= at('无敌丙', lambda v, w=w: v >= w) <= b + 2 for b, w in ((15, 1), (23, 11), (33, 111), (43, 1111)))",
]

[[reading]]
bench_id = "engine_invuln"
id = "invuln_kinds_the_aura_box_holds_as_the_bench"
scene = {build = "engine_invuln_kinds", check = "invuln", until = 51}
bench = """\
engine_invuln_kinds: the box beside the A09 Iron Curtain aura object is never hurt (无敌甲 1100, 乙 11) -- it is a \
PropBody (no health to take: engine_propbody a, simunits.prop_body), so no aura is needed to hold it (bench \
2026-11-04; line E, 11-10)"""
proves = "sim PropBody (simunits.prop_body): a prop box has no health to take, the aura is not what holds it"
expect = "rows[-1]['无敌甲'] == 1100 and rows[-1]['无敌乙'] == 11"

