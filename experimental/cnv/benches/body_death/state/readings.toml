# Bench readings of engine_crush in checks.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# Moved from tests/test_simbench.py (T3 A): until is the old run's until + 1 (47.7 -> 48). Bench 2026-11-06 engine_crush
# (docs/engine/crush.md; one run each): `all` 步兵 170127043 (a Hammer drives over an enemy conscript: crushed frame 43,
# never left its spot, lay dying 127 frames), 坦克 605069701 (a guardian, 20 against 20, lives the whole run; an
# Apocalypse crushes one at frame 69), 建筑 1000 (a plant killed by script: dying the kill frame only); `b` the
# Apocalypse never crushes a Sickle (30 against 30). The simulator has no acceleration: its tanks arrive ~25 frames
# sooner and crush a few to ~15 frames earlier -- the frames are bands, the rest exact.

[[reading]]
bench_id = "engine_crush"
id = "crush_a_tank_drives_over_a_lower_level_and_leaves_an_equal_one"
item = [
    "物体模块 Behaviors/SquishCollide",
    "物体模块 Behaviors/CrushDie",
]
scenes = {a = {build = "engine_crush", check = "all", until = 48}, b = {build = "engine_crush_b", check = "two", until = 48}}
bench = "步兵 crushed at frame 43; lane 2 a guardian (20 against 20) never crushed; lane 3 the Apocalypse crushes one (69); the Hammer goes round / on to its goal; b: the Sickle (30 against 30) alive, never dying (bench 2026-11-06 engine_crush all / b two)"
proves = "sim.Sim.crush_along, engine/modules/crush.py: a tank drives over a lower level and leaves an equal one"
expect = [
    "39 <= a[-1]['步兵'] % 1000 <= 55",
    "a[-1]['坦克'] % 1000 == a[-1]['帧数']",
    "45 <= a[-1]['坦克'] // 1000 % 1000 <= 80",
    "a[-1]['坦克'] // 10 ** 6 > 0",
    "b[-1]['镰刀'] % 1000 == b[-1]['帧数'] and b[-1]['镰刀'] // 1000 % 1000 == 0",
]

[[reading]]
bench_id = "engine_crush"
id = "slow_death_a_crushed_conscript_lies_127_frames_dying_and_in_its_spot"
scene = {build = "engine_crush", check = "all", until = 48}
bench = "步兵 170127043: dying 127 frames (8.5 s of its SlowDeath), in its spot all the while, not after (bench 2026-11-06 engine_crush all)"
proves = "sim.Sim.dying, engine/modules/slowdeath.py: a crushed conscript lies 127 frames dying and in its spot"
expect = [
    "abs(rows[-1]['步兵'] // 1000 % 1000 - 127) <= 2",
    "rows[-1]['步兵'] // 10 ** 6 == rows[-1]['步兵'] % 1000 + rows[-1]['步兵'] // 1000 % 1000",
]

[[reading]]
bench_id = "engine_crush"
id = "destroy_die_a_building_killed_is_dying_one_frame_and_gone"
scenes = {a = {build = "engine_crush", check = "all", until = 48}, b = {build = "engine_crush_b", check = "two", until = 48}}
bench = "建筑 1000 (a plant killed by script: dying the kill frame only, no collapse object counted); b 电厂 1000 (bench 2026-11-06 engine_crush all / b two)"
proves = "sim DestroyDie: a building killed is dying one frame and gone"
expect = ["a[-1]['建筑'] == 1000", "b[-1]['电厂'] == 1000"]

# Bench readings of engine_drain in checks.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# Bench row s_k ~ mission second k + 2 (the press at 3 s shows first at s2).

[[reading]]
bench_id = "engine_drain"
id = "the_dreadnought_drains_while_its_toggle_is_on"
item = "物体模块 Behaviors/LoseHealthUpdate"
scene = {build = "engine_drain", check = "a", until = 22}
bench = """a, bench 11-23 CampDrainA_mcp_1123_111741: 血P 100 s1, 97 s2 .. 61 s13, 60 s14-s24; 血C 97 s2 .. 83 s6, 83 \
to s24; 血S 100 throughout; 态 111 s2-s5, 1111 s6-s13, 1110 s14-s24"""
proves = """LoseHealthUpdate on the retail Dreadnought: HealthTrigger 101 % drains from full health, 50 a second of 1500 while \
its own toggle is on, stops with the second press; UNDER_IRON_CURTAIN (ForbiddenStatus) holds it; GENERIC_TOGGLE_STATE \
given by script without the press drains nothing on the retail host too (E146's tank was not the reason)"""
