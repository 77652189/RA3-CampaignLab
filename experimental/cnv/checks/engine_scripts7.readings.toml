# Bench readings of checks/engine_scripts7.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# Script conditions and actions, bench 2026-11-09.

[[reading]]
id = "scripts7_idle_for_frames_drops_the_order_as_the_bench"
scene = {build = "engine_scripts7", check = "idle", until = 26}
bench = """\
idle: UNIT_IDLE_FOR_FRAMECOUNT 15 and 1 on a moving Guardian -- neither got to its goal (25 s), the control did (二到 1 \
from s14): the order is dropped, as the seconds version's (bench 2026-11-09)"""
proves = "sim UNIT_IDLE_FOR_FRAMECOUNT: an idle unit's order is dropped, as the seconds version's"
expect = "vals(rows)[-1] == [0, 1, 0]"

[[reading]]
id = "scripts7_attack_move_leaves_a_beaten_enemy_as_the_bench"
scene = {build = "engine_scripts7", check = "amove", until = 60}
bench = "amove: the attack-mover leaves its enemy at 12 % and arrives at s38 (bench 2026-11-09)"
proves = "sim attack-move: the mover leaves a beaten enemy (12 % left) and goes on, arriving at s38"
let = {by = "dict(zip(times, vals(rows)))"}
expect = "by[59][0] == 1 and by[59][2] > 0"
mismatch = "sim kills the enemy (甲敌 0 at 28 s), 甲到 1 only from s42; bench: enemy left at 12 %, arrives s38"

[[reading]]
id = "scripts7_a_moving_tank_fires_as_it_drives_by_as_the_bench"
scene = {build = "engine_scripts7", check = "amove", until = 60}
bench = """\
amove: MOVE_NAMED_UNIT_TO's tank hurt the enemy beside its lane as it drove by (乙敌 100 -> 60) and arrived (乙到 1 from \
s23). (The hit sizes are engine line C's: not compared.) (bench 2026-11-09)"""
proves = "sim MOVE_NAMED_UNIT_TO: a tank on a move order still fires at an enemy beside its lane"
let = {by = "dict(zip(times, vals(rows)))"}
expect = "by[59][1] == 1 and 0 < by[59][3] < 100"

[[reading]]
id = "scripts7_indestructible_stops_no_scripted_damage_as_the_bench"
scene = {build = "engine_scripts7", check = "panel", until = 13}
bench = """\
panel: 甲血 乙血 丁血 58 58 58 after NAMED_DAMAGE 200 at 2 s (the UNIT- and the TEAM-flagged ones as the control), 16 16 \
after another 200 at 8 s; 活着 15 -> 11 (NAMED_KILL of a flagged one) (bench 2026-11-09; 16 on the bench, 17 here: the \
percent's rounding)"""
proves = "sim indestructible flags: scripted damage (not a kill) stops at a flagged unit, the unit- and the team-flag alike"
let = {by = "dict(zip(times, vals(rows)))", h1 = "by[11][0]", h2 = "by[11][1]", h4 = "by[11][2]", alive = "by[11][3]"}
expect = [
    "by[3] == [58, 58, 58, 15] and by[5][3] == 11",
    "abs(h1 - 16) <= 1 and h2 == 58 and abs(h4 - 16) <= 1 and alive == 11",
]

[[reading]]
id = "scripts7_object_lists_and_the_nearest_refs_as_the_bench"
scene = {build = "engine_scripts7", check = "list", until = 11}
bench = """\
list: 列表 4 (an object list read as a type), 单类 1 (a type added twice counts once); 参考 1 (the named nearest, \
SET_REF_TO_NEREST_TEAM_OF_TYPE_OWNED_BY_PLAYER), 无名参考 2 (the UNNAMED one skips it) from s5 (bench 2026-11-09)"""
proves = "sim object lists and nearest-team refs: a list read as a type, a type added twice counts once, the named / unnamed nearest"
let = {by = "dict(zip(times, vals(rows)))"}
expect = "by[2][:2] == [4, 1] and by[9][1:] == [1, 1, 2]"

[[reading]]
id = "scripts7_a_type_added_to_a_list_later_as_the_bench"
scene = {build = "engine_scripts7", check = "list", until = 11}
bench = "list: a type added to an object list at 4 s is not counted (列表 stays 4) (bench 2026-11-09)"
proves = "sim PLAYER_HAS_OBJECT_COMPARISON keeps its answer till the objects change (cond_object): a type added to its list later, with no object made, removed or killed, is not counted"
let = {by = "dict(zip(times, vals(rows)))"}
expect = "by[9][0] == 4"
