# Bench readings of checks/engine_aifriendly.py (format: experimental/cnv/readings.py; runner: tests/conformance).

[[reading]]
id = "friendly_unit_target[aifriend]"
scene = {build = "aifriend", check = "a", until = 41}
bench = "E85 s40: friendly/enemy arrivals 0/0 with both MCVs alive (1/1)."
proves = "simai FriendlyUnit: both MCVs survive and the team is absent from both target regions at s40"
expect = [
    "win(40, 40, '友车存活') == [1] and win(40, 40, '敌车存活') == [1]",
    "win(40, 40, '到友车') == [0] and win(40, 40, '到敌车') == [0]",
]
mismatch = "E85: engine arrivals are 0 at both MCVs, while the default model sends 4 to the selected MCV. StaticDefense/selection boundary unresolved."

