# Bench readings of checks/engine_aipullpct.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# PullbackInjuredHealthPct 0.2 / 0.5, the same 30 % Soviet tanks and Crane (bench 2026-11-11).

[[reading]]
id = "pullback_threshold_low_reaches_the_fight"
scene = {build = "aipullpctlo", check = "a", until = 40.0}
bench = """\
low 0.2: health 30 s9-13; far 3 s15-16, far 4 s17; home 0 s3-33 (30 % is above the threshold, an initial \
non-trigger control); after further injury one survivor home s34-39, alive 0 from s40"""
proves = "simai pullback: below PullbackInjuredHealthPct the hurt tanks drive on to the far plant"
expect = ["30 in win(9, 13, '血量')", "any(r['到远厂'] >= 3 for r in rows)", "win(3, 32, '回家') == [0] * 30"]

[[reading]]
id = "pullback_threshold_high_returns_before_recycling"
scene = {build = "aipullpcthi", check = "a", until = 40.0}
bench = "high 0.5: health 30 s9-25; far 0 throughout; home 1 s19-20, home 4 s23; alive 4 until the return"
proves = "simai pullback: at or under PullbackInjuredHealthPct all four tanks go home before reaching the far plant"
item = "AI 微操/AIMicroManagerData.PullbackInjuredHealthPct"
let = {home = "next(t for t, r in zip(times, rows) if t >= 14 and r['回家'] >= 1)"}
expect = ["30 in win(9, 13, '血量')", "all(r['到远厂'] == 0 for r in rows)",
          "any(r['回家'] == 4 for t, r in zip(times, rows) if t >= home)",
          "win(14, home, '坦克数') == [4] * (home - 13)"]

[[reading]]
id = "pullback_threshold_high_is_recycled_after_return"
scene = {build = "aipullpcthi", check = "a", until = 40.0}
bench = "high 0.5: alive 3 s24-25, 2 s26, 1 s27, 0 from s28 (Crane recycling)"
proves = "simai pullback: the returned tanks are recycled at the Crane"
expect = "win(28, 39, '坦克数') == [0] * 12"
mismatch = """\
simai keeps all four alive s28-39, bench 0 from s28: the Crane arrival event / geometry is missing (D43: refund at \
once, then deletion on actual arrival; entering the home area cannot supply that event). \
work/re/c_recycle_arrival_gate_report.md, work/re/handoff-c.md"""
