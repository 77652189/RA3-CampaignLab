  "all(v[:2] == want(v[2]) for v in vals(rows) if want(v[2]) is not None)",
  "{tuple(want(v[2])) for v in vals(rows) if want(v[2]) is not None} == {(0, 1), (1, 1), (2, 1), (3, 1)}",
]
