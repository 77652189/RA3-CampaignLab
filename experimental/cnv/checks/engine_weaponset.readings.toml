# Bench readings of checks/engine_weaponset.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# WeaponSetUpdate, bench 2026-11-09 engine_weaponset a / b (docs/engine/weaponset.md): a weapon line's ObjectStatus /
# ForbiddenObjectStatus choose the gun: GENERIC_TOGGLE_STATE throws Molotovs instead of the AK47; a Guardian under the
# toggle holds only the target painter (no damage).

[[reading]]
id = "test_weapon_set_the_status_picks_the_gun_molotov_under_the_toggle_and_the_painter_does_no_harm"
scenes = {a = {build = "engine_weaponset", check = "a", until = 42}, b = {build = "engine_weaponset", check = "b", until = 20}}
bench = "bench 基准血 / 毒瓶血 / 中途血 at s41: 42 / 9 / 21; 涂靶血 100 throughout"
proves = "WeaponSetUpdate: the status picks the gun (Molotov under the toggle, the target painter does no damage)"
let = {base = "[r['基准血'] for r in a]", high = "[r['毒瓶血'] for r in a]", order = "[r['中途血'] for r in a]"}
expect = [
  "abs(base[-1] - 42) <= 3 and abs(high[-1] - 9) <= 3 and abs(order[-1] - 21) <= 3",
  "order[8] == base[8] and order[20] < base[20]",
  "[r['涂靶血'] for r in b] == [100] * len(b)",
]
