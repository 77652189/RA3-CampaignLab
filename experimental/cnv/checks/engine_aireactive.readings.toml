# Bench readings of checks/engine_aireactive.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# ReactiveDefenseRadius gates the chase (bench 2026-11-14).

[[reading]]
id = "reactive_defense_radius_gates_the_chase"
scene = {build = "aireact750", check = "a", until = 30}
each = [{build = "aireact750", chased = false}, {build = "aireact1200", chased = true}]
bench = """\
a foe 1000 straight south of the yard: R 750 -- 家300 4, 敌300 0, 敌存活 1 to s80; R 1200 -- 家300 0 from s8, 敌300 4 \
s17-s27, the foe dead by s20 (simulator: out s10, 敌300 4 s18, dead s23)"""
proves = "simai reactive defense: ReactiveDefenseRadius gates the chase"
expect = "(first('家300', lambda v: v == 0) <= 12 and first('敌300', lambda v: v == 4) <= 20 and rows[-1]['敌存活'] == 0) if chased else all(r['家300'] == 4 and r['敌300'] == 0 and r['敌存活'] == 1 for r in rows)"
