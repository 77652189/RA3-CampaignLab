# Bench readings of checks/engine_aifav.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# The enemy table emptied by script (program: work/re a219_skirmish_transfer.md 2, a295_clear_priorities.md), each after aipriodef's
# SET_ALL 20 -- without the clear Player_1 at 20 stays the top tier and the far plant goes first (aipriodef).
# The first reading moved from tests/test_simai_favored.py. fav / clr1 set Player_1 30 first: with the action undone the
# simulator (one tier -> the near plant) goes far (review 1122ss #6, mutation-checked).

[[reading]]
id = "favored_enemy_alone_in_the_table_goes_for_its_plant"
scene = {build = "aipriofav", check = "a", until = 70.0}
bench = "aipriofav (Player_1 set 30 first; CampAIPrioFavA_mcp_1122_061838, 11-22): 到近厂 2 @ s14, 4 s15-s21; 到远厂 0 to s23 (11-14 without the 30: the same)"
proves = "SET_FAVORED_ENEMY: the table emptied, that enemy alone in it at 10"
let = {near = "first('到近厂')"}
expect = "near is not None and abs(near - 14) <= 2 and first('到远厂') is None"

[[reading]]
id = "clear_all_then_one_enemy_goes_for_its_plant"
scene = {build = "aiprioclr", check = "a", until = 70.0}
bench = "aiprioclr (CLEAR_ALL, then Soviet_4 10; CampAIPrioClrA_mcp_1122_003028): 到近厂 4 @ s16, 4 s18-s22; 到远厂 0 to s68"
proves = "CLEAR_ALL_ENEMY_PLAYERS_PRIORITIES: the table emptied (Player_1 out), the next put alone in it"
let = {near = "first('到近厂')"}
expect = "near is not None and abs(near - 15) <= 2 and first('到远厂') is None"

[[reading]]
id = "clear_one_enemy_leaves_the_other_alone"
scene = {build = "aiprioclr1", check = "a", until = 70.0}
bench = "aiprioclr1 (Player_1 set 30, then CLEAR_ENEMY_PLAYER_PRIORITY Player_1; CampAIPrioClr1A_mcp_1122_061719): 到近厂 2 @ s14, 4 s15-s21; 到远厂 0 to s23 (without the 30, 002725: s15)"
proves = "CLEAR_ENEMY_PLAYER_PRIORITY: that enemy's entry out, the others kept (Soviet_4 alone at 20)"
let = {near = "first('到近厂')"}
expect = "near is not None and abs(near - 14) <= 2 and first('到远厂') is None"
