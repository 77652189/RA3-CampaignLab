# IgnoreTargets.Rule ANY / ALL (E118 aiignrany / aiignrall: the retail EASY Include kept, only the Rule switched);
# Include / Exclude kinds (B 11-24 aiignrinc ANY Include ENGINEER / aiignrexc ALL Exclude ENGINEER, the same carrier)

[[reading]]
id = "ignore_rule_team_state_and_target"
scene = {build = "aiignrany", check = "r", until = 33, teams = true}
each = [{build = "aiignrany", state = 0, foe = true}, {build = "aiignrall", state = 8, foe = false},
        {build = "aiignrinc", state = 8, foe = false}, {build = "aiignrexc", state = 0, foe = true}]
bench = """\
E118 aiignrany:r / aiignrall:r (one run each, ra3ext CNVTeams lines, game frames): the micro team of two \
(CNVStateMicro) at f406 and f421 -- ANY state 0 with a target, ALL state 8 with none; both two members at \
f376 / f391 in the same places, the prerequisite latch 0 (work/re e118_ignore_rule.md). \
B 11-24 aiignrinc:r / aiignrexc:r (one run each, PASS, the same lines): Include ENGINEER state 8 target -1 at \
f376-436; Exclude ENGINEER state 8 at f376 / f391, then state 0 at f406 (target an engineer) and f421 (the other); \
both two members at f376 / f391 in the same places"""
proves = "simai IgnoreTargets.Rule / Include / Exclude: the micro team ignores an engineer the filter passes (IgnoreTargets ObjectFilter as the team filters: Exclude kinds block before ALL, ANY needs an Include kind) -- ANY with kinds the engineer lacks and ALL Exclude ENGINEER let it be the enemy and AlphaStrike's state 0 follows (an enemy engineer within 200 of the AI's barracks); ALL and ANY Include ENGINEER drop it, the team stays 8 with no enemy (B 11-21 b1121_ignore.md)"
item = ["AI 微操/IgnoreTargets.Rule", "AI 微操/IgnoreTargets.Include", "AI 微操/IgnoreTargets.Exclude"]
let = {seen = "[(r['frame'], r['state'], r['foe_id'] is not None) for r in teams() if r['state_key'] == 'CNVStateMicro' and len(r['members']) == 2 and r['frame'] in (406, 421)]"}
expect = "seen == [(406, state, foe), (421, state, foe)]"

[[reading]]
id = "ignore_rule_hurts_either_way_after_a_like_start"
scene = {build = "aiignrany", check = "r", until = 33, teams = true}
each = [{build = "aiignrany"}, {build = "aiignrall"}, {build = "aiignrinc"}, {build = "aiignrexc"}]
bench = "E118 (the same runs): 造出 2, 首伤 0, 失配 0 over f375-389; first hurt f396 (ANY) / f397 (ALL), latched; 失配 0 to the end. B 11-24 (the same runs): 造出 2, 首伤 0 at f373; first hurt f397 (Include) / f396 (Exclude), latched; 造出 2, 失配 0 to f824"
proves = "simai IgnoreTargets: the filter picks the micro target only -- a plain attack still hurts when the engineers are ignored (no coverage from damage alone)"
let = {before = "[r for r in rows if 375 <= r['帧数'] < 390]", after = "[r for r in rows if 421 <= r['帧数'] <= 480]"}
expect = [
    "before and all((r['造出'], r['首伤'], r['失配']) == (2, 0, 0) for r in before)",
    "after and all(r['造出'] == 2 and r['首伤'] >= 390 and r['失配'] == 0 for r in after)",
    "len({r['首伤'] for r in after}) == 1",
]
