# Bench readings of checks/movie.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# A scene's until is the old test's seconds + 1 (the old bare Sim.run(u) read the row of second u last).

[[reading]]
id = "video_a_radar_clip_is_done_after_its_length_full_screen_never"
scene = {build = "movie", check = "play", until = 31}
bench = "movie play (bench, docs/story/handoff.md 1g): CNVTEST01 (95 frames at 23.976) in the radar window done 63 game frames after its start; the full-screen clip never reads done"
proves = "sim movie playback: a radar-window clip is done after its length in game frames, a full-screen clip never reads done"
let = {last = "vals(rows)[-1]"}
expect = "abs(last[0] - 63) <= 3 and last[1] == 1 and last[3] == 0"
