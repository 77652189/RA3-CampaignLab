# Bench readings of checks/engine_leechdrone.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# E244: the retail Hammer given Leech_AircraftCarrier_Upgrade by script at 1 s and again at 7 s (on), with only its
# ObjectCreationUpgrade taken out (nocreate). 机 = p1's aircraft (the drone), 升 = Hammer has the upgrade 1 + alive 10.

[[reading]]
id = "on_nocreate_the_upgrade_makes_one_leeched_drone_and_a_second_grant_none"
item = "物体模块 Behaviors/ObjectCreationUpgrade"
scenes = {on = {build = "engine_leechdrone_on", check = "a", until = 13}, off = {build = "engine_leechdrone_nocreate", check = "a", until = 13}}
bench = "CampLeechOnA_mcp_1125_141339 / CampLeechNcA_mcp_1125_141814 at 4e375aca + E244: on 机 1, 升 11 s1-s13; nocreate 机 0, 升 11 s1-s13 (CampLeechNwA_mcp_1125_141600, SlaveWatcherBehavior out: as on)"
proves = """ObjectCreationUpgrade (retail: the Hammer's ThingToSpawn AlliedAttackDrone_Leeched): the upgrade given makes \
one drone for the Hammer's owner, and giving it again while held makes no second; without the module none is made"""
expect = ["on[-1]['机'] == 1 and off[-1]['机'] == 0",
          "all(r['升'] == 11 for r in on[2:] + off[2:])",
          "max(r['机'] for r in on) == 1"]

[[reading]]
id = "flak_on_nowatch_the_drone_downed_takes_the_upgrade_back_and_the_next_grant_makes_one"
item = "物体模块 Behaviors/SlaveWatcherBehavior"
scenes = {on = {build = "engine_leechdrone_on", check = "b", until = 14}, nw = {build = "engine_leechdrone_nowatch", check = "b", until = 14}}
bench = "CampLeechOnB_mcp_1125_184445 / CampLeechNwB_mcp_1125_184320 at e5dc7cc7 + E246: on 机 1 0 11 s1-s3, 0 0 10 s4-s7, 1 0 11 s8-s14; nowatch 1 0 11 s1-s3, 0 0 11 s4-s14 (the simulator downs the drone at s7, the bench at s4)"
proves = """SlaveWatcherBehavior (retail: the Hammer's, RemoveUpgrade Leech_AircraftCarrier_Upgrade): the leeched drone \
shot down takes the upgrade off its Hammer at once, so the next grant makes another; without the module the upgrade \
stays and the next grant makes none"""
expect = ["min(r['升'] for r in on[2:]) == 10 and on[-1]['升'] == 11 and on[-1]['机'] == 1",
          "all((r['机'] == 0) == (r['升'] == 10) for r in on[2:])",
          "all(r['升'] == 11 for r in nw[2:]) and max(r['机'] for r in nw) == 1 and nw[-1]['机'] == 0"]

[[reading]]
id = "master_nodie_the_drone_dies_with_its_hammer_with_or_without_dieonmastersdeath"
item = "物体模块 Behaviors/ObjectCreationUpgrade"
scenes = {on = {build = "engine_leechdrone_on", check = "c", until = 10}, nd = {build = "engine_leechdrone_nodie", check = "c", until = 10}}
bench = "CampLeechOnC_mcp_1125_220450 / CampLeechNdC_mcp_1125_220612 at 27966610 + E247: both 机 1 升 11 s1-s2, 0 0 s3-s11 (the simulator s5)"
proves = """ObjectCreationUpgrade: the Hammer killed by script takes its leeched drone with it at once, and the drone's \
DieOnMastersDeath="true" taken out changes nothing (INFERRED: the made slave dies with its master unconditionally)"""
expect = ["on[-1]['机'] == 0 and nd[-1]['机'] == 0 and on[-1]['升'] == 0",
          "all((r['机'] == 0) == (r['升'] == 0) for r in on[2:] + nd[2:])"]

[[reading]]
id = "leash_probe_makes_one_drone_and_moves_the_hammer_to_the_goal"
scenes = {stock = {build = "engine_leechdrone_leash", check = "l", until = 25}, long = {build = "engine_leechdrone_longleash", check = "l", until = 25}}
bench = "E294 CampLeechLsL_mcp_1127_082847 / CampLeechLlL_mcp_1127_082728: both 机/起/到/车 1/1/0/0 s1-s8, 1/0/0/0 s9-s12, 1/0/1/1 s13-s26"
proves = "Both arms spawn one aircraft near the start and the Hammer reaches the goal region."
expect = "all(any((r['机'], r['起'], r['到'], r['车']) == (1, 1, 0, 0) for r in rows) and (rows[-1]['机'], rows[-1]['车']) == (1, 1) for rows in (stock, long))"

[[reading]]
id = "the_leeched_drone_reaches_the_goal_with_either_leash"
scenes = {stock = {build = "engine_leechdrone_leash", check = "l", until = 25}, long = {build = "engine_leechdrone_longleash", check = "l", until = 25}}
bench = "E294 CampLeechLsL_mcp_1127_082847 / CampLeechLlL_mcp_1127_082728: both 起/到 0/1 s13-s26"
proves = "The drone reaches the goal region in this drive with either leash. The comparison does not isolate what issued the follow order."
expect = "all((rows[-1]['起'], rows[-1]['到']) == (0, 1) for rows in (stock, long))"
mismatch = "The replay keeps the drone at the start in both arms (起/到 1/0). See work/re/e294_slaved_follow.md."
