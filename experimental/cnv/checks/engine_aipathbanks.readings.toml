# Bench readings of checks/engine_aipathbanks.py (format: experimental/cnv/readings.py; runner: tests/conformance).

[[reading]]
id = "path_condition_disconnected_banks"
scene = {build = "aipcland", check = "a", until = 45}
each = [{build = "aipcland"}, {build = "aipcamph"}, {build = "aipclandy"}]
bench = "Bank probes read barracks 1 / power 0 at s22-24 (D108 and the early-registration follow-up: a pre-wake nobase return)."
proves = "simai path condition: disconnected banks answer \"cannot judge\" in the opening"
expect = "list(zip(win(22, 24, '兵营'), win(22, 24, '电厂'))) == [(1, 0)] * 3"

[[reading]]
