proves = "sim SQUADRON: two crashes of 95 at 75 frames (StrafeAreaUpdate fires the self-projectile kamikaze from its first frame, 1500 at speed 300) on the one enemy in the radius, the free aircraft at random points (between two and four crashes on it: the draw), the guns not simulated (150 / 200 whole)"
