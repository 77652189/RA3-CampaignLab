[[reading]]
id = "protofx_final_squadron_crashes_on_the_tank_in_its_radius"
item = ["脚本动作 PLAYER_FIRE_SPECIAL_POWER_AT_WAYPOINT", "物体模块 Behaviors/StrafeAreaUpdate"]
scenes = {f1 = {build = "engine_protofx", check = "f1", until = 20}, f2 = {build = "engine_protofx", check = "f2", until = 20}, f3 = {build = "engine_protofx", check = "f3", until = 20}, fn = {build = "engine_protofx", check = "fn", until = 20}}
