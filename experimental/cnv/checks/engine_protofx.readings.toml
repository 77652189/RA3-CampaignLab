# Bench readings of checks/engine_protofx.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# Bench 11-23 (work/bench_results/engine_protofx__<variant>.json); the cast ~s5, 帧数 = frames since it. Every variant
# run two to four times gave the same rows (the single-player game's draws repeat): the "random" ones are read as ranges.

[[reading]]
id = "protofx_o1_orbital_rank1_hits_the_centre_only"
item = "脚本动作 PLAYER_FIRE_SPECIAL_POWER_AT_WAYPOINT"
scene = {build = "engine_protofx", check = "o1", until = 20}
bench = "o1: 血0 血150 血250 血350 100 100 100 100 to s9, 55 at s9 (~70 frames after the cast), 20 from s10 to s49; the others 100 throughout"
proves = "sim PROTOCOL_HITS: two hits on the centre within 75, nothing at 150 and past"
expect = ["55 in [v[0] for v in vals(rows)]", "tuple(vals(rows)[-1]) == (20, 100, 100, 100)"]

[[reading]]
id = "protofx_o2_orbital_rank2_hits_nothing"
scene = {build = "engine_protofx", check = "o2", until = 45}
bench = "o2, three runs: 血0 血150 血250 血350 100 100 100 100 from s5 to s49"
proves = "sim no PROTOCOL_HITS for rank 2: nothing lands (why the bench's cast does nothing: not known)"
expect = ["all(set(v) <= {0, 100} for v in vals(rows))", "tuple(vals(rows)[-1]) == (100, 100, 100, 100)"]

[[reading]]
id = "protofx_o3_orbital_rank3_hits_the_150_target"
item = "脚本动作 PLAYER_FIRE_SPECIAL_POWER_AT_WAYPOINT"
scene = {build = "engine_protofx", check = "o3", until = 20}
bench = "o3, three runs alike: 100 throughout but 血150: 19 at s13-s14 (~140 frames after the cast), then +1 a second to 55 at s49; the centre, 250, 350 untouched"
proves = "sim PROTOCOL_HITS rank 3: one hit of 810 landing 150 off, reaching < 100 -- the centre and 250 whole (the defense's self-repair not simulated)"
expect = ["[v[1] for v in vals(rows)][8] == 100", "vals(rows)[-1][1] <= 30", "tuple(vals(rows)[-1][::2]) == (100, 100)", "vals(rows)[-1][3] == 100"]

[[reading]]
id = "protofx_ox_orbital_rank3_lands_off_the_centre"
scene = {build = "engine_protofx", check = "ox", until = 20}
bench = "ox (o3 with the defense at 150 deleted): 血0 血150 血250 血350 100 0 100 100 from s5 to s49"
proves = "sim the rank 3 debris does not land on the centre when nothing is at 150: a fixed spot, not drawn to a target"
expect = "all(v[0] in (0, 100) and v[2] in (0, 100) for v in vals(rows)) and vals(rows)[-1][0] == 100"

