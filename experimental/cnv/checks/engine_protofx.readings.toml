[[reading]]
id = "protofx_fl_squadron_guns_graze_800_first_and_never_1400"
scene = {build = "engine_protofx", check = "fl", until = 20}
bench = "CampProtofxFl 1124 at 09dd1a3a: 帧数 血400 血800 血1400 -- 100 99 100 from the first row (f6), 400 to 99 at f48, then 99 99 100 to the end (f776): one graze each, 1400 never"
proves = "SQUADRON's guns (StrafeAreaUpdate, the planes born 3000 out toward the Japanese yard, work/re a353_strafe.md A357): the foes on the target-yard line 800 out grazed by f6, 400 out at f48, 1400 out never -- neither 'born 3000 out' (1400 first) nor 'born 1500 out' (1400 at once) as the planes' flight"
expect = ["min(v[2] for v in vals(rows) if 0 < v[0] <= 10) == 99", "min(v[1] for v in vals(rows) if 0 < v[0] <= 40) == 100", "min(v[1] for v in vals(rows) if 0 < v[0] <= 60) == 99", "min(v[3] for v in vals(rows)) == 100"]
mismatch = "sim 100 100 100 throughout (the guns not simulated); bench 800 at 99 by f6, 400 from f48, 1400 100"

# A433 (11-28, for the Soviet line's "cold-war relics in the sky"): may a script drop these on a spot for any player, again
# and again, and do they hurt the caster's own side? Bench 11-28 work/bench_results/engine_protofx__<os oz or oc ms m3>.json.
[[reading]]
id = "protofx_os_orbital_rank1_hits_the_casters_own_tank"
item = "脚本动作 PLAYER_FIRE_SPECIAL_POWER_AT_WAYPOINT"
scene = {build = "engine_protofx", check = "os", until = 20}
bench = "os (p1 casts rank 1 on its own tanks): 帧数 血0 血150 -- 100 100 till f67, 15 100 from f73 to the end"
proves = "sim PROTOCOL_HITS land on friend and foe alike (XML ALLIES ENEMIES NEUTRALS): the caster's own tank at the centre hit, 150 whole"
expect = ["min(v[1] for v in vals(rows) if 0 < v[0] <= 60) == 100", "min(v[1] for v in vals(rows)) <= 20", "all(v[2] == 100 for v in vals(rows) if v[0] > 0)"]

[[reading]]
id = "protofx_oz_orbital_cast_by_a_player_with_nothing_hits_its_own"
item = "脚本动作 PLAYER_FIRE_SPECIAL_POWER_AT_WAYPOINT"
scene = {build = "engine_protofx", check = "oz", until = 20}
bench = "oz (s1 -- no construction yard, no protocol bought, no AI -- casts rank 1 on its own base defenses): 血0 血150 血250 血350 100 x4 to s9, 54 at s9, 11 from s10 to s49, the rest 100"
proves = "a script casts a protocol for any player, a yard or not, and its debris hits that player's own; sim casts for the player's book alike"
expect = ["min(v[0] for v in vals(rows)) <= 60", "tuple(vals(rows)[-1][1:]) == (100, 100, 100)"]

[[reading]]
id = "protofx_or_orbital_recast_is_cast_but_misses"
