# RandomTargetScoreModifier (B 11-22 airands0 / airandsx: the zero-keep Engage carrier aiegon -- AI-built warriors, a
# Hunt team, two conscripts -- only m differs, 0 / 1000). State 2 re-picks every member each micro pass (keep 0): the
# lowest score, times uniform(1/(1+m), 1+m) when m > 0 (work/re/l4_micro_engage.md 1.5). The bench side is CNVTeams
# kassign / kpass lines (src=score; kpass sc= each member's score per candidate), the simulator's each member's aim in
# teams(); both count how often a member's target changes while both conscripts stand. The draw is luck: the readings
# compare a fixed pick with a drawn one, not counts.

[[reading]]
id = "random_score_zero_keeps_each_members_pick"
scene = {build = "airands0", check = "a", until = 50, teams = true}
bench = """\
B 11-22 airands0:a (CampAIRandS0A_mcp_1122_181522 ra3ext kassign / kpass): both conscripts stand f375-543; within a \
run of state-2 passes no member's pick changes (3170 on 3168 every pass; 3171 on 3168 f375-391, on 3167 f495-543 \
after state 2 paused f399-487 and the scores moved with health); scores 200-350, the second candidate's at most 1.41x"""
proves = "simai state 2 pick with RandomTargetScoreModifier 0: the lowest score wins every pass, a member keeps its target"
item = "AI 微操/AIMicroManagerData.RandomTargetScoreModifier"
let = {trails = "{n: [m['aim'] for r in teams() for m in r['members'] if m['name'] == n and m.get('aim')] for n in {m['name'] for r in teams() for m in r['members']}}", switches = "{n: sum(a != b for a, b in zip(t, t[1:])) for n, t in trails.items()}"}
expect = "sum(1 for t in trails.values() if t) >= 2 and all(v <= 1 for v in switches.values())"

[[reading]]
id = "random_score_large_draws_each_members_pick"
scene = {build = "airandsx", check = "a", until = 50, teams = true}
bench = """\
B 11-22 airandsx:a (CampAIRandSXA_mcp_1122_181638, same queue): both conscripts stand f375-519; 3170 picks \
3168 3168 3167 | 3168 3167 3167 and 3171 3167 3168 3167 | 3167 3168 (passes f375-391 | f503-519): 3 changes each in \
about 10 passes; scores 860 to 3.3e5 (about 500x m=0's, the mean of uniform(1/1001, 1001)), median 2nd/1st 2.7"""
proves = "simai state 2 pick with RandomTargetScoreModifier 1000: the score's random factor swamps it, members keep changing target"
item = "AI 微操/AIMicroManagerData.RandomTargetScoreModifier"
let = {trails = "{n: [m['aim'] for r in teams() for m in r['members'] if m['name'] == n and m.get('aim')] for n in {m['name'] for r in teams() for m in r['members']}}", switches = "{n: sum(a != b for a, b in zip(t, t[1:])) for n, t in trails.items()}"}
expect = "sum(v >= 3 for v in switches.values()) >= 2"

[[reading]]
id = "keep_target_drawn_between_min_and_max"
scene = {build = "aikeeprng", check = "a", until = 50, teams = true}
bench = """\
B 11-23 aikeeprng:a (aiegon's carrier, TimeToKeepTargetMin 1s / Max 4s; CampAIKeepRngA_mcp_1123_011630 ra3ext \
kassign): 8 state-2 records keep 36 47 45 19 39 32 21 38 frames (15 a second: all in 15..60, spread 28); each member \
re-picked at the first pass at or after its until (514 -> 519, 540 -> 543, 564 -> 567). Also airett:a \
(CampAIRetTA_mcp_1123_011506, Min 3s / Max 5s): 12 state-6 records keep 45-69 frames"""
proves = "simai keep record: uniform(TimeToKeepTargetMin, Max) s per assignment, held until it runs out"
item = "AI 微操/AIMicroManagerData.TimeToKeepTargetMax"
let = {trail = "{n: [(r['frame'], m['keep']) for r in teams() for m in r['members'] if m['name'] == n and m.get('keep') is not None] for n in {m['name'] for r in teams() for m in r['members']}}", sets = "{n: [p for i, p in enumerate(t) if i == 0 or p[1] != t[i - 1][1]] for n, t in trail.items()}", lens = "[k - f for s in sets.values() for f, k in s]"}
expect = "len(lens) >= 6 and all(15 <= x <= 60 for x in lens) and max(lens) - min(lens) >= 15 and all(b[0] >= a[1] for s in sets.values() for a, b in zip(s, s[1:]))"
