proves = "Both the same-owner Hammer and the Hammer sent to a mutual ally's crane move into approach range, are lost, and credit 750 each to the tank owner. The module-off control never approaches and survives. State is ten times the survival bits plus the latched approach bits (same owner 1, module off 2, ally 4)."
expect = """
(any(45 <= r['Frame'] <= 68 and (r['State'], r['Wallet'], r['Ally Wallet']) == (70, 0, 0) for r in rows)
and any(76 <= r['Frame'] <= 90 and (r['State'], r['Wallet'], r['Ally Wallet']) == (75, 0, 0) for r in rows)
and (rows[-1]['Frame'], rows[-1]['State'], rows[-1]['Wallet'], rows[-1]['Ally Wallet']) == (225, 25, 1500, 0))
"""

