[[reading]]
id = "a_named_enter_order_recycles_a_hammer_for_750_at_its_own_crane"
scene = {build = "engine_cranerecycle", check = "a", until = 15.5}
bench = "E308 CampRecycleA_mcp_1127_151430: Frame / Alive / Approach / Wallet f45–68 3/0/0, f75–90 3/1/0, f98–225 2/1/750"
proves = "The owner's Hammer approaches the retail Soviet Crane, is lost, and credits 750. With only SlaughterHordeContain removed, the tank stays outside the approach area and survives."
expect = """
(any(45 <= r['Frame'] <= 68 and (r['Alive'], r['Approach'], r['Wallet']) == (3, 0, 0) for r in rows)
and any(75 <= r['Frame'] <= 90 and (r['Alive'], r['Approach'], r['Wallet']) == (3, 1, 0) for r in rows)
and (rows[-1]['Frame'], rows[-1]['Alive'], rows[-1]['Approach'], rows[-1]['Wallet']) == (225, 2, 1, 750))
"""

[[reading]]
id = "a_damaged_hammer_still_refunds_750_at_its_own_crane"
scene = {build = "engine_cranerecycle", check = "b", until = 15.5}
bench = "E317 CampRecycleB_mcp_1127_220539: Alive / Health / Wallet f43–81 3/50/0, f88 3/54/0, f95–225 2/54/750"
proves = "The same-owner Hammer starts the enter order at 50% health and still refunds 750. Health holds the last live sample. The increase to 54% on approach was observed; the exact repair and entry timing are outside this refund reading."
expect = """
(any(30 <= r['Frame'] < 45 and (r['Alive'], r['Health'], r['Wallet']) == (3, 50, 0) for r in rows)
and (rows[-1]['Frame'], rows[-1]['Alive'], rows[-1]['Wallet']) == (225, 2, 750)
and 0 < rows[-1]['Health'] < 100)
"""

