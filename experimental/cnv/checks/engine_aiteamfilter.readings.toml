# Bench readings of checks/engine_aiteamfilter.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# AlwaysRecruit: does a team that has gone out take the tanks the AI builds after it (bench 2026-11-09).

[[reading]]
id = "without_always_recruit_the_late_tanks_stay_home"
scene = {build = "aiar0", check = "a", until = 62.0}
bench = """\
aiar0 (AlwaysRecruit false): the two built after the team left stay home (built s20 / s30, 坦克在家 2 of 6 owned; \
the simulator s23 / s34)"""
proves = "simai team recruiting: without AlwaysRecruit the late tanks stay home"
expect = "rows[-1]['坦克在家'] == 2 and rows[-1]['坦克拥有'] == 6"

[[reading]]
id = "always_recruit_the_gone_team_takes_the_late_tanks"
scene = {build = "aiar1", check = "a", until = 62.0}
bench = """\
aiar1 (AlwaysRecruit true): each late tank home a while, then taken by the team out there (built s19 -> taken \
s29, s30 -> s56; the simulator s23 -> s30, s34 -> s60)"""
proves = "simai team recruiting: AlwaysRecruit makes the gone team take the late tanks"
expect = ["max(r['坦克在家'] for r in rows[19:35]) == 1", "rows[-1]['坦克在家'] == 0 and rows[-1]['坦克拥有'] == 6"]

[[reading]]
id = "always_recruit_a_full_team_takes_no_more"
scene = {build = "aiar2", check = "a", until = 62.0}
bench = "aiar2 (AlwaysRecruit true, MaxUnits 4 already full): both late tanks stay home, 坦克在家 2 of 6 owned"
proves = "simai team recruiting: a full team takes no more under AlwaysRecruit"
expect = "rows[-1]['坦克在家'] == 2 and rows[-1]['坦克拥有'] == 6"

[[reading]]
id = "without_always_recruit_the_first_built_forms_a_team_the_second_stays"
scene = {build = "aiar3", check = "a", until = 62.0}
bench = """\
aiar3 (none placed, AlwaysRecruit false): the first built forms the team and goes (built s21, out s30; the \
simulator s23 / s29), the second (s32) stays home"""
proves = "simai team recruiting: without AlwaysRecruit the first built forms a team, the second stays"
expect = ["max(r['坦克在家'] for r in rows[19:29]) == 1", "rows[-1]['坦克在家'] == 1 and rows[-1]['坦克拥有'] == 2"]

[[reading]]
id = "the_ai_builds_only_the_openers_two"
scene = {build = "aiar0", check = "a", until = 80.0}
bench = """\
aiar0-3 own 6 to the end (late = 2: the opener builds two, nothing more); simai aiar0 builds a third Guardian \
s67 and a fourth s78 (owned 8 at s80)"""
proves = "simai team recruiting: the AI builds only the opener two late tanks"
expect = "rows[-1]['坦克拥有'] == 6"
mismatch = """\
simai aiar0 builds a third Guardian s67 and a fourth s78 (owned 8 at s80); bench aiar0-3 own 6 to the end \
(late=2: the opener builds two, nothing more)"""

# Moved from tests/test_simai.py (T3 line B, bench 2026-11-09 a): rows[i] is the old _switch_run's rows[i].

[[reading]]
id = "team_filters_take_whom_the_bench_sent"
scene = {build = "aitfany", check = "a", until = 41.0}
each = [{build = "aitfany", tanks = 0, inf = 4}, {build = "aitfnone", tanks = 0, inf = 4},
        {build = "aitfall", tanks = 4, inf = 0}, {build = "aitfki", tanks = 4, inf = 0},
        {build = "aitfke", tanks = 0, inf = 4}, {build = "aitfmax", tanks = 5, inf = 0}]
bench = """\
(坦克在家, 步兵在家) from s15 on: ObjectFilter ANY / NONE + IncludeThing Guardian -- only the Guardians go; ALL + \
ExcludeThing Guardian -- only the Peacekeepers; IncludeKindOf INFANTRY / ExcludeKindOf INFANTRY; MaxUnits 3 of 8 \
Guardians: 5 stay"""
proves = "simai teams: a team template's ObjectFilter / KindOf / MaxUnits pick whom it takes"
expect = "(rows[39]['坦克在家'], rows[39]['步兵在家']) == (tanks, inf)"

[[reading]]
id = "the_filters_kinds_take_whom_the_bench_sent"
item = "AI 组队招人/ObjectFilter.Include"
scene = {build = "aitfoki", check = "a", until = 41.0}
each = [{build = "aitfoki", tanks = 4, inf = 0}, {build = "aitfokt", tanks = 0, inf = 0},
        {build = "aitfoke", tanks = 0, inf = 4}, {build = "aitfokn", tanks = 4, inf = 0}]
bench = """\
Bench 2026-11-23, PASS each but aitfokn (guessed 4 / 4): (坦克在家, 步兵在家) from s22 on: ObjectFilter ANY Include \
INFANTRY (4, 0) from s15; ANY Include INFANTRY + IncludeThing Guardian (0, 0), the tanks s20-21, the infantry s22; ALL \
Exclude INFANTRY (0, 4) from s15; NONE Include INFANTRY (4, 0) from s15 -- NONE takes the Include kinds as ANY"""
proves = """\
simai teams: the ObjectFilter's Include / Exclude kinds (after its IncludeThing) pick whom a team takes; NONE = ANY \
(the program's one filter, CampaignLab work/re d59_b_fields.md 2: the heuristics' ObjectOfTypeExists use it too)"""
expect = "(rows[39]['坦克在家'], rows[39]['步兵在家']) == (tanks, inf)"

[[reading]]
id = "locomotor_types_and_object_sets_take_whom_the_bench_sent"
scene = {build = "aitfland", check = "a", until = 41.0}
each = [{build = "aitfland", tanks = 0, other = 4}, {build = "aitfamph", tanks = 4, other = 0},
        {build = "aitfwat", tanks = 4, other = 4}, {build = "aitfosi", tanks = 4, other = 0},
        {build = "aitfosv", tanks = 0, other = 4}, {build = "aitfosc", tanks = 0, other = 0}]
bench = """\
(Guardians home, the other type home) at s40 (B round 81): AllowedLocomotorTypes LAND -- only the Guardians; \
AMPHIBIOUS -- only the Riptide ACVs; WATER -- nobody (an amphibious unit is not WATER). RegisteredObjectSet \
INFANTRY -- only the Peacekeepers; VEHICLES -- only the Guardians; SKIRMISH_AI_NORMAL_COMBAT_UNITS -- both"""
proves = "simai teams: AllowedLocomotorTypes and RegisteredObjectSet pick whom a team takes"
expect = "tuple(vals(rows)[39]) == (tanks, other)"
