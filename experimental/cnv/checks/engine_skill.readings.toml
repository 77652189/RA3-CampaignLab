bench = "悬1 / 悬2 / 平D 82004 / 82002 / 82103 (bench 2026-11-07 engine_skill c; the cliff edge and the sea 4 frames)"
proves = """sim.Sim.act NAMED_FIRE_SPECIAL_POWER_AT_WAYPOINT: a script's cast builds on the cliff edge and in the sea (the 2 \
more frames on the bench not explained); the walked D within 4 (as R5, sim 82106)."""
let = {want = "[82004, 82002, 82103]"}
