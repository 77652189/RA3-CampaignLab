# Bench readings of checks/engine_knock_self.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# Counters: a retail man / side, plain man / side health; b the same four "still on its spot" (a 3 box).
# Each shock's speed and landing is in the run's ra3ext.log and the check's docstring.

[[reading]]
id = "the_shotgun_from_its_own_spot_hurts_the_man_in_line_not_the_one_beside"
scene = {build = "engine_knock_self", check = "a", until = 12, shot_clock = true}
bench = "CampKSelfA_mcp_1124_225511: retail man / side, plain man / side = 74 / 100 / 74 / 100 from s6.47 to the end (one shot at frame 92)"
proves = "DamageNugget of a DamageDealtAtSelfPosition shotgun (Radius 155, DamageTaperOff 25, DamageArc 5d): 25 ahead takes 38.3 of 150, 32 off at 39 deg nothing; removing ShockWaveArc changes no damage"
expect = "vals(rows)[-1] == [74, 100, 74, 100]"

[[reading]]
id = "the_shotgun_shocks_from_its_feet_along_its_line"
scene = {build = "engine_knock_self", check = "b", until = 12, shot_clock = true}
bench = "CampKSelfB_mcp_1124_231636: retail man / side, plain man / side still on their spot = 1 1 1 1 to s5.93, 0 1 0 0 from s6.47 to the end"
proves = "MetaImpactNugget of the shotgun (engine/combat/meta_impact.fire_at_self): centred on the shooter's feet, the 5d arc about its line -- the man 25 ahead is knocked off his spot, the side man 39 deg out stays; with only ShockWaveArc removed the side man is knocked too"
expect = "vals(rows)[-1] == [0, 1, 0, 0]"
item = "武器效果 MetaImpactNugget:散弹自身弧"

# engine_knock_selfd (A381, Omega's spelling): counters stay hit, stay home, moved hit, moved home -- hit = the man's
# full-health script frames (+1000 at the loss), home = the side man's frames still on his spot (a 3 box).

[[reading]]
id = "a_delayed_shock_from_the_shooters_feet_stays_where_it_fired"
scene = {build = "engine_knock_selfd", check = "a", until = 12, shot_clock = true}
bench = "CampKSelfDA_mcp_1125_221002: 1092 111 1092 111 from s7.53 to the end; ra3ext: every shock at frame 111 (= 92 + 19), moved's centred (2300, 3300) where it fired, not (2300, 3150) where it was teleported; the shooters not shocked"
proves = "MetaImpactNugget of a DamageDealtAtSelfPosition weapon with ShockwaveDelaySeconds (engine/combat/host -> meta_impact.fire_at_self, Damage's queue): the delayed shock goes off at the shooter's feet at the shot, wherever it is when the delay runs out"
item = "武器效果 MetaImpactNugget:自身延迟"
let = {v = "vals(rows)[-1]"}
expect = ["v[0] > 1000 and v[2] > 1000", "v[1] == v[3] < 150"]

[[reading]]
id = "a_delayed_shock_from_the_shooters_feet_goes_off_its_delay_plus_one_frames_after_the_shot"
scene = {build = "engine_knock_selfd", check = "a", until = 12, shot_clock = true}
bench = "CampKSelfDA_mcp_1125_221002: home - (hit - 1000) = 111 - 92 = 19 both lanes (1.2 s: D 18 + 1)"
proves = "the at-self shock's queue (as the Katana's, checks/engine_knock_delay.readings.toml) and the side man off his spot on the shock frame"
let = {v = "vals(rows)[-1]"}
expect = ["v[1] - (v[0] - 1000) == 19"]
mismatch = "sim 1092 113: its shock goes off at frame 111 too, but the at-self trajectory's first samples (A363's landing on the 20 grid, INFERRED: the side man falls back to (+20, 3320) while ra3ext's v is +y) keep him in his 3 box two frames longer"
