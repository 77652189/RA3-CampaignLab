# Bench readings of checks/engine_scripts8.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# Team scripts, bench 2026-11-09. The bench's seconds run 1-2 s ahead of the mission's timers: the simulator's
# readings, in mission seconds, are asserted at most 2 s later than the bench's.

[[reading]]
id = "scripts8_team_delete_and_kill_take_every_member_as_the_bench"
scene = {build = "engine_scripts8", check = "team", until = 10}
bench = """\
team: TEAM_DELETE Del and TEAM_KILL Kil at 2 s -- 活着 48 to the end (both crews gone at once, Liv whole), 甲死帧 1 (the \
killed one NAMED_DYING a frame). Not held: 乙死帧 (bench 1, the deleted one dying a frame too; the simulator 0)"""
proves = "sim TEAM_DELETE / TEAM_KILL: every member of the team goes at once"
let = {chg = "[(t, r) for i, (t, r) in enumerate(zip(times, rows)) if i == 0 or r != rows[i - 1]]", at = "lambda k, p: next((t for t, r in chg if p(r[k])), None)"}
expect = "chg[-1][1]['活着'] == 48 and chg[-1][1]['甲死帧'] == 1 and at('活着', lambda v: v == 48) <= 4"

[[reading]]
id = "scripts8_idle_drops_the_move_as_the_bench"
scene = {build = "engine_scripts8", check = "idle", until = 31}
bench = """\
idle: TEAM_IDLE_FOR_SECONDS 3 / _FRAMECOUNT 15 at 3 s drop the 1 s move order -- 到 100 (the control's) at s12, 200 from \
s13, never 211 (the idled crews never arrive)"""
proves = "sim TEAM_IDLE_FOR_SECONDS / _FRAMECOUNT: an idle team's move order is dropped, it never arrives"
let = {chg = "[(t, r) for i, (t, r) in enumerate(zip(times, rows)) if i == 0 or r != rows[i - 1]]", at = "lambda k, p: next((t for t, r in chg if p(r[k])), None)"}
expect = [
    "[r['到'] for t, r in chg] == [0, 100, 200]",
    "12 <= at('到', lambda v: v == 100) <= 14 and 13 <= at('到', lambda v: v == 200) <= 15",
]

[[reading]]
id = "scripts8_merge_moves_the_members_as_the_bench"
scene = {build = "engine_scripts8", check = "merge", until = 31}
bench = """\
merge: TEAM_MERGE_INTO_TEAM at 1 s -- 合 1 at s11, 12 from s13 (the source's two took the target's order); 源 0 (an \
order to the emptied source moves nobody)"""
proves = "sim TEAM_MERGE_INTO_TEAM: the source's members take the target's order, the emptied source moves nobody"
let = {chg = "[(t, r) for i, (t, r) in enumerate(zip(times, rows)) if i == 0 or r != rows[i - 1]]", at = "lambda k, p: next((t for t, r in chg if p(r[k])), None)"}
expect = [
    "chg[-1][1]['合'] == 12 and chg[-1][1]['源'] == 0 and all(r['源'] == 0 for t, r in chg)",
    "11 <= at('合', lambda v: v == 1) <= 13 and 13 <= at('合', lambda v: v == 12) <= 15",
]

[[reading]]
id = "scripts8_spawn_on_team_at_the_object_as_the_bench"
scene = {build = "engine_scripts8", check = "spawn", until = 7}
bench = "spawn: UNIT_SPAWN_NAMED_OBJECT_ON_TEAM_AT_NAMED_OBJECT_LOCATION at 1 s -- 生 3 from s1"
proves = "sim UNIT_SPAWN_NAMED_OBJECT_ON_TEAM_AT_NAMED_OBJECT_LOCATION: the team is made at the object's place at once"
let = {chg = "[(t, r) for i, (t, r) in enumerate(zip(times, rows)) if i == 0 or r != rows[i - 1]]", at = "lambda k, p: next((t for t, r in chg if p(r[k])), None)"}
expect = "chg[-1][1]['生'] == 3 and at('生', lambda v: v == 3) <= 3"
