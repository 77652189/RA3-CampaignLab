[[reading]]
id = "mining_the_placed_collector_claims_the_node_whether_or_not_the_drives_meet"
scenes = {g = {build = "engine_mining", check = "g", until = 31}, away = {build = "mineaway", check = "g", until = 31}, h = {build = "engine_mining", check = "h", until = 31}}
bench = "bench 2026-11-12 engine_mining g / h, mineaway g: 首笔 290 / 261 / 239; the refinery's own leaves its pad at 19 either way; with the placed one far off any shared way (mineaway) it still comes second and waits (sim 首笔 286 / 275 / 240)"
proves = """sim.Sim._claimed (round 189): not a collision, the placed one (there before the refinery's own fades in) claims \
the node when it looks for it: mineaway's first money is the placed one's, past the own one's alone (h). The placed \
one's first money within 15 (290: its drive round the refinery, not modelled), h's within 2."""
expect = [
    "abs(g[-1]['首笔'] - 290) <= 15",
    "away[-1]['首笔'] - h[-1]['首笔'] >= 15",
    "abs(h[-1]['首笔'] - 239) <= 2",
]

