[[reading]]
id = "mining_retail_facing_legs_as_the_bench"
scene = {build = "mineturn0", check = "q", until = 31}
bench = "mineturn0 q: the collector in c's node square at 23 (from where it faded in), out at 96 (73 frames: a node that waits for nobody), back in at 156 (15 after its unloading ends): 首笔 111, 到矿 23, 离矿 96, 二到矿 156 (bench 2026-11-12 mineturn0 q, CampMineT0Q; sim 111 / 22 / 96 / 159)"
proves = "sim.Sim.unpack_child / mine_due (round 179): the legs of a trip at retail's facing, each within 3 frames"
