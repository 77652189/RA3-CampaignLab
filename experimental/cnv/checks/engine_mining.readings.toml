[[reading]]
id = "mining_retail_facing_drive_bound_once_the_refinery_is_further"
scenes = {p = {build = "minefar", check = "p", until = 76}, q = {build = "minefar", check = "q", until = 31}}
bench = "minefar p: 首笔 / 二笔 / 三笔 133 / 288 / 443 (a trip of 155, the refinery 38 further back); q legs 首笔 133, 到矿 34, 离矿 107, 二到矿 190 (bench 2026-11-12 minefar p / q; sim q 133 / 32 / 109 / 190)"
proves = """sim.Sim.mine_due (round 179, the prediction told apart): the refinery 38 further back at retail's facing, the \
legs 36 + 11 make the drive bound again -- a trip of 155 (the old drive-bound 45-frame leg said 144 / 317 / 490); the \
sim's 133 / 288 / 443 to the frame, the legs within 3."""
let = {far = "{'首笔': 133, '二笔': 288, '三笔': 443}", legs = "{'首笔': 133, '到矿': 34, '离矿': 107, '二到矿': 190}"}
expect = ["all(p[-1][k] == v for k, v in far.items())", "all(abs(q[-1][k] - v) <= 3 for k, v in legs.items())"]

