# Bench readings of checks/engine_mining.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# Moved from tests/test_simbench.py (T3 A): until is the old run's until + 1. The full Sim on a mining bench (no miner
# put by hand): the refinery's own collector (SpawnOnUnpack, sim.Sim.unpack_child) does the work. 首笔 / 二笔 / 三笔 =
# the frames of the first / second / third deposit.

[[reading]]
id = "mining_the_refinery_s_own_collector_pays_at_the_bench_s_period"
scene = {build = "mineturn0", check = "p", until = 76}
each = [
    {build = "mineniag", f = 111, s2 = 262, s3 = 413},
    {build = "mineturn0", f = 111, s2 = 262, s3 = 413},
    {build = "mineturn180", f = 296, s2 = 619, s3 = 942},
    {build = "mineturn45", f = 156, s2 = 342, s3 = 528},
    {build = "mineturn90", f = 214, s2 = 455, s3 = 696},
    {build = "mineturnm45", f = 157, s2 = 344, s3 = 531},
    {build = "mineturnm90", f = 214, s2 = 455, s3 = 696},
]
bench = "the benches' 首笔 / 二笔 / 三笔 f / s2 / s3 (bench 2026-11-12 checks/engine_mining.py mineturn<k> p / mineniag p: the node turned k degrees off facing its refinery)"
proves = """sim.Sim.unpack_child (round 177): the placed collector deleted at the start, the refinery the map places gives its \
own (SpawnOnUnpack) and the money comes at the bench's period (二笔 - 首笔, 三笔 - 二笔 within 2 frames)."""
expect = "abs((rows[-1]['二笔'] - rows[-1]['首笔']) - (s2 - f)) <= 2 and abs((rows[-1]['三笔'] - rows[-1]['二笔']) - (s3 - s2)) <= 2"

