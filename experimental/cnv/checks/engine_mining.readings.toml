[[reading]]
id = "money_cap_holds_harvest_income_as_the_bench"
scenes = {cap = {build = "mineturn0", check = "cap", until = 31}, capz = {build = "mineturn0", check = "capz", until = 31}}
bench = "资金 首笔 二笔 三笔: cap 400 -- the first load paid (250 from frame 111), the second 8 a frame to 394 (二笔 262 as without a cap), then nothing: a deposit that would pass the cap is not paid, not cut to it; 三笔 counts on to the end. Cap 0 -- no money at all (a07's allies: money 0, cap 0) (bench 11-15 run_queue mineturn0:cap mineturn0:capz, A round 254)"
proves = "sim.Sim.earn / Sim._pay, PLAYER_SET_MONEY_CAP on income: a deposit that would pass the cap is not paid, cut to nothing"
expect = [
    "[cap[-1]['资金'], cap[-1]['首笔'], cap[-1]['二笔']] == [394, 111, 262] and cap[-1]['三笔'] > 400",
    "max(r['资金'] for r in cap) == 394",
    "all(r['资金'] == 0 for r in capz) and capz[-1]['首笔'] > 400",
]
