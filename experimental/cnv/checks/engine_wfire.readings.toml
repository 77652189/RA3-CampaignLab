# Bench readings of checks/engine_wfire.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# WeaponFireSpecialAbilityUpdate: the ability goes off after its unpack and holds the caster through its pack.

[[reading]]
id = "a_weapon_fire_ability_goes_off_after_its_unpack_and_holds_the_caster_through_its_pack"
scene = {build = "engine_wfire", check = "all", until = 22, shot_clock = true}
bench = "尤活 走帧 狙 吠 = 310016016 36039 8074031 15160 (bench 11-11 engine_wfire all, PASS)"
proves = """sim WeaponFireSpecialAbilityUpdate (Sim.wfire_press / wfire_due), frame clock on: Yuriko's blast kills the \
conscripts 100 / 200 off at frame 16 (the DamageNugget's 1 s delay), not the one 300 off; she and the dog stand \
PackTime / FreezeAfterTriggerDuration (30) and walk out of the 30 square at 39 / 36 (sim, no acceleration, 37 / 35); \
Natasha's near Hammer neutral at 31 (UnpackTime 2 s), the far one at 74 (sim 75), she leaves her start at 8; the bark \
holds the conscript 60 off 160 frames (EMP 10 s), the 150 one walks at 15 (sim 14). The coarse tick moves a unit \
only every 7-8 frames: why the frame clock."""
let = {yuri = "rows[-1]['尤活']", stand = "rows[-1]['走帧']", snipe = "rows[-1]['狙']", bark = "rows[-1]['吠']"}
expect = [
    "yuri % 1000 == 16 and yuri // 1000 % 1000 == 16 and yuri // 1000000 >= 250",
    "abs(stand % 1000 - 39) <= 3 and abs(stand // 1000 - 36) <= 2",
    "snipe % 1000 == 31 and abs(snipe // 1000 % 1000 - 74) <= 2 and snipe // 1000000 == 8",
    "abs(bark % 1000 - 160) <= 2 and abs(bark // 1000 - 15) <= 2",
]
