# Bench readings of checks/engine_reinf.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# CREATE_REINFORCEMENT_TEAM (sim.Sim.reinforce), bench 11-10.

[[reading]]
id = "reinforcement_teams_as_the_bench"
scenes = {two = {build = "engine_reinf_two", check = "go", until = 31}, old = {build = "engine_reinf_old", check = "go", until = 46}}
bench = """\
Every line's max count, a new instance on every call (teamMaxInstances 1 or not), and an order by the team's name to \
the oldest instance only. two (兵A 出生A 到达A 兵B) ends 6 3 3 4; old (兵A 出生A 到达A 远处A): the first instance \
stands at the goal (3 3 0 0 -> 3 0 3 0), the second is made at the spawn, the order to far takes the first: 6 3 0 3 \
(bench 11-10 engine_reinf)"""
proves = "sim reinforce: every line's max count, a new instance per call, an order by team name goes to the oldest instance only"
let = {by = "dict(zip(range(len(old)), vals(old)))"}
expect = [
    "vals(two)[-1] == [6, 3, 3, 4]",
    "by[1] == [3, 3, 0, 0] and by[13] == [3, 0, 3, 0] and by[44] == [6, 3, 0, 3]",
]
