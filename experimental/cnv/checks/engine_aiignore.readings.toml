# MinDistanceFromBaseToIgnoreTargets 0 / 2000 (C aiignzero / aiignnear, E103 / E120 observer pair aiignzt / aiignnt):
# two enemy engineers (the micro data's IgnoreTargets) stand 502.49 from the AI's only base; only the field changes.

[[reading]]
id = "an_ignored_engineer_within_the_distance_of_the_base_is_the_micro_target"
scene = {build = "aiignzt", check = "r", until = 29, teams = true}
each = [{build = "aiignzt", seen = [[391, 8, false], [406, 8, false], [421, 8, false]]},
        {build = "aiignnt", seen = [[391, 8, false], [406, 0, true], [421, 0, true]]}]
bench = """\
E103 aiignzt:r (0) CampIgnObsZeroR_mcp_1112_151104 / aiignnt:r (2000) CampIgnObsNearR_mcp_1112_151332, repeated in E120 \
(CampIgnObs*_mcp_1113_*), ra3ext CNVTeams lines, game frames: the micro team of two (CNVStateMicro) at f391 / f406 / f421 -- \
0: 8 / 8 / 8, no target; 2000: 8 no target, then 0 with target 3170 @ (3800, 2900), 0 with 3171 @ (3900, 2900). E120: the base \
picked is the sole one at (3850, 3400) (the team centre is the reference), each engineer 502.49 from it \
(work/re e103_ignore_distance.md, e120_ignore_base.md)"""
proves = "simai MinDistanceFromBaseToIgnoreTargets: an enemy IgnoreTargets lists still counts as an enemy when within the distance of the AI's base (0 ignores it, the team stays 8; 2000 lets AlphaStrike's engineer branch give state 0). The program measures from the base the RetreatBaseCriteria picks (team centre reference), modelled as the AI's home -- the same here, one base (B 11-24, l4_micro_engage.md)"
item = "AI 微操/AIMicroManagerData.MinDistanceFromBaseToIgnoreTargets"
let = {got = "[[r['frame'], r['state'], r['foe_id'] is not None] for r in teams() if r['state_key'] == 'CNVStateMicro' and len(r['members']) == 2 and r['frame'] in (391, 406, 421)]"}
expect = "got == seen"

[[reading]]
id = "a_plain_attack_hurts_the_engineers_at_either_distance"
scene = {build = "aiignzero", check = "r", until = 50}
each = [{build = "aiignzero"}, {build = "aiignnear"}]
bench = "C (c_ignore_distance_report.md, delayed targets): both 造出 2 and 受伤 0 to s22 (f361); first hurt f397 (0) / f396 (2000), latched to s54"
proves = "simai MinDistanceFromBaseToIgnoreTargets: the field picks the micro target only -- damage alone does not tell the two apart"
let = {before = "[r for r in rows if 345 <= r['帧数'] < 390]", after = "[r for r in rows if 420 <= r['帧数'] <= 735]"}
expect = [
    "before and all((r['造出'], r['受伤'], r['首伤']) == (2, 0, 0) for r in before)",
    "after and any(r['受伤'] == 1 for r in after)",
    "len({r['首伤'] for r in after if r['受伤']}) == 1 and min(r['首伤'] for r in after if r['受伤']) >= 390",
]
