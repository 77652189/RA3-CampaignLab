# Bench readings of checks/engine_aipoweradv.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# A state's heuristics gate its team (bench 2026-11-09; B rounds 82-83).
# Moved from tests/test_simai.py (T3 line B); rows[i] is the old _switch_run's rows[i] (same run, checked row by row).

[[reading]]
id = "power_advantage_gates_the_state_as_on_the_bench"
scene = {build = "aipadv2", check = "a", until = 31.0}
each = [{build = "aipadv2", n = 8, home = 0}, {build = "aipadv1", n = 4, home = 4}, {build = "aipadvh", n = 4, home = 0},
        {build = "aipadvc", n = 4, home = 0}]
bench = """\
PowerAdvantageHeuristic Value 1 Above true (坦克在家 at s6 and s30): aipadv2 8 against 4 out s13-16; aipadv1 4 \
against 8 home to s65; aipadvh the player with only an Ore Collector (nothing CAN_ATTACK: FLT_MAX) out s15-16; \
aipadvc (4 against 8, ConstantHeuristic, the control) out s14-15"""
proves = "simai states: PowerAdvantageHeuristic gates the state"
expect = "rows[5]['坦克在家'] == n and rows[29]['坦克在家'] == home"

[[reading]]
id = "team_min_power_advantage_holds_nobody_back"
scene = {build = "aipadm1", check = "a", until = 31.0}
each = [{build = "aipadm1", n = 8}, {build = "aipadm0", n = 4}, {build = "aipadm5", n = 8}]
bench = "B round 82: MinPowerAdvantage 1.0 / 5.0 on the team, 8 v 4 and 4 v 8 -- all leave home by s16"
proves = "simai teams: a team's MinPowerAdvantage holds nobody back"
expect = "rows[5]['坦克在家'] == n and rows[19]['坦克在家'] == 0"

[[reading]]
id = "condition_heuristics_gate_the_state_as_on_the_bench"
scene = {build = "aihtim", check = "a", until = 61.0}
each = [{build = "aihtim", home = 32, gone = 34}, {build = "aihtima", home = 37, gone = 39},
        {build = "aihtimx", home = 22, gone = 23}, {build = "aihint", home = 27, gone = 28},
        {build = "aihen1", home = 13, gone = 15}, {build = "aihen0", home = -1, gone = -1},
        {build = "aihenn", home = 13, gone = 16}, {build = "aihoe0", home = -1, gone = -1},
        {build = "aihoea", home = -1, gone = -1}, {build = "aihoes", home = 14, gone = 16}]
bench = """\
B round 83 (home = the last second all 4 home, gone = the first second all gone; -1 = home to the end): Timer \
(MAP_START / AI_START, EndTime a length), Interval (off first), EnemyNearby, ObjectOfTypeExists ALLIES with \
one's own; the simulator within 3 s (its teams leave a second or two apart from the bench's)"""
proves = "simai states: the condition heuristics (Timer, Interval, EnemyNearby, ObjectOfTypeExists) gate the state"
let = {seq = "[r['坦克在家'] for r in rows]", last = "first('坦克在家', lambda v: v < 4)"}
expect = "all(v == 4 for v in seq) if home < 0 else abs(last - home) <= 3 and seq[gone + 2] == 0"

[[reading]]
id = "object_of_type_exists_counts_the_relationship_as_on_the_bench"
scene = {build = "aihoe1", check = "a", until = 41.0}
each = [{build = "aihoe1", out = true}, {build = "aihoef", out = false}]
bench = """\
B round 83: aihoe1 (ObjectOfTypeExists ENEMIES AlliedMiner, the player has one) out s15-17; aihoef (PassIfExists \
false, the player has one) home to s65"""
proves = "simai states: ObjectOfTypeExistsHeuristic counts the filter's Relationship and PassIfExists"
expect = "(rows[39]['坦克在家'] == 0) == out"
