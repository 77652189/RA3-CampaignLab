# Bench readings of checks/engine_aiopenside.py (format: experimental/cnv/readings.py; runner: tests/conformance).

[[reading]]
id = "opening_side[aiosallies]"
scene = {build = "aiosallies", check = "a", until = 60}
bench = "E82 s55-s59, Allied player with Allied opening Side: 3 power plants and 0 barracks."
proves = "simai SkirmishOpeningMove.Side: the matching Allied opening runs its three power-plant orders"
expect = [
    "win(55, 59, '电厂数') == [3] * 5",
    "win(55, 59, '兵营数') == [0] * 5",
]

[[reading]]
id = "opening_side[aiossoviet]"
scene = {build = "aiossoviet", check = "a", until = 60}
bench = "E82 s55-s59, Allied player with Soviet opening Side: 2 power plants and 1 barracks."
proves = "simai SkirmishOpeningMove.Side: a foreign-side opening is skipped and the engine builds fallback structures"
expect = [
    "win(55, 59, '电厂数') == [2] * 5",
    "win(55, 59, '兵营数') == [1] * 5",
]
mismatch = "E82 s55-s59: engine builds 2 power plants and 1 barracks. Model skips the Soviet opening and builds 0 power plants and 0 barracks because structure build states are unmodelled."
