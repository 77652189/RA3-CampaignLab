# Bench readings of checks/engine_aibuildkind.py (format: experimental/cnv/readings.py; runner: tests/conformance).

[[reading]]
id = "building_kind_active[aibkindyes]"
scene = {build = "aibkindyes", check = "a", until = 41}
bench = "engine_aibuildkind a s40: target/home 4/0, with at least two power plants and one base."
proves = "simai active-construction KindOf comparison (PassIfBuilding): the team goes only when the kind matches"
expect = [
    "win(40, 40, '到陆厂') == [4] and win(40, 40, '在家') == [0]",
    "win(40, 40, '电厂数')[0] >= 2",
    "win(40, 40, '基地数') == [1]",
]

