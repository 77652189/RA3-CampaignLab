[[reading]]
id = "the_model_backs_up_after_the_swap_only_with_the_switch_on"
scene = {build = "airevk2", check = "a", until = 40.0, teams = true}
each = [{build = "airevk2", on = true}, {build = "airevk2o", on = false}]
item = "AI 微操/AIMicroManagerData.ReverseMove"
bench = """\
D round 133 (work/re/d133_airevk2.md; fixtures dropped with tests/test_ai_reverse_k2.py): two Hammers join the \
attack team f213, state 2 f242 aiming at a far Guardian 166+ off; at 16.7 s (f250) the check deletes the far foes and \
spawns a player Guardian on each Hammer, so by f300 both aim at a spawned foe inside R - 10 = 135 (AttackRange 150). \
airevk2 (on): f302 member 3171 leaves its target and gets a move to a point 135 from it along target -> member, \
driven with the hull still on the target (displacement against hull forward, f302-313 and f316-329): it backs up; 23 \
such orders in the run. airevk2o (off): no such move order in the whole run, the members keep their targets"""
