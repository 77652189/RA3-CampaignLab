[[reading]]
id = "beside_the_war_bears_the_siege_buffer_makes_no_difference"
scenes = {a = {build = "airevb1", check = "a", until = 40.0, teams = true}, b = {build = "airevb0", check = "a", until = 40.0, teams = true}}
bench = """\
B 11-24 airevb1 (SiegeWeaponBuffer 1.5) / airevb0 (1000), CampAIRevB1A_mcp_1124_214511 / CampAIRevB0A_mcp_1124_215522 \
ra3ext tstate lines: the attack team's states run frame for frame the same, 8 to f196, 6 (the far plant) from f200, \
then 0 and 2; never 4 (siege) in either"""
proves = "simai team states: with only war bears (no hostile fires at a tank) near, the siege buffer changes nothing and no team goes to state 4"
