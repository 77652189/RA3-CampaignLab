# Bench readings of checks/engine_aipullback.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# PullbackInjured / ReverseMove / UseGatherState (bench 2026-11-09).

[[reading]]
id = "no_tank_goes_home_once_the_tanks_are_out"
scene = {build = "aipull1", check = "a", until = 40.0}
each = [{build = "aipull1"}, {build = "aipull0"}]
bench = """\
aipull1 / aipull0 (4 Hammers vs 12 Peacekeepers): no retreat, 回家 0 from s3 on (the simulator leaves later, s14), \
all 4 tanks at the far plant"""
proves = "simai pullback: PullbackInjured on or off, no healthy tank goes home"
expect = "all(r['回家'] == 0 for r in rows[14:]) and any(r['到远厂'] == 4 for r in rows)"

[[reading]]
id = "pullback_switch_makes_no_difference_for_the_hammers"
scenes = {a = {build = "aipull1", check = "a", until = 40.0}, b = {build = "aipull0", check = "a", until = 40.0}}
bench = "aipull1 and aipull0 read second for second the same to s40"
proves = "simai pullback: the PullbackInjured switch makes no difference for tanks at full health"
expect = "a == b"

[[reading]]
id = "a_hurt_allied_tank_team_drives_on_instead_of_home"
scene = {build = "aipulli1", check = "a", until = 60.0}
bench = "aipulli1 (health 30 %, retail Allied war factory): 到远厂 3 or more, 回家 0 from s3, all dead (bench by s23)"
proves = "simai pullback: a hurt Allied tank team drives on instead of going home"
expect = ["all(r['回家'] == 0 for r in rows[14:]) and any(r['到远厂'] >= 3 for r in rows)", "rows[-1]['坦克数'] == 0"]

[[reading]]
id = "a_hurt_soviet_tank_team_is_pulled_back_to_the_crane"
scene = {build = "aipullsov", check = "a", until = 40.0}
bench = "aipullsov (hurt Soviet tanks): 回家 1 or more from s15 on"
proves = "simai pullback: a hurt Soviet tank team is pulled back to the crane"
expect = "any(r['回家'] >= 1 for r in rows[14:])"

[[reading]]
