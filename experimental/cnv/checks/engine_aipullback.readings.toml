# Bench readings of checks/engine_aipullback.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# PullbackInjured / ReverseMove / UseGatherState (bench 2026-11-09).

[[reading]]
id = "no_tank_goes_home_once_the_tanks_are_out"
scene = {build = "aipull1", check = "a", until = 40.0}
each = [{build = "aipull1"}, {build = "aipull0"}]
bench = """\
aipull1 / aipull0 (4 Hammers vs 12 Peacekeepers): no retreat, 回家 0 from s3 on (the simulator leaves later, s14), \
all 4 tanks at the far plant"""
proves = "simai pullback: PullbackInjured on or off, no healthy tank goes home"
expect = "all(r['回家'] == 0 for r in rows[14:]) and any(r['到远厂'] == 4 for r in rows)"

[[reading]]
id = "pullback_switch_makes_no_difference_for_the_hammers"
scenes = {a = {build = "aipull1", check = "a", until = 40.0}, b = {build = "aipull0", check = "a", until = 40.0}}
bench = "aipull1 and aipull0 read second for second the same to s40"
proves = "simai pullback: the PullbackInjured switch makes no difference for tanks at full health"
expect = "a == b"

[[reading]]
id = "a_hurt_allied_tank_team_drives_on_instead_of_home"
scene = {build = "aipulli1", check = "a", until = 60.0}
bench = "aipulli1 (health 30 %, retail Allied war factory): 到远厂 3 or more, 回家 0 from s3, all dead (bench by s23)"
proves = "simai pullback: a hurt Allied tank team drives on instead of going home"
expect = ["all(r['回家'] == 0 for r in rows[14:]) and any(r['到远厂'] >= 3 for r in rows)", "rows[-1]['坦克数'] == 0"]

[[reading]]
id = "a_hurt_soviet_tank_team_is_pulled_back_to_the_crane"
scene = {build = "aipullsov", check = "a", until = 40.0}
bench = "aipullsov (hurt Soviet tanks): 回家 1 or more from s15 on"
proves = "simai pullback: a hurt Soviet tank team is pulled back to the crane"
expect = "any(r['回家'] >= 1 for r in rows[14:])"

[[reading]]
id = "reverse_move_probe_starts_with_four_live_tanks"
scene = {build = "airev1", check = "a", until = 11.0}
each = [{build = "airev1"}, {build = "airev0"}]
bench = "airev1 / airev0: 坦克数 4 at s1-s10, independently of the approach gap (the run stops at s11)"
proves = "simai reverse move: the probe starts with four live tanks"
expect = "win(1, 10, '坦克数') == [4] * 10"

[[reading]]
id = "reverse_move_tanks_close_in_on_the_far_plant"
scene = {build = "airev1", check = "a", until = 23.0}
each = [{build = "airev1"}, {build = "airev0"}]
bench = "airev1 / airev0: 近厂 2 at s19-s22 (a region count)"
proves = "simai reverse move: the tanks close in on the far plant (2 in the near square at s19-s22)"
expect = "win(19, 22, '近厂') == [2] * 4"
mismatch = """\
simai airev1/0: 近厂 is zero; bench s19-s22 has two tanks in the near square. Approach remains a gap, not evidence \
of reverse travel; same-frame body heading/current target/position are missing. See work/re/e110_reverse.md and \
work/re/handoff-e.md."""

[[reading]]
id = "a_tank_team_beside_a_healed_plant_stays_whatever_the_reverse_move_switch"
scene = {build = "airevp1", check = "a", until = 60.0}
each = [{build = "airevp1"}, {build = "airevp0"}]
bench = "airevp1 / airevp0 (the target healed): 近厂 4 all along, no back-up (bench 85 s)"
proves = "simai reverse move: a team beside a healed plant stays, whatever the switch"
expect = "all(r['近厂'] == 4 for r in rows)"
mismatch = """the simulator's AI strikes the plant with its precision strike and its own Hammers go with it: on the bench \
(airevp1t) the AI buys the strike and polls it but never casts -- its Hammers stop 111-114 off the plant, outside the \
circle (50 + the plant's 54), while the simulator's drive on to 30-60 off; a stand-off (position) gap, not the cast"""

[[reading]]
id = "no_one_moves_when_the_gather_state_is_off_and_a_turret_is_the_target"
scene = {build = "airevt1", check = "a", until = 60.0}
bench = """\
airevt1 (UseGatherState off -> state 2, an AlliedBaseDefense as target): 近塔 = 中圈 = 坦克数 all along; the turret \
kills them one by one (0 from s47)"""
proves = "simai gather state: with UseGatherState off and a turret as the target nobody moves"
expect = "all(r['近塔'] == r['中圈'] == r['坦克数'] for r in rows) and rows[-1]['坦克数'] == 0"
