# Bench readings of checks/engine_protocol.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# Protocol points (simtech.py): bench 2026-11-08 `cnv_check engine_protocol <variant>`.

[[reading]]
id = "protocol_set_points_follows_the_programs_rule"
scene = {build = "engine_protocol", check = "pts", until = 17}
bench = """\
pts: 点数 1 -> 2 (cap 2) -> 2 (SET_POINTS 1: 2 + 1 passes the cap) -> 0 -> 5 (cap 0 does not limit) -> 3 (SET_POINTS 0 \
under cap 3 with 5 held) -> 7; Player_1 holds rank 1's and the Allied default (3), Soviet_1 rank 1's and the Soviet \
default (5); Soviet_1's starting point spent at once (0) (bench 2026-11-08)"""
proves = "simtech protocol points: SET_POINTS adds past the cap, a cap of 0 does not limit, ranks give the faction's default"
let = {by = "dict(zip(times, vals(rows)))"}
expect = [
    "[by[s][0] for s in (3, 5, 7, 9, 11, 13)] == [2, 2, 0, 5, 3, 7]",
    "all(v[1:] == [3, 0, 5] for s, v in by.items() if s >= 1)",
]

[[reading]]
id = "protocol_a_computer_player_spends_unless_locked"
scene = {build = "engine_protocol", check = "ailock", until = 21}
bench = "ailock: everything locked for Soviet_1 keeps its point (1), Soviet_2 unlocked spends it (0) (bench 2026-11-08)"
proves = "simtech protocol points: a computer player spends its points at once unless everything is locked"
let = {by = "dict(zip(times, vals(rows)))"}
expect = "all(v == [1, 0] for s, v in by.items() if s >= 1)"

[[reading]]
id = "protocol_rank_two_at_frame_5400"
scene = {build = "engine_protocol", check = "rank", until = 381}
bench = """\
rank: Player_1's rank experience reaches 360 in frame 5400 (360 s at 1 a second): 2 points, rank 2 for Player_1 and \
Soviet_2 (cap 2) not Soviet_1 (cap 0): 二级 5; Soviet_2's points spent at once (bench 2026-11-08)"""
proves = "simtech protocol points: rank experience reaches rank 2 in frame 5400, the cap decides who gets it"
let = {by = "dict(zip(times, vals(rows)))"}
expect = "by[380] == [2, 0, 5, 5400]"
