[[reading]]
id = "killcount_script_death_drops_the_alive_mask_last"
scene = {build = "engine_killcount", check = "a", until = 25}
bench = "engine_killcount: the alive mask steps 255, 254, 252, 248, 240 (a at s4 / s11 / s19 / s25, b at s2 / s7 / s12 / s16). The old a s22 window read 248 only because a's screenshot clock ran behind logic (its 3 / 7 / 11 / 15 s kills show at s4 / s11 / s19 / s25)."
proves = "simai SET_PLAYER_KILLS_OF_TYPE_TO_COUNTER: the alive mask drops each victim in kill order, the script death last"
let = {m = "[v[3] for v in vals(rows)]"}
expect = "[v for j, v in enumerate(m) if j == 0 or v != m[j - 1]] == [255, 254, 252, 248, 240]"
