# Bench readings of checks/engine_sell.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# Moved from tests/test_simbench.py (T3 A): until is the old run's until + 1. Bench 2026-11-06 engine_sell
# (docs/engine/sell.md; one run each): money 2000 -> 2400 for a full 800 plant (a), 2200 hurt to half (b), 2250 for a 500
# bunker (d), 2400 once for two orders (f); 卖帧 31031 = alive 31 frames and SOLD 31 (deleted 30 frames after the order,
# counted as power till then); killed at frame 5 (e): paid, 5004; sold while unpacking (c): nothing, never SOLD.

[[reading]]
id = "sell_pays_half_the_cost_scaled_by_health_once_and_deletes_after_30_frames"
scenes = {a = {build = "engine_sell", check = "a", until = 9}, b = {build = "engine_sell", check = "b", until = 9}, d = {build = "engine_sell", check = "d", until = 9}, f = {build = "engine_sell", check = "f", until = 9}}
bench = "资金 2400 / 2200 / 2250 / 2400 for a / b / d / f; 卖帧 31031 in each; the plant counts 31 frames, then not (bench 2026-11-06 engine_sell a b d f)"
proves = "sim.Sim.sell (NAMED_DAMAGE): half the cost scaled by health, paid once, the building deleted 30 frames after the order and counted as power till then"
expect = [
    "(a[-1]['资金'], b[-1]['资金'], d[-1]['资金'], f[-1]['资金']) == (2400, 2200, 2250, 2400)",
    "a[-1]['卖帧'] == b[-1]['卖帧'] == d[-1]['卖帧'] == f[-1]['卖帧'] == 31031",
    "a[-1]['第四行'] % 1000 == 31 and a[-1]['第四行'] // 1000 == a[-1]['帧数'] - 31",
]

[[reading]]
id = "sell_lets_a_bunker_garrison_out_in_the_sale_frame"
scene = {build = "engine_sell", check = "g", until = 9}
bench = "s1 frame 27 -> 9042, ENCLOSED 9 frames (0.4 s to the sale at 1.0 s), alive 15 + frames since Go (bench 11-17 engine_sell g, CampSellG_mcp_1117_225033)"
proves = "sim.Sim.sell: a bunker's garrison gets out in the sale frame (ENCLOSED ends before the sale)"
expect = [
    "rows[-1]['资金'] == 2250 and rows[-1]['卖帧'] == 31031",
    "rows[-1]['第四行'] // 1000 == 9 and rows[-1]['第四行'] % 1000 == 15 + rows[-1]['帧数']",
]

[[reading]]
id = "sell_a_killed_building_stays_paid_and_a_building_unpacking_is_not_sold"
scenes = {e = {build = "engine_sell", check = "e", until = 9}, c = {build = "engine_sell", check = "c", until = 9}}
bench = "e: killed at frame 5, paid (2400), 卖帧 5004, alive 4 frames; c: sold while unpacking: nothing (资金 2000), never SOLD, never gone (bench 2026-11-06 engine_sell e / c)"
proves = "sim.Sim.sell: a killed building stays paid; a building still unpacking is not sold"
expect = [
    "e[-1]['资金'] == 2400 and e[-1]['卖帧'] == 5004 and e[-1]['第四行'] % 1000 == 4",
    "c[-1]['资金'] == 2000 and c[-1]['卖帧'] == c[-1]['帧数']",
]
