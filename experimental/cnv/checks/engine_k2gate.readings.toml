# Bench readings of checks/engine_k2gate.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# A Guardian told to attack a live foe 100 off (cannon 150) at s2, its first shot held by a 60 s pre-attack (no hit in
# the run), beside an idle candidate; the team takes one. Bench 11-20: CampK2Gate0A_mcp_1120_001003 (off) and
# CampK2Gate1A_mcp_1120_001255 (on), both PASS; the host's f153 join and the evidence in work/re/k2_recruit_gate_1119.md.

[[reading]]
id = "off_a_unit_aiming_at_a_live_foe_in_range_is_not_taken"
scene = {build = "k2gate0", check = "a", until = 56}
each = [{build = "k2gate0"}, {build = "k2gate0", shot_clock = true}]
bench = "k2gate0: 战者在原位 / 闲者在原位 / 首离身份 1/1/0 at s1-10, 1/0/2 at s11-55 (host f153: the idle one joins, the fighter still aims at its live foe)"
proves = "simai Unit.in_combat (AllowRecruitUnitsInCombat false): the unit's own live target in its weapon's reach keeps it out, not whether it fired (no shot in the run)"
expect = ["win(13, 55, '首离身份') == [2] * 43", "win(13, 55, '战者在原位') == [1] * 43", "win(1, 10, '首离身份') == [0] * 10"]

[[reading]]
id = "on_the_unit_in_combat_is_taken_and_the_idle_one_stays"
scene = {build = "k2gate1", check = "a", until = 56}
each = [{build = "k2gate1"}, {build = "k2gate1", shot_clock = true}]
bench = "k2gate1: 首离身份 1 from s29 on, 闲者在原位 1 throughout s1-55 (host f153: the fighter joins, still aiming at the same live foe)"
proves = "teams.recruit + AllowRecruitUnitsInCombat true: the gate is skipped, the first candidate (the fighter) fills the slot"
expect = ["win(30, 55, '首离身份') == [1] * 26", "win(1, 55, '闲者在原位') == [1] * 55"]

[[reading]]
id = "on_the_taken_fighter_fights_on_where_it_stands"
scene = {build = "k2gate1", check = "a", until = 56}
bench = "k2gate1: 战者在原位 1 at s1-28, 0 from s29 (it leaves its 80 box only after the foe is deleted at s30)"
proves = "simai team attack: a recruited unit keeps the fight it is in before going with the team"
expect = "win(1, 28, '战者在原位') == [1] * 28"
mismatch = """the simulator sends the taken fighter off with the team: 战者在原位 0 from s12 (bench 1 to s28); the same \
cause as test_ai_recruit_combat's aicombat1 xfail, not the gate"""

[[reading]]
id = "pre_attack_holds_the_first_shot"
scene = {build = "k2gate0", check = "a", until = 25, shot_clock = true}
each = [{build = "k2gate0"}, {build = "k2gate1"}]
bench = "k2gate0 / k2gate1: 目标血量 100 at s3-24 (no return fire, no healing: a clean no-hit check)"
proves = "sim first_shot / the shot clock: a 60 s PreAttackDelay holds the first shot"
expect = "win(3, 24, '目标血量') == [100] * 22"
