# Bench readings of checks/engine_sellall.py (format: experimental/cnv/readings.py; runner: tests/conformance).

[[reading]]
id = "sellall_a_sells_the_named_players_plant_once"
item = "脚本动作 PLAYER_SELL_EVERYTHING"
scene = {build = "engine_sellall", check = "a", until = 27, script = "不打"}
bench = "a, line C (work/re/c_sellall_report.md), 资金码 存活位 出售位 at logic frames: f45..72 222000 63 0 | f77..105 226000 63 2 | f111..400 226000 47 0 (66 readings)"
proves = "PLAYER_SELL_EVERYTHING on Soviet_4 at 5 s: its plant carries SOLD, refunds 400 once (code +4000 = 10 x 400), then is gone (mask 63 -> 47); the Guardians and the other owners' plants stay; the empty player at 3 s and the repeat at 9 s do nothing. Moved from the frame-exact replay (A334)"
let = {want = "lambda f: None if f < 45 else [222000, 63, 0] if f <= 72 else [226000, 63, 2] if 77 <= f <= 105 else [226000, 47, 0] if f >= 111 else None"}
expect = [
  "all(v[:3] == want(v[3]) for v in vals(rows) if want(v[3]) is not None)",
  "{tuple(want(v[3])) for v in vals(rows) if want(v[3]) is not None} == {(222000, 63, 0), (226000, 63, 2), (226000, 47, 0)}",
]

