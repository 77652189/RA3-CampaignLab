# Bench readings of checks/engine_seal.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# Walled in, no way (sim.Ground.closest, Sim.send) and what a unit takes by itself (Sim.shot_blocked, takes_by_itself):
# docs/engine/pathing.md 6 and 7d. A scene's until is the old test's seconds + 1 (the old bare Sim.run(u) read the row
# of second u last; the runner's world stops a second earlier).

[[reading]]
id = "seal_a_walled_in_ifv_ends_in_the_rings_south_part"
scene = {build = "engine_seal", check = "move", until = 31}
bench = "walled-in IFV ends in the ring's south part (17), not at the east wall (bench 2026-11-08 engine_seal move)"
proves = "sim Ground.closest / Sim.send: a walled-in unit's cell nearest the goal; the bench's IFV ends elsewhere, not looked into"
expect = "rows[-1]['车'] == 17"
mismatch = "sim IFV 7 at s30 (the cell nearest the goal); bench 17"

[[reading]]
id = "seal_units_made_inside_a_building_come_out_and_go"
scene = {build = "engine_seal", check = "spawn", until = 31}
bench = "IFV and peacekeeper made at a power plant's centre at s1, ordered 600 east at s4: both out by themselves, at the goal (13) the IFV s10, the soldier s13 (bench engine_seal spawn)"
proves = "sim Sim.send / Ground: units made inside a structure's footprint come out and go (sim IFV s10, soldier s22)"
let = {at_goal = "lambda key: times[first(key, lambda v: v == 13)]"}
expect = [
    "rows[-1]['车'] == 13 and rows[-1]['兵'] == 13",
    "abs(at_goal('车') - 10) <= 2",
    "abs(at_goal('兵') - 13) <= 3",
]

[[reading]]
id = "seal_open_an_idle_soldier_fires_from_where_it_stands_at_210"
scene = {build = "engine_seal", check = "open", until = 41}
bench = "no ring: the peacekeeper never leaves its start, the MCV 210 off 99 % at s1 .. 88 % at s61 (bench engine_seal open)"
proves = "sim Sim.takes_by_itself: an idle soldier fires at the MCV from where it stands (the MCV is big); sim 89 % at s40"
expect = ["all(r['兵'] == 0 for r in rows)", "85 <= rows[-1]['敌车血量'] <= 95"]

[[reading]]
id = "seal_cut_off_by_ground_it_still_fires"
scene = {build = "engine_seal", check = "cut", until = 41}
bench = "the MCV 210 off behind a closed box of impassable ground: the peacekeeper fires as in open (88 % at s61) (bench engine_seal cut)"
proves = "sim Sim.takes_by_itself: no way to the target does not stop an idle unit taking it"
expect = ["all(r['兵'] == 0 for r in rows)", "85 <= rows[-1]['敌车血量'] <= 95"]

[[reading]]
id = "seal_structures_in_the_line_block_the_shot[idle]"
scene = {build = "engine_seal", check = "idle", until = 41}
bench = "the player's own bunkers in a ring round the MCV 210 off: the idle peacekeeper neither fires (99-100 % for 61 s) nor moves (bench engine_seal idle 2026-11-08)"
proves = "sim Sim.shot_blocked: a weapon with ATTACK_NEEDS_LINE_OF_SIGHT does not shoot through a structure's footprint"
expect = "rows[-1]['敌车血量'] >= 99"

[[reading]]
id = "seal_structures_in_the_line_block_the_shot[row]"
scene = {build = "engine_seal", check = "row", until = 41}
bench = "the player's own bunkers in a row across, both ends open, between the idle peacekeeper and the MCV 210 off: neither fires (99-100 % for 61 s) nor moves (bench engine_seal row 2026-11-08)"
proves = "sim Sim.shot_blocked: a weapon with ATTACK_NEEDS_LINE_OF_SIGHT does not shoot through a structure's footprint"
expect = "rows[-1]['敌车血量'] >= 99"

[[reading]]
id = "seal_a_target_in_the_air_is_not_behind_the_row"
scenes = {aa = {build = "engine_seal", check = "aa", until = 13}, op = {build = "engine_seal", check = "aaopen", until = 13}}
bench = "an IFV, a hovering Twinblade (NO_ATTACK) 200 east, the row 100 east or no row: the same readings both ways (79 s1, 50 s4, 16 s7, 4 from s10) (bench engine_seal aa / aaopen 2026-11-08)"
proves = """sim Sim.shot_blocked: the line of fire does not stop a shot at a target in the air. Only how alike the two are is \
asserted; the rate is not (the simulator's 85 / 40 / 0)."""
expect = ["[r['敌车血量'] for r in aa] == [r['敌车血量'] for r in op]", "aa[-1]['敌车血量'] <= 20"]

[[reading]]
id = "seal_an_idle_v4_leaves_the_mcv_350_off_alone"
scene = {build = "engine_seal", check = "artyo", until = 62}
bench = "an idle V4 (range 500, min 200, VisionRange 500, AutoAcquire YES, no LINE_OF_SIGHT flag) never fires at the MCV 350 off, with the row or without (artyo), the middle bunker 100 too (bench engine_seal arty / artyhp / artyo 2026-11-08)"
proves = """sim Sim.takes_by_itself: not split yet: the side does not see the MCV (ShroudClearingRange, STANDARD_SHROUD_CLEAR not \
found), or the V4 takes nothing by itself -- next: the same with the map revealed, and the MCV at 250"""
expect = "rows[-1]['敌车血量'] >= 99"
mismatch = "sim fires: MCV 98 % at s1, 61 % at s22, 0 by s61; bench 99-100 % all the run"

[[reading]]
id = "seal_erow_an_idle_soldier_leaves_enemy_bunkers_alone"
scene = {build = "engine_seal", check = "erow", until = 41}
bench = "the enemy's 11 bunkers in a row 105 off, the MCV 210 behind: the player's idle peacekeeper fires at neither (the middle bunker 100, the MCV 99 for 61 s) (bench engine_seal erow 2026-11-08)"
proves = "sim Sim.takes_by_itself: Generals' building filter on a unit's own picks (the simulator had shot the middle bunker to 31 %)"
expect = ["rows[-1]['中墙血'] >= 99 and rows[-1]['敌车血量'] >= 99", "all(r['兵'] == 0 for r in rows)"]

[[reading]]
id = "seal_units_leave_the_enemys_buildings_alone_by_themselves[ebld]"
scene = {build = "engine_seal", check = "ebld", until = 61}
bench = "the enemy's (a computer player's, no skirmish AI) peacekeeper idle, the player's bunker 120 east and plant 150 west in range, the line clear: both 100 for 61 s (bench engine_seal ebld 2026-11-08)"
proves = "sim Sim.takes_by_itself: RA3 drops Generals' 'a computer player's units take enemy buildings'"
expect = "rows[-1]['地堡血'] >= 99 and rows[-1]['电厂血'] >= 99"

[[reading]]
id = "seal_units_leave_the_enemys_buildings_alone_by_themselves[ebldam]"
scene = {build = "engine_seal", check = "ebldam", until = 24}
bench = "the enemy soldier attack-moves 1000 east past the player's bunker and plant (100 / 120 off its line, 500 along): both 100 while it passes, at the goal (11) s19-s22 (bench engine_seal ebldam 2026-11-08)"
proves = """sim Sim.takes_by_itself: an attack-move takes no building either (the simulator's goal at 22.5: its coarse steps reach \
the goal square's edge on the step, the goal snapped to the grid 10 off its line)"""
expect = ["rows[-1]['地堡血'] >= 99 and rows[-1]['电厂血'] >= 99", "rows[-1]['兵'] == 11"]

[[reading]]
id = "seal_units_leave_the_enemys_buildings_alone_by_themselves[pam]"
scene = {build = "engine_seal", check = "pam", until = 61}
bench = "the player's soldier attack-moves past the enemy's bunker and plant the same way: both 100 for 61 s, at the goal s22 (bench engine_seal pam 2026-11-08)"
proves = "sim Sim.takes_by_itself: an attack-move takes no building either"
expect = ["rows[-1]['地堡血'] >= 99 and rows[-1]['电厂血'] >= 99", "rows[-1]['兵'] == 11"]

[[reading]]
id = "seal_after_an_attack_move_the_computers_soldier_goes_back_for_the_plant"
scene = {build = "engine_seal", check = "ebldam", until = 62}
bench = "twice: some time after the enemy soldier is at its attack-move goal (s19) the player's plant 500 back loses 5 % / 3 s (from s25 in one run, s31 in the other; the bunker untouched), the soldier never in the strip south of the line round the plant (bench engine_seal ebldam)"
proves = "sim Sim.takes_by_itself: who fires is not known (that soldier walking back along the line, or the ebld lane's)"
expect = "rows[-1]['电厂血'] <= 50"
mismatch = "sim plant 100 % at s61 (it leaves the plant alone); bench loses 5 % / 3 s from s25-s31"

[[reading]]
id = "seal_told_to_attack_through_the_row_it_walks_round_the_end"
scene = {build = "engine_seal", check = "attack", until = 62}
bench = "engine_seal attack (2026-11-08): the peacekeeper leaves the start by s4, is north of the row's end from s7 (5 = 1 + 4; never east of it), the MCV 97 at s10 down to 85 at s40"
proves = "sim Sim.fire_spot: an ordered attack takes the shortest way to a clear spot in range"
expect = [
    "rows[times.index(61)]['兵'] & 1 and rows[times.index(61)]['兵'] & 4",
    "next(t for t, r in zip(times, rows) if r['敌车血量'] < 100) <= 13",
    "rows[times.index(61)]['敌车血量'] <= 90",
]
