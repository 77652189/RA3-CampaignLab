# Bench readings of checks/engine_topple.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# ToppleUpdate, bench 2026-11-09 engine_topple a / b, 11-10 c (docs/engine/crush.md). Each row is undestroyed frames +
# 1000 x dying frames + 1000000 x frames at the goal.

[[reading]]
id = "test_topple_the_five_props_disappear_at_the_bench_frames_without_ever_dying"
scene = {build = "engine_topple", check = "a", until = 50}
bench = "bench 2026-11-09: props gone at frames 162 / 118 / 163 (a), 119 / never / 170 (b); the Hammers at the goal from 91 / 91 / 91 and 91 / 111 / 110; the conscript's control outlasts 710 frames"
proves = "ToppleUpdate: props disappear at the bench frames and never die"
each = [{build = "engine_topple", check = "a", destroyed = [162, 118, 163], arrivals = [91, 91, 91]},
        {build = "engine_topple_b", check = "b", destroyed = [119, -1, 170], arrivals = [91, 111, 110]}]
let = {frames = "rows[-1]['帧数']", cells = "[rows[-1][k] for k in ('行1', '行2', '行3')]"}
expect = [
  "710 <= frames < 1000",
  "all(c // 1000 % 1000 == 0 for c in cells)",
  "all(c % 1000 == frames if g < 0 else abs(c % 1000 - g) <= 2 for c, g in zip(cells, destroyed))",
  "all(abs((frames - c // 1000000 + 1) - a) <= 2 for c, a in zip(cells, arrivals))",
]

[[reading]]
id = "test_enable_dynamics_collide_a_lantern_without_it_is_crushed_and_gone_at_the_same_frames"
scene = {build = "engine_topple_c", check = "c", until = 50}
bench = "engine_topple c, bench 11-10: the retail lantern, its flattened copy without EnableDynamicsCollide and the copy with it -- every Hammer at its goal at frame 91, every lantern gone at 162, never dying"
proves = "EnableDynamicsCollide: the module (no fields) changes nothing a script reads; the three lanes alike"
let = {frames = "rows[-1]['帧数']", cells = "[rows[-1][k] for k in ('行1', '行2', '行3')]"}
expect = [
  "frames >= 700",
  "all(c // 1000 % 1000 == 0 and abs(c % 1000 - 162) <= 2 for c in cells)",
  "all(abs((frames - c // 1000000 + 1) - 91) <= 2 for c in cells)",
  "len({c % 1000 for c in cells}) == 1",
]
