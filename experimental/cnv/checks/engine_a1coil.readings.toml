# Bench readings of checks/engine_a1coil.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# The retail tesla coil (SovietBaseDefenseAdvanced, gun AttackRange 350; BOX 10 x 10, circle 14.1) against the
# player's retail SovietPowerPlant (BOX 30 x 30, circle 42.4), the plant at a centre distance east of the coil.
# Counters a / d: 射程甲 = base 1, removed 10, high 100, switch 1000 (lanes picked by the coil); 射程乙 = order 1,
# low 10 (d: ordered by NAMED_ATTACK_NAMED at 10 s). A flag once the lane's plant is hurt.

[[reading]]
id = "a_the_coil_leaves_plants_370_to_410_off_alone"
scene = {build = "engine_a1coil", check = "a", until = 46}
bench = "CampA1CoilA (11-25, A382, head f8eff838): 射程甲 0, 射程乙 0 at s1-s46 (centres 370 / 385 / 393 / 400 / 410 and the P4 offset 404)"
proves = "engine/combat/range.in_range: a structure target is reached at its centre -- the coil's circle edge to the plant's centre <= 345 (centre 359.1); the plant's circle 42.4 counts for 11 at most (INFERRED for other structures)"
expect = "win(2, 45, '射程甲') == [0] * 44"

[[reading]]
id = "d_the_idle_coil_takes_the_plants_300_to_355_off"
scene = {build = "engine_a1near", check = "d", until = 46}
bench = "CampA1NearD (11-25, A382, head f8eff838): 射程甲 1111 at s2-s46 (centres 300 / 320 / 340 / 355, no order)"
proves = "engine/orders/target.takes_by_itself: an IMMOBILE shooter (the coil) takes an enemy building by itself, a NOT_AUTOACQUIRABLE + AUTO_ACQUIRABLE_BY_AI one too (the plant; mobile shooters do not, engine_seal); other immobile shooters INFERRED"
expect = "win(2, 45, '射程甲') == [1111] * 44"

[[reading]]
id = "d_an_order_does_not_stretch_the_coil_to_370"
scene = {build = "engine_a1near", check = "d", until = 46}
bench = "CampA1NearD: 射程乙 0 at s1-s46 (370 east and the P4 offset, both ordered at 10 s)"
proves = "engine/combat/range.in_range: a named target is held to the same reach (the coil's circle edge to the plant's centre <= 345)"
expect = "win(2, 45, '射程乙') == [0] * 44"

[[reading]]
id = "b_the_coil_shoots_its_side_plant_once_the_player_takes_it"
scene = {build = "engine_a1cap", check = "b", until = 46}
bench = "CampA1CapB (11-25, A382): 归属 1000 from s11; 占打 0 to s11, 1 at s12-s15, then one more every 4 s (9 at s44-s46)"
proves = "takes_by_itself: the coil's idle pick of a building is by its owner now (the plant the engineer took is an enemy's)"
mismatch = "sim 归属 0, 占打 0 throughout: the engineer dies on its way in (bench: in at s11, the coil's first shot at s12)"
expect = ["win(1, 10, '占打') == [0] * 10", "win(11, 11, '归属') == [1000]", "1 <= win(13, 13, '占打')[0] <= 2", "win(45, 45, '占打')[0] >= 7"]

[[reading]]
id = "h_a_named_attack_on_a_neutral_target_is_dropped"
scene = {build = "engine_a1gate", check = "h", until = 31}
bench = "CampA1GateH (11-25, A382, head 756e44ab): 甲 111 at s1-s31 -- Tanya never leaves her 30 square for a neutral wall, gate or rock (NAMED_ATTACK_NAMED at 3 s), all three stand"
proves = "engine/orders/order.order_attack: a target of a neutral side is turned down without force, as one of its own (INFERRED: one order, NAMED_ATTACK_NAMED, one shooter, Tanya)"
expect = "win(1, 30, '甲') == [111] * 30"

[[reading]]
id = "h_b_tanya_walks_up_to_an_enemy_wall_and_plant_and_blows_them"
scene = {build = "engine_a1gate", check = "h", until = 31, shot_clock = true}
bench = "CampA1GateH (11-25, A382, run_queue head 756e44ab): 乙 s1 711, s2 655, s3 677, s4 477, s5-s31 066 -- the s1 wall (removed) and plant (switch) each blown ~1 s after she is on it, and she stays by them"
proves = "engine/data/units.read_fight: a template writing no ArmorSet takes the first unconditioned one it inherits (MJ_PalaceWall01: StructureArmor, SNIPER 0 %, so her pistols cannot take it and her C4 line does); engine/combat/attach: a ground STRUCTURE is a parent of the C4 as a ground vehicle is (A387 h)"
expect = "[v % 100 for v in win(9, 30, '乙')] == [66] * 22"

[[reading]]
id = "h_c_tanya_goes_for_enemies_by_herself_before_the_order"
scene = {build = "engine_a1gate", check = "h", until = 31, shot_clock = true}
bench = "CampA1GateH (as h_b): low's tank dead by s2, before the 3 s order; she is back home from s5 (low 0)"
proves = "an idle Tanya takes an enemy past her C4's reach (1) by herself and walks to it; the order on the dead tank finds nothing and she goes back to where she stood (INFERRED)"
mismatch = "sim 乙 711 at s2, 677 at s5-6, 477 at s7, 66 from s8: idle she now goes for the tank by herself (E263: her slot's C4 line) and comes home, but all three lanes settle 3 s after the bench's s5 (the ordered two as well)"
expect = "win(5, 30, '乙') == [66] * 26"

[[reading]]
id = "g_a_chronosphere_charges_180_s_and_waits_while_its_owner_is_dark"
scene = {build = "engine_a1cd", check = "g", until = 290}
bench = "CampA1CdG (11-25, A382, head 3f93950d, every 2 s): 就绪 0 to s175, 1 at s177-s205, 11 from s207; 电 10 at s59-s87 (s2's plant the player's 60-90 s). The bench's labels run 1-3 s behind the mission clock (the 20 / 60 / 90 s timers seen by s19 / s59 / s89, not by s17 / s57 / s87): s1 ready in (177, 180], s2 in (207, 210]"
proves = "engine/objects/power.charged / charge_due: SKIRMISH_SPECIAL_POWER_READY of a thing's own power reads its charge -- AvailableAtStart false: ReloadTime from the frame it was made, held a frame for each frame it is POWERED and unpowered (paused, not reset); engine/modules/specialpower.SpecialPowerData.parse reads AvailableAtStart for every family (StoreObjects too)"
expect = ["win(2, 177, '就绪') == [0] * 176", "win(181, 207, '就绪') == [1] * 27", "win(211, 289, '就绪') == [11] * 79", "win(61, 88, '电') == [10] * 28"]

# engine_a1gar: per lane a retail GE_TownHouse01 (angle 0) held by two of s1's conscripts (reach 262.5 inside: the
# house's AttributeModifier_Garrisoned RANGE 175 %), the player's engineer east (255 / 280 / 310 / 335) or north
# (280 / 310) of its centre. 驻甲 / 驻乙 flag the lanes whose engineer is hurt (base 1 removed 10 high 100 / switch 1
# order 10 low 100); j / k add 位甲 / 位乙: where each conscript sits, a digit each (lane k of the three at 10 ** 2k,
# con 0 then con 1), 3 x (1 east / 2 west of the centre by > 3) + (1 north / 2 south). Bone sides: a389_garrison_seats.md.

[[reading]]
id = "e_two_conscripts_reach_310_east_and_280_north_but_not_255_east"
scene = {build = "engine_a1gar", check = "e", until = 31}
bench = "CampA1GarE (11-25, A382, head 3f93950d): 驻甲 100, 驻乙 10 at s1-s31 -- only high (310 east) and order (280 north) hit; j (11-26, head f1df41ba) the same"
proves = "engine/objects/garrison.Garrisons.spot: a passenger shoots from its seat (a BONEGARRISON bone), not the house's centre -- j: the high house's con 0 sat east (bone 08, 252.6 from 310 east), the order house's at 01 (242.4 from 280 north)"
mismatch = "sim 驻甲 0, 驻乙 0: every house seats its two at 04 / 07 (south-west: 275.7 from 255 east), the bench's seats are each house's own (k)"
expect = ["win(1, 30, '驻甲') == [100] * 30", "win(1, 30, '驻乙') == [10] * 30"]

[[reading]]
id = "k_the_base_house_seats_its_two_at_the_first_two_bones"
scene = {build = "engine_a1gar", check = "k", until = 31}
bench = "CampA1GarK (11-26, head a7fb2450; j with every engineer deleted at the start): 位甲 258788 at s1-s31 -- the base house's last two digits 88, both south-west (bones 04 / 07, the first two in their names' hash order)"
proves = "engine/objects/garrison.seats / spot: a passenger stands at its house's seat bone (data/garrison_bones.json), turned with the house; the first passenger the first free bone in hash order (INFERRED: one house of six)"
expect = "[v % 100 for v in win(1, 30, '位甲')] == [88] * 30"

[[reading]]
id = "k_with_no_target_each_house_seats_its_two_its_own_way"
scene = {build = "engine_a1gar", check = "k", until = 31}
bench = "CampA1GarK: 驻 0 0, 位甲 258788, 位乙 788428 at s1-s31 -- every lane put in the same way, the seats differ house to house (removed 78, high 52, switch 28, order 84, low 87); j's (238788 / 788428) are these but the high house's con 0 east (bone 08: with its target in reach it moved to the free bone nearest it)"
proves = "the seat a house gives each passenger: the same game to game (j and k, 11 of 12), not the entry order's; seeded random or by id not told apart"
mismatch = "sim 位甲 888888, 位乙 888888: every house the first two bones (04 / 07)"
expect = ["win(1, 30, '位甲') == [258788] * 30", "win(1, 30, '位乙') == [788428] * 30"]
