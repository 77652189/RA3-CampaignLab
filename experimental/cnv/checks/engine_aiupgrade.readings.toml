# Bench readings of checks/engine_aiupgrade.py (format: experimental/cnv/readings.py; runner: tests/conformance).

[[reading]]
id = "upgrade_entry_pair_setup"
scene = {build = "aicupgon", check = "a", until = 102}
each = [{build = "aicupgon"}, {build = "aicupgoff"}]
bench = "BuildEntry.Upgrade pair s40-s100: the refinery prerequisite and the sole upgrade seller (one construction yard) survive."
proves = "simai BuildEntry.Upgrade: the pair keeps its prerequisite and its only seller alive"
let = {sel = "[r for t, r in zip(times, rows) if 40 <= t <= 100]"}
expect = [
    "len(sel) > 0",
    "all(r['矿厂数'] >= 1 and r['建造厂数'] == 1 for r in sel)",
]

[[reading]]
id = "upgrade_entry_pair_ownership"
scene = {build = "aicupgon", check = "a", until = 102}
each = [{build = "aicupgon", want = 2}, {build = "aicupgoff", want = 0}]
bench = "Bench aicupgon:a holds the Tech2 upgrade on 2 buildings from s39 (the yard and the barracks its receiver reaches); aicupgoff holds 0. (The model buys it at s20 and holds 2 from s40.)"
proves = "simai BuildEntry.Upgrade presence: the upgrade is bought and held by the two receivers only when the entry is present"
let = {sel = "[r for t, r in zip(times, rows) if 40 <= t <= 100]"}
expect = [
    "len(sel) > 0",
    "all(r['二级持有'] == want for r in sel)",
]

[[reading]]
id = "upgrade_ban_holds_until_the_allow_as_the_bench"
scene = {build = "aicupgon", check = "ban", until = 66}
bench = "A264 bench aicupgon:ban: Upgrade_AlliedTech2 banned from s1, allowed at 40 s: 0 holders s1-s62, 2 from s63. (The model holds none to the allow and 2 from s56; its rebuy right at the allow is 7 s before the bench, INFERRED.)"
proves = "simai ALLOW_DISALLOW_ONE_UPGRADE: a banned upgrade is not bought until the allow"
expect = [
    "all(r['二级持有'] == 0 for t, r in zip(times, rows) if t <= 50)",
    "len([r for t, r in zip(times, rows) if t >= 63]) > 0 and all(r['二级持有'] == 2 for t, r in zip(times, rows) if t >= 63)",
]

[[reading]]
id = "a_state_s_path_test_asks_the_tester_s_set_for_the_written_condition"
item = "AI 启发条件/PathToTargetHeuristic.LocomotorConditionToUseForTest"
scene = {build = "aipttn", check = "a", until = 102}
each = [{build = "aipttn", want = 2}, {build = "aipttp", want = 0}]
bench = "B 11-25 (CampPTTNormalA_mcp_1124_233556, CampPTTPanicA_mcp_1124_233431): aicupgon's Tech2 state gated by one PathToTarget PathExists=true tested by the Jet Tengu. NORMAL: ptt rows cond=0 GROUND path=1 res=1.0, 2 holders from s36; PANIC (no such set): why=noloco res=0.0, 0 holders to s100. On Niagara without bridges the same heuristic read cond=0 GROUND path=0 res=0.0 and cond=6 SUPERSONIC AIR path=1 res=1.0 (CampPTTGroundA / CampPTTAirA 1124), but that map's Tech2 state buys nothing even under a constant heuristic (CampPTTConstA), so no counter there"
proves = "simai Brain.path_to_target: the tester's LocomotorSet for the written condition, none = no way"
let = {sel = "[r for t, r in zip(times, rows) if 40 <= t <= 100]"}
expect = ["len(sel) > 0", "all(r['二级持有'] == want for r in sel)"]

[[reading]]
id = "a_state_s_water_path_test_needs_water_by_both_bases"
item = "AI 启发条件/PathToTargetHeuristic.Surface"
scene = {build = "aipttwg", check = "a", until = 102}
each = [{build = "aipttwg"}, {build = "aipttw"}]
bench = "B 11-25 (CampPTTWGndA / CampPTTWNavA_mcp_1125): aipttn's state with Surface=Water, tested by the Jet Tengu (aipttwg) or retail's Dolphin pairing (aipttw). Niagara has no water within 900 of either base: ptt rows surf=0 own and enemy points 0:0:0 why=nopt res=0.0, 0 holders to s100 in both (Land, aipttn: a way, 2 holders)"
proves = "simai Brain.path_to_target: Surface picks the cell type the two spots are looked for on; no spot = no way"
let = {sel = "[r for t, r in zip(times, rows) if 40 <= t <= 100]"}
expect = ["len(sel) > 0", "all(r['二级持有'] == 0 for r in sel)"]
