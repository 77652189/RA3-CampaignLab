id = "release_to_priority_named_transfer_skips_the_pool"
scene = {build = "aiskirm", check = "m", until = 170}
bench = "aiskirm:m retail 11-11: defense 8 / Cleanup 99 at s125-128, defense 0 / Cleanup 8 at s129, pool 0 with per-frame peak 1 at transfer."
proves = "simai team recruitment: RELEASE_TO_PRIORITY transfers the whole defense team to Cleanup directly"
let = {transfer = "first('清扫', lambda v: v not in (0, 99))", before = "rows[transfer - 1] if transfer is not None else None", after = "rows[transfer] if transfer is not None else None"}
expect = [
    "transfer is not None",
    "before['清扫'] == 99 and before['防御型'] >= 8",
    "all(r['防御型'] == before['防御型'] for r in rows[transfer - 4:transfer])",
    "before['防御型'] - (0 if after['防御型'] == 99 else after['防御型']) == after['清扫']",
    "before['池兵'] == after['池兵'] == 0 and after['池峰'] == 1",
    "abs(times[transfer] - 129) <= 3",
]

