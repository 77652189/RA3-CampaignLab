# Bench readings of checks/engine_aiskirm.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# Skirmish personality rules: unit builder, build states, caps, personality choice, refinery placement (bench 2026-11-11 on).

[[reading]]
id = "the_stock_ai_builds_no_unit_of_ours_from_its_own_barracks"
scene = {build = "aisknew", check = "y", until = 170}
bench = """\
aisknew (copied barracks builds CNVNewPK, no build state lists it): 新维和 0 to s168; the bench built 6 \
Peacekeepers and 12 Javelins beside"""
proves = "simai unit builder: units of ours are built only when a build state lists them"
