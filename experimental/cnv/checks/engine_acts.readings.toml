# Bench readings of checks/engine_acts.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# A scene's until is the old test's seconds + 1 (the old bare Sim.run(u) read the row of second u last).

[[reading]]
id = "acts_flow_as_the_bench"
scene = {build = "engine_acts", check = "flow", until = 31}
bench = """flow, bench 11-13 `run_queue engine_acts:flow` (CampActsFlow, round 211): 甲钱 / 乙钱 1001 / 0 -> 1001 / 1000 -> 2001 / \
1000 (script money never shared); 友血 100 until the FORCE attack (the plain NAMED_ATTACK_NAMED on its own side fires \
nothing); 旗 134 143 175 495 361 41"""
proves = """sim script money (never shared), NAMED_ATTACK_NAMED vs the FORCE attack, and the flag bits: SKIRMISH_AI_DO_NOT_ATTACK \
stops no idle enemy (&2 as &4), SHROUD_REVEAL_TO_ALL discovers the far unit (&1, not &512), TEAM_ALLOW_AI_AUTOACQUIRE \
takes the plant (&8, not &16), the EMP'd unit's move goes on once cleared (&32), TEAM_SET_STANCE 3 holds fire and 0 \
frees it as UNIT_SET_STANCE (&64 with &256; the stance-less &128 from the start)."""
let = {S = "list(zip(times, vals(rows)))[1:]", held = "lambda xs: [k for k, g in __import__('itertools').groupby(xs) if len(list(g)) >= 2]", dedup = "lambda xs: [k for j, k in enumerate(xs) if j == 0 or xs[j - 1] != k]", column = "lambda col, before=None: dedup(held([v[col] for t, v in S if before is None or t < before]))"}
expect = [
    "[v for v in column(0) if v] == [1001, 2001]",
    "column(1) == [0, 1000]",
    "all(v[2] == 100 for t, v in S if t < 8.0) and min(v[2] for t, v in S) <= 3",
    "column(3) == [134, 143, 175, 495, 361, 41]",
]
