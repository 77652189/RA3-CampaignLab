# Bench readings of checks/engine_seqstop.py (format: experimental/cnv/readings.py; runner: tests/conformance).

[[reading]]
id = "seqstop_clears_pending_scripts_keeps_move_and_accepts_fresh_script"
scene = {build = "engine_seqstop", check = "a", until = 25}
bench = """engine_seqstop:a (work/re/c_seqstop_report.md), 继续 / 停止 / 到达 / 逻辑帧: f43 1/1/0; f242 both at their goals \
(3); f252 1/1/3; f282 111/1/3; f308 111/1001/3; f360 111/1001/3 (at(f) = the last row by f)"""
proves = """sim UNIT_STOP_SEQUENTIAL_SCRIPT drops the unit's running and queued scripts (never +10, never +100) but not the \
move a step gave (the stopped unit arrives too); a script given after the stop runs (+1000); the control unit's next \
step waits for its arrival."""
item = "脚本动作 UNIT_STOP_SEQUENTIAL_SCRIPT"
let = {at = "lambda f: [v[:3] for v in vals(rows) if v[3] <= f][-1]", arrived = "next(v for v in vals(rows) if v[2] == 3)"}
expect = [
    "at(43) == [1, 1, 0]",
    "arrived[:2] == [1, 1]",
    "at(282) == [111, 1, 3] and at(308) == [111, 1001, 3] and at(360) == [111, 1001, 3]",
]

[[reading]]
id = "seqteam_steps_wait_for_the_whole_group"
scene = {build = "engine_seqteam", check = "t", until = 25}
bench = """engine_seqteam:t, `run_queue` CampSeqTeamT_mcp_1121_194709 (A289), 走 / 停 / 位 / 逻辑帧: 走 1 till w1 is at WF \
(位 57 at f125), 11 at f140, 1111 at f254 (the queued script right behind); L's +10 by f61 (位 16 -> 48: l1 killed \
at f45)"""
proves = """sim TEAM_EXECUTE_SEQUENTIAL_SCRIPT: the record on the team, a step waits till every living member of its \
group is idle (w2 idle at once did not let +10 through), a member's death takes it out of the group; a second script \
on the same team runs after the first; <This Team> is the team."""
item = ["脚本动作 TEAM_EXECUTE_SEQUENTIAL_SCRIPT"]
let = {walk = "[v for v in vals(rows) if v[0]]", first = "lambda pred: next(v for v in vals(rows) if pred(v))"}
expect = [
    "[k for j, k in enumerate(v[0] for v in walk) if j == 0 or walk[j - 1][0] != k] == [1, 11, 1111]",
    "first(lambda v: v[0] == 11)[2] & 1 and all(v[0] == 1 for v in walk if v[3] < 120)",
    "first(lambda v: v[2] & 32)[3] <= 75",
]

[[reading]]
id = "seqteam_stop_drops_the_teams_scripts"
scene = {build = "engine_seqteam", check = "t", until = 25}
bench = """engine_seqteam:t (as above): 停 1 till 20 s, then 1001 (f304); s1 still reaches SF (位 8 from f125 on)"""
proves = """sim TEAM_STOP_SEQUENTIAL_SCRIPT drops the team's running and queued scripts (never +10 / +100), not the move a \
step gave; a script given after it runs."""
item = ["脚本动作 TEAM_STOP_SEQUENTIAL_SCRIPT"]
expect = [
    "sorted({v[1] for v in vals(rows)} - {0}) == [1, 1001]",
    "all(v[1] == 1 for v in vals(rows) if 30 < v[3] < 290) and vals(rows)[-1][2] & 8",
]

