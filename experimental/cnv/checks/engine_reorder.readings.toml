# Bench readings of checks/engine_reorder.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# Moved from tests/test_simbench.py (T3 A): until is the old run's until + 1. Re-ordering: the same attack order given
# again every frame (sim.Sim.order_attack ignores it). Bench 2026-11-07 engine_reorder: straight on, round a wall line
# (dt*), and standing in range but turned 90 degrees away (tu*), King or Guardian, every frame or once: all walk and
# fire alike, the wall hurt from s10 (straight), s16 (dt King), s13 (dt Guardian), s14 (tu King), s13 (tu Guardian).
# A4's King stalling on the bridge under every-frame orders (level line 06282d5) did not show on the island (no bridge
# there). Rows are one a second from s0 (row i = s i); the old helper left row 0 out of the 'first hurt' search.

[[reading]]
id = "reorder_every_frame_is_the_order_once"
scenes = {a = {build = "reorder_once", check = "frames", until = 26}, b = {build = "reorder_every", check = "frames", until = 26}}
each = [
    {a = {build = "reorder_once", until = 26}, b = {build = "reorder_every", until = 26}, bench_s = 10},
    {a = {build = "reorder_dt1", until = 46}, b = {build = "reorder_dtev", until = 46}, bench_s = 16},
    {a = {build = "reorder_tu1", until = 36}, b = {build = "reorder_tuev", until = 36}, bench_s = 14},
]
bench = "the wall hurt from s10 (straight), s16 (dt King), s14 (tu King); the every-frame order walks and fires like the once one (bench 2026-11-07 engine_reorder)"
proves = """sim.Sim.order_attack ignores the same order given again every frame: the every-frame variant runs row for row as \
the once one, and the wall is hurt within 3 s of the bench (the simulator starts ~1-2 s late: no acceleration)."""
let = {hp = "next(k for k in a[0] if '血' in k)", hurt = "next(i for i, r in enumerate(a) if i >= 1 and r[hp] < 100)"}
expect = ["a == b", "abs(hurt - bench_s) <= 3"]

[[reading]]
id = "reorder_every_frame_guardian"
scene = {build = "reorder_dtevg", check = "frames", until = 51}
each = [{build = "reorder_dtevg", until = 51, bench_s = 13}, {build = "reorder_tuevg", until = 36, bench_s = 13}]
bench = "the wall hurt from s13 (dt Guardian) and s13 (tu Guardian) under every-frame orders (bench 2026-11-07 engine_reorder)"
proves = "sim.Sim.order_attack: a Guardian under every-frame orders walks and fires like one given the order once, the wall hurt within 3 s of the bench"
let = {hp = "next(k for k in rows[0] if '血' in k)", hurt = "next(i for i, r in enumerate(rows) if i >= 1 and r[hp] < 100)"}
expect = "abs(hurt - bench_s) <= 3"
