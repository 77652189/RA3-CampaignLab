# Bench readings of checks/engine_scripts8b.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# Team status and power scripts, bench 2026-11-09. The bench's seconds run 1-2 s ahead of the mission's timers: the
# simulator's readings, in mission seconds, are asserted at most 2 s later than the bench's.

[[reading]]
id = "scripts8b_team_status_holds_and_frees_the_fire_as_the_bench"
scene = {build = "engine_scripts8b", check = "status", until = 21}
bench = """\
status: TEAM_CHANGE_OBJECT_STATUS NO_ATTACK holds the crew's fire to 10 s (甲敌 100 to s8), then 75 / 50 / 25 at s9 / s11 \
/ s13 (12.5 a second); the control's enemy (乙敌) 87 at s1, down ~6 a second"""
proves = "sim TEAM_CHANGE_OBJECT_STATUS: NO_ATTACK holds the crew's fire, freeing it lets the crew fire at its pace"
let = {chg = "[(t, r) for i, (t, r) in enumerate(zip(times, rows)) if i == 0 or r != rows[i - 1]]", at = "lambda k, p: next((t for t, r in chg if p(r[k])), None)", at75 = "at('甲敌', lambda v: v <= 75)", at25 = "at('甲敌', lambda v: v <= 25)", down = "[(t, r['乙敌']) for t, r in chg if 0 < r['乙敌'] < 100]"}
expect = [
    "all(r['甲敌'] == 100 for t, r in chg if t <= 10)",
    "10 <= at75 <= 12 and 3 <= at25 - at75 <= 5",
    "5 <= (down[0][1] - down[-1][1]) / (down[-1][0] - down[0][0]) <= 8",
]

[[reading]]
id = "scripts8b_base_power_sets_the_supply_as_the_bench"
scene = {build = "engine_scripts8b", check = "power", until = 11}
bench = "power: PLAYER_SET_BASE_POWER (1000) at 2 s, (300) at 6 s -- 电级 4 then 3: it sets the supply, it does not add"
proves = "sim PLAYER_SET_BASE_POWER: it sets the supply, it does not add"
let = {chg = "[(t, r) for i, (t, r) in enumerate(zip(times, rows)) if i == 0 or r != rows[i - 1]]", at = "lambda k, p: next((t for t, r in chg if p(r[k])), None)"}
expect = [
    "[r['电级'] for t, r in chg][-2:] == [4, 3]",
    "at('电级', lambda v: v == 4) <= 4 and 6 <= at('电级', lambda v: v == 3) <= 8",
]
