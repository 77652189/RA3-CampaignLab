# Bench readings of checks/engine_aicombat.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# Capacity one, the first candidate shooting at a player tank in range until s30 (its foe deleted then), the second
# idle. Bench 2026-11-16 (run_queue, both PASS), 战者在原位 闲者在原位 首离身份 首离帧: aicombat0 s1-10 1 1 0 0,
# s11-55 1 0 2 184; aicombat1 s1-28 1 1 0 0, s29-55 0 1 1 462 (work/re/b220_recruit_combat.md).

[[reading]]
id = "off_the_idle_one_is_taken_and_the_fighter_stays"
item = "AI 组队招人/TeamTemplate.AllowRecruitUnitsInCombat"
scene = {build = "aicombat0", check = "a", until = 56}
bench = "aicombat0: 1 1 0 0 at s1-10; 1 0 2 184 at s11-55 (the idle one leaves f184, the fighter stays after its fight)"
proves = "simai Unit.in_combat (AllowRecruitUnitsInCombat false): a unit shooting at a foe in range is not taken"
expect = ["win(2, 10, '首离身份') == [0] * 9", "win(12, 55, '首离身份') == [2] * 44",
          "win(12, 55, '战者在原位') == [1] * 44", "win(12, 55, '闲者在原位') == [0] * 44"]

[[reading]]
id = "on_the_fighter_is_taken_and_the_idle_one_stays"
scene = {build = "aicombat1", check = "a", until = 56}
bench = "aicombat1: 闲者在原位 1 throughout s1-55; 首离身份 1 from s29 (the fighter, f462), 战者在原位 0 from s29"
proves = "teams.recruit + AllowRecruitUnitsInCombat true: the gate is skipped, the first candidate (the fighter) fills the slot"
expect = ["win(2, 55, '闲者在原位') == [1] * 54", "win(32, 55, '首离身份') == [1] * 24",
          "win(32, 55, '战者在原位') == [0] * 24"]

[[reading]]
id = "on_the_taken_fighter_fights_on_before_it_leaves"
scene = {build = "aicombat1", check = "a", until = 56}
bench = "aicombat1: 战者在原位 1 and 首离身份 0 at s1-28: the taken fighter shoots on where it stands until its foe goes (s30)"
proves = "simai team attack: a recruited unit keeps the fight it is in before going with the team"
expect = "win(2, 28, '战者在原位') == [1] * 27"
mismatch = "the simulator sends the taken fighter off with the team at f175 (bench: it leaves f462); as k2gate1's"
