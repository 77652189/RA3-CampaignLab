# Bench readings of checks/engine_acts7.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# A scene's until is the old test's seconds + 1 (the old bare Sim.run(u) read the row of second u last).

[[reading]]
id = "acts_x_own_as_the_bench"
scene = {build = "engine_acts_x", check = "own", until = 31}
bench = """own, bench 11-14 `run_queue engine_acts_x:own` (CampActsXOwn, round 217; the bench's seconds ~1-2 behind): 主 1365 -> \
1369 at s2 -> 1433 at s10; 钱 74 -> 29"""
proves = """sim PLAYER_TRANSFER_OWNERSHIP_PLAYER moves only the giver's units on no team (Soviet_5's conscript UNIT_AI_TRANSFER took \
off its crew; Soviet_2's, off their team since the start), not ones on a team (teamSoviet_5's tank, Soviet_6's, a \
Soviet_2 conscript put on a crew); the giver's money whole to the receiver (Player_1 1000 -> 6000, Soviet_5 0). The \
12 s money (Soviet_2's start) is not asserted."""
let = {F = "list(zip(times, vals(rows)))", first_at = "lambda col, value: next(t for t, v in F if v[col] == value)"}
expect = [
    "[v[0] for t, v in F if t >= 1.0][:1] == [1365] and vals(rows)[-1][0] == 1433",
    "{v[0] for t, v in F} == {1365, 1369, 1433}",
    "2.0 <= first_at(0, 1369) <= 5.0 and 10.0 <= first_at(0, 1433) <= 13.0",
    "2.0 <= first_at(1, 29) <= 5.0 and {v[1] for t, v in F if 1.0 <= t < 12.0} <= {74, 29}",
]
