# a candidate's eligibility and the placement point were not read; work/re/c_conyard_report.md.

[[reading]]
id = "conyard_named_gate_replay"
scene = {build = "aicyard0", check = "a", until = 36}
each = [{build = "aicyard0"}, {build = "aicyard300"}]
bench = "C 2026-11 aicyard0 / aicyard300 (exit distance 0 / 300, the 15 s exemption kept): 核心 / 电厂 / 近处电厂 / 宿主 1/0/0/1 at every sample of both runs (s1-80 / s1-55); the team holds no member and no target"
proves = "simai MinDistanceFromConyardEntrance gate: the plant team is never sent, at either distance"
expect = ["len(win(1, 35, '宿主')) == 35", "all(tuple(v) == (1, 0, 0, 1) for v in vals(rows))"]
