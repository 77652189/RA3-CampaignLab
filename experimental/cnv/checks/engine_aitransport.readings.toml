# Bench readings of checks/engine_aitransport.py (format: experimental/cnv/readings.py; runner: tests/conformance).

[[reading]]
id = "use_transports_false_twinblade"
scene = {build = "aitranst0", check = "a", until = 50}
bench = "B 2026-11-21 aitranst0 (UseTransports false, a Twinblade and four Peacekeepers, the plant on Goat Island, no bridges; CampAITransT0A_mcp_1121_111841, ~6.5 logic frames a wall second, read by index.json's frames as logic seconds, frame / 15): counters (aboard, Peacekeepers on the island, Twinblade on the island, Peacekeepers at home) f41 (s2.7) 0 0 0 4, f240 (s16) 0 0 0 3, f247 (s16.5) 0 0 0 2, f333-560 (s22.2-37.3) 0 0 1 2. ra3ext: the team takes all five at f153; the Peacekeepers are out of it by f248."
proves = "Tactic UseTransports false: the paired passengers are never put aboard, the transport crosses alone; the recruit pairs the Peacekeepers with the Twinblade (they cannot reach the island themselves)"
# no item: boarding (use_transports_true_twinblade) is not modelled, so Tactic.UseTransports stays INFERRED
expect = [
    "max(win(3, 37, '车内步兵')) == 0",
    "win(17, 37, '步兵在家') == [2] * 21",
]


[[reading]]
id = "use_transports_false_twinblade_stays"
scene = {build = "aitranst0", check = "a", until = 50}
bench = "the same run: the Twinblade in the island box f333-560 (s22.2-37.3, its last frame), attacking the plant from f345 (s23); E's longer run (CampAITransT0A_mcp_1121_142200, twinblade_plant_damage) has it there f338-701 (s22.5-46.7), the plant at 13 % at the last frame. Read 11-21 as s49-86 (wall seconds) and a mismatch: 16 s early -- the wall clock taken for 15 frames a second (wallclock_audit_1121)"
proves = "the lone transport stays at its target while the target stands (how long it stays after the plant falls is not read)"
expect = ["win(23, 46, '激流在岛') == [1] * 24"]


[[reading]]
id = "twinblade_plant_damage"
scene = {build = "aitranst0", check = "a", until = 50}
bench = "E 2026-11-21 aitranst0 (counter 电厂血 = the plant's health %, in place of 岛上步兵; CampAITransT0A_mcp_1121_142200). The run went ~7.5 logic frames a wall second, so its sN are read here by the frames index.json gives them, as logic seconds (frame / 15): first hit f345 (s23), 78 at f369 (s24.6), 48 at f504 (s33.6), 22 at f634 (s42.3), 13 at f701 (s46.7). Rocket clips at f353 / f487 / f621, 8.9 s apart (ClipReloadTime 8 s), every clip ~20 %; the cannon between"
proves = "the Twinblade's two weapons at a structure, under the AI: the plant falls at the data's rate"
expect = [
    "win(23, 23, '电厂血')[0] >= 95",
    "38 <= win(34, 34, '电厂血')[0] <= 58",
    "8 <= win(47, 47, '电厂血')[0] <= 20",
]
mismatch = "sim (coarse clock) 98 at s23, 62 at s34, 18 at s47 (3.3 %/s, rockets 22.7/s + cannon 10.6/s); bench 48 at s34: its first clip lands at once on the engagement (f353-369, 99 to 78), the coarse clock spreads every clip over its 9 s. Read 11-21 as every other clip missing -- that was the wall clock taken for 15 frames a second (run 3 below)"


[[reading]]
id = "twinblade_plant_damage_player"
scene = {build = "aitranstp", check = "a", until = 40}
bench = "E 2026-11-21 aitranstp (the Twinblade the player's own, a start script force-attacks the plant; CampAITransTPA_mcp_1121_170850, ~6 logic frames a wall second, read by index.json's frames as logic seconds): 72 at f156 (s10.4), 42 at f300 (s20), 11 at f432 (s28.8), 2 at f549 (s36.6). ra3ext uahit (every hit on the plant, object 3132, 1000 hp): the cannon 2.5 a hit from f55; the four clips f142-155 / f278-291 / f413-429 / f550, every one of 8 rockets 25 off the plant (200 a clip); the plant dies to clip 4's first rocket; 3174 (150 hp) is what stands in its place after"
proves = "the Twinblade's two weapons at a structure: AUTO_CANNON 2.5 a round and a clip of 8 x 25 every ~135 frames (ClipSize 8, ClipReloadTime 8 s), every clip landing"
expect = [
    "62 <= win(11, 11, '电厂血')[0] <= 80",
    "34 <= win(20, 20, '电厂血')[0] <= 50",
    "4 <= win(29, 29, '电厂血')[0] <= 18",
]


[[reading]]
id = "twinblade_plant_lasts_to_the_fourth_clip"
scene = {build = "aitranstp", check = "a", until = 40}
bench = "the same run: the plant 6 to 3 % at f495-540 (s33-36), dead at f550 (s36.7)"
proves = "the cannon between clips: ~3.75 hp a second at the end, the 4th clip the kill"
expect = ["min(win(33, 36, '电厂血')) >= 1"]
mismatch = "sim (coarse clock) 0 from s32: its cannon is steady 10.6/s; the bench's comes in bursts (2.5 every 2 frames, then every 10), the first clip 87 frames after the first round"


[[reading]]
