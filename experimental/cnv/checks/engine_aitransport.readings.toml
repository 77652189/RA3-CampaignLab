# Bench readings of checks/engine_aitransport.py (format: experimental/cnv/readings.py; runner: tests/conformance).

[[reading]]
id = "use_transports_false_twinblade"
scene = {build = "aitranst0", check = "a", until = 86}
bench = "B 2026-11-21 aitranst0 (UseTransports false, a Twinblade and four Peacekeepers, the plant on Goat Island, no bridges): counters (aboard, Peacekeepers on the island, Twinblade on the island, Peacekeepers at home) s1-33 0 0 0 4, s35-48 0 0 0 2, s49-86 0 0 1 2. ra3ext: the team takes all five at f153; the Peacekeepers are out of it by f248."
proves = "Tactic UseTransports false: the paired passengers are never put aboard, the transport crosses alone; the recruit pairs the Peacekeepers with the Twinblade (they cannot reach the island themselves)"
item = "AI 战术/Tactic.UseTransports"
expect = [
    "max(win(1, 85, '车内步兵')) == 0",
    "win(40, 85, '步兵在家') == [2] * 46",
]


[[reading]]
id = "use_transports_false_twinblade_stays"
scene = {build = "aitranst0", check = "a", until = 86}
bench = "the same run: the Twinblade in the island box s49-86 (it attacks the plant from f345; the plant still stands at s86, see twinblade_plant_damage)"
proves = "the lone transport stays at its target"
expect = ["win(50, 85, '激流在岛') == [1] * 36"]
mismatch = "sim: the Twinblade on the island s23-54, it destroys the plant (s53, the tactic then rampages off): it gets there 16 s early and deals twice the bench's damage (twinblade_plant_damage) -- not the form-up (kick f244 / go f245 as on the bench f248 / f251)"


[[reading]]
id = "twinblade_plant_damage"
scene = {build = "aitranst0", check = "a", until = 86}
bench = "E 2026-11-21 aitranst0 (counter 电厂血 = the plant's health %, in place of 岛上步兵): 100 to s40, 99 s41, 86 s42, 78 s43, 66 s59, 58 s60, 48 s61, 39 s76, 33 s77, 22 s78, 13 s85-86 (CampAITransT0A_mcp_1121_142200, the frames the same as B's run). ra3ext: the Twinblade hovers at (2733,2729), 155 from the plant; first hit f345 997.5 (one AUTO_CANNON round, 5 x 50 %: B's '2.5 off' was this, the under-attack log writes only an attacker's first hit); rocket clips launched f353 / f486 / f623 (8.9 s apart, ClipReloadTime 8 s), but only every other one takes ~20 % (s42-43, s60-61, s77-78); between them ~0.75 %/s (the cannon, 3 rounds a second, half its data rate)"
proves = "the Twinblade's two weapons at a structure: AUTO_CANNON at 50 % and a rocket clip of 8 x 25 ROCKET land as the data say; the rate does not (every other rocket clip misses, the cannon fires half as often)"
expect = [
    "win(41, 41, '电厂血')[0] >= 95",
    "win(44, 59, '电厂血')[0] - win(44, 59, '电厂血')[-1] <= 15",
    "min(win(80, 85, '电厂血')) >= 10",
]
mismatch = "sim (coarse clock) 98 at s23, then 3.3 %/s to 0 at s53 (rockets 22.7/s + cannon 10.6/s); bench from s41 ~19 hp/s, 13 left at s86. Not explained: why every other rocket clip misses with the shooter still (not the AI's orders: twinblade_plant_damage_player; hypotheses in work/re handoff-e)"


[[reading]]
id = "twinblade_plant_damage_player"
scene = {build = "aitranstp", check = "a", until = 86}
bench = "E 2026-11-21 aitranstp (the Twinblade the player's own, 400 out on the AI one's line, a start script force-attacks the plant; no AI orders): 电厂血 99 s3, 94 s13-15, 90 s16, 82 s17, 72 s18, 63 s34-36, 52 s37, 44 s38, 41 s39, 34 s52-54, 27 s57, 19 s58, 11 s59, 2 s76-86 (CampAITransTPA_mcp_1121_151337): a rocket clip takes ~22 % about every 20 s, the cannon ~0.5 %/s between"
proves = "the alternate-clip miss of twinblade_plant_damage is the Twinblade's own, not the AI's re-sent orders"
expect = [
    "win(15, 18, '电厂血')[0] - win(15, 18, '电厂血')[-1] >= 15",
    "win(19, 36, '电厂血')[0] - win(19, 36, '电厂血')[-1] <= 10",
    "min(win(80, 85, '电厂血')) >= 1",
]
mismatch = "sim (coarse clock) 98 at s2, then 3.3 %/s to 0 at s32; bench ~1 %/s (every other clip lands, the cannon ~0.5 %/s), 2 left at s86. The run's ua log has every clip fired, 8 rockets each ~135 frames apart (f142, f278, f413, f550: ClipSize 8, ClipReloadTime 8 s as the data say), and each clip's 8 go off; only the 2nd, 4th, 6th take the plant's health -- not a long reload, not a rocket lost in flight (~9 frames of a 135-frame cycle). Not where they land either: a second run (CampAITransTPA_mcp_1121_165117, the same health steps) logged each rocket's spot as it went off -- all 32 of clips 1-4 within 35 of the plant's centre (2600, 2650), 7-40 above its base (z 212.5), odd and even clips alike. The odd clips go off on the plant and take nothing; why is not read"


