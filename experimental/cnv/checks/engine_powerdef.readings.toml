# Bench readings of checks/engine_powerdef.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# Moved from tests/test_simbench.py (T3 A): until is the old run's until + 1. A POWERED structure of a player short of
# power holds its fire (sim.Sim.unpowered). Bench 2026-11-07 engine_powerdef: s1's Tesla coil (-75) beside six
# NO_ATTACK Guardians; on (a plant +100): first loss at 111, then one per ~125 frames; off (no plant): none in 728; cut
# (the plant deleted ~150): none after; back (a plant made by script ~150): first loss at 475.

[[reading]]
id = "power_off_the_coil_never_fires"
scene = {build = "powerdef_off", check = "frames", until = 51}
bench = "no tank lost in 728 frames (坦克 6 all along) (bench 2026-11-07 engine_powerdef off)"
proves = "sim.Sim.unpowered: a Tesla coil of a player short of power (no plant) never fires"
let = {R = "[r for t, r in zip(times, rows) if t >= 1]"}
expect = "R[-1]['帧数'] >= 728 and all(r['坦克'] == 6 for r in R)"

[[reading]]
id = "power_on_the_coil_kills_one_tank_per_125_frames"
scene = {build = "powerdef_on", check = "frames", until = 51}
bench = "first loss at 111, then one per ~125 frames (bench 2026-11-07 engine_powerdef on)"
proves = "sim fight model: the coil's clip rhythm (round 77), a tank lost every ~125 frames"
let = {R = "[r for t, r in zip(times, rows) if t >= 1]", lost = "[r['帧数'] for i, r in enumerate(R) if i and r['坦克'] < R[i - 1]['坦克']]"}
expect = "100 <= lost[1] - lost[0] <= 150"
mismatch = """sim: the coil kills a tank every 45-60 frames (lost at frames 61, 106, 166, 211, ...: damage per second over a \
continuous cycle), bench one per ~125: the fight model does not shoot by the clip (round 77 "战斗按弹夹的节奏")"""
