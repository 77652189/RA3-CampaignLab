# Bench readings of checks/engine_powerupgrade_e.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# E175: a power plant's turbine upgrade (work/re/e175_powerupgrade.md).

[[reading]]
id = "test_powerupgrade_named_bench"
scene = {build = "engine_powerupgrade_e", check = "a", until = 23}
bench = "E175 frame 330, base 11, grant 10, remove 11 (original advanced plant has campaign power 500; work/re/e175_powerupgrade.md)"
proves = "power upgrade: the advanced plant's campaign power, with and without the turbine upgrade"
expect = "list(rows[-1].values()) == [330, 11, 10, 11]"
mismatch = "sim [330, 15, 10, 15]: the original advanced plant has campaign power 500, the simulator 350; turbine upgrade possession was never observed"

# b: each line = frame * 100000 + upgrade-holder * 10000 + exact excess power (9999 = no candidate); the clock stops at 330.

[[reading]]
id = "the_plants_without_a_campaign_override_keep_their_power"
scene = {build = "engine_powerupgrade_e", check = "b", until = 23}
bench = "E175 b: normalon / normaloff 100 and advancedoff (the SDK clone) 350 in every line, f60 / f182 / f330 alike; the clock froze at 330"
proves = "excess power of a plant with no consumers: the template's EnergyProduction, unchanged through the f90 grant and f210 removal"
expect = ["all(r['normalon'] % 10000 == 100 and r['normaloff'] % 10000 == 100 and r['advancedoff'] % 10000 == 350 for r in rows)",
          "rows[-1]['normalon'] // 100000 == 330"]

[[reading]]
id = "the_retail_advanced_plant_gives_its_campaign_500"
scene = {build = "engine_powerupgrade_e", check = "b", until = 23}
bench = "E175 b: advancedon (the retail advanced plant) 500 in every line"
proves = "the campaign override of the advanced plant's power (500, the SDK file says 350)"
expect = "all(r['advancedon'] % 10000 == 500 for r in rows)"
mismatch = "sim 350 in every line; bench 500"

[[reading]]
id = "the_turbine_grant_is_never_held"
scene = {build = "engine_powerupgrade_e", check = "b", until = 23}
bench = "E175 b: the upgrade-holder digit 0 in all four lines throughout, the f90..f209 grant window included (f182: 18200100 / 18200100 / 18200500 / 18200350)"
proves = "NAMED_RECEIVE_UPGRADE of Upgrade_PowerPlantTurbine (no definition in SDK Upgrade.xml) leaves no plant holding it"
expect = "all(v % 100000 < 10000 for r in rows for v in r.values())"
mismatch = "sim holds it on all four plants from f90 to f209 (f181: 18110100 ...); bench never"
