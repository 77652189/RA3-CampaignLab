# Bench readings of checks/engine_kind.py (format: experimental/cnv/readings.py; runner: tests/conformance).

[[reading]]
id = "kind_all_as_the_bench"
scene = {build = "engine_kind", check = "all", until = 31}
bench = """\
engine_kind all (round 244, bench 11-15 CampKindAll_mcp_1115_045506): 种 11 -> 15 -> 6 -> 22 -- \
PLAYER_HAS_COMPARISON_UNIT_KIND counts every player's objects of the KindOf; 失 1 / 25 / 29 / 30 / 62 -- \
PLAYER_LOST_OBJECT_TYPE keeps one count per (player, type string) and a drop is the first reader's only; 毁 0. Only the \
plateaus are asserted (the bench steps 1-2 s before the timers; eng e dies when Tanya gets there)"""
proves = "sim kind readers: PLAYER_HAS_COMPARISON_UNIT_KIND counts every player's objects; PLAYER_LOST_OBJECT_TYPE one count per (player, type string)"
let = {by = "dict(zip(times, vals(rows)))"}
expect = [
    "[by[s][0] for s in (2, 10, 14, 17, 29)] == [11, 11, 15, 6, 22]",
    "[by[s][1] for s in (2, 10, 29)] == [0, 1, 62]",
    "by[13][1] in (25, 29) and by[17][1] == 30",
    "all(v[2] == 0 for v in by.values())",
]

