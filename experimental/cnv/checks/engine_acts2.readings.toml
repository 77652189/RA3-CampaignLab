# Bench readings of checks/engine_acts2.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# A scene's until is the old test's seconds + 1 (the old bare Sim.run(u) read the row of second u last).

[[reading]]
id = "acts_seq_as_the_bench"
scene = {build = "engine_acts_seq", check = "seq", until = 41}
bench = """seq, bench 11-13 `run_queue engine_acts_seq:seq` (CampActsSSeq, round 212): 跑 1 11 111 and no more; a second one given to \
the same unit waits for the first -- 排 0 then 11 (never 10); UNIT_IDLE_FOR_SECONDS in it holds nothing back -- 等 11 \
from the first second (the bench is 1-2 s ahead)"""
proves = """sim UNIT_EXECUTE_SEQUENTIAL_SCRIPT runs the subroutine once, each step after the move before it is done; a second \
one given to the same unit waits for the first; UNIT_IDLE_FOR_SECONDS 5.0 in it holds nothing back (written as a float: \
the handler reads the argument's integer slot, 0 -- engine_seqguard:g has the integer wait)."""
let = {S = "list(zip(times, vals(rows)))[1:]", dedup = "lambda xs: [k for j, k in enumerate(xs) if j == 0 or xs[j - 1] != k]", column = "lambda k: dedup([v[k] for t, v in S])"}
expect = [
    "column(0) == [1, 11, 111]",
    "column(1) == [0, 11]",
    "column(2)[-1] == 11 and all(v[2] == 11 for t, v in zip(times, vals(rows)) if t >= 2)",
]

[[reading]]
id = "acts_more_as_the_bench"
scene = {build = "engine_acts_more", check = "more", until = 31}
bench = """more, bench 11-13 `run_queue engine_acts_more:more` (CampActsMMore, round 212; the bench's seconds 1-2 ahead): 驻 767 -> \
363; 诱血 100 till NAMED_STOP, then falling; 旗 61 125 361 363 107 / 106 (bit 1 kept on the bench)"""
proves = """sim TEAM_GARRISON_TEAM_INSTANTLY asks no room (G2's six into one five-place Bullfrog) and deals G1's seven out 4 + 3 \
(the first Bullfrog's kill took 4); the gunner at the ground takes nothing by itself till NAMED_STOP; 旗 61 125 361 \
(UNIT_KILL_ALL_IN_AREA: the player's tank and plant in K, not the enemy's nor the one outside; the Mover at the post's \
place at the order, never its second; the area reveal discovers Hide) 363 (the lure hit after the stop) 107 / 106 (the \
undo). Bit 1 (lure b, dead) and 2 after the lure's death left out: a dying unit's attacked flag outlasts it on the \
bench (round 210's 11 s)."""
let = {S = "list(zip(times, vals(rows)))[1:]", held = "lambda xs: [k for k, g in __import__('itertools').groupby(xs) if len(list(g)) >= 2]", dedup = "lambda xs: [k for j, k in enumerate(xs) if j == 0 or xs[j - 1] != k]", flags = "dedup([v[2] & ~1 for t, v in S])"}
expect = [
    "dedup(held([v[0] for t, v in S])) == [767, 363]",
    "all(v[1] == 100 for t, v in S if t < 12.0) and min(v[1] for t, v in S) == 0",
    "flags[:5] == [60, 124, 360, 362, 106]",
]
