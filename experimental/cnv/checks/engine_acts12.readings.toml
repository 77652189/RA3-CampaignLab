# Bench readings of checks/engine_acts12.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# A scene's until is the old test's seconds + 1 (the old bare Sim.run(u) read the row of second u last).

[[reading]]
id = "acts_mix_all_as_the_bench"
item = [
    "脚本动作 NAMED_USE_COMMANDBUTTON_ABILITY:Command_SmokeBombSpecialPower",
    "脚本动作 NAMED_USE_COMMANDBUTTON_ABILITY:Command_ToggleEnergizedArmorSpecialPower",
    "脚本动作 NAMED_USE_COMMANDBUTTON_ABILITY:Command_ActivateRoarSpecialPower",
    "脚本动作 NAMED_USE_COMMANDBUTTON_ABILITY_AT_WAYPOINT:Command_ActivateLeapSpecialPower",
]
scene = {build = "engine_acts_mix", check = "all", until = 25}
bench = """all, bench 11-14 `run_queue engine_acts_mix:all` (CampActsMixAll, round 224; bench row s_k = mission k + 2): 技 101 \
s2-s6, 1101 s7, 3101 s8-s10, 3000 s11 on; 吼 1 s2-s11, 0 s12 on; 跳 11 from s3; 兵 0 all along (the build of then left \
the bomber out: acts_mix_drop_lands)"""
proves = """sim the smoke bomb's NON_AUTOACQUIRABLE and the energized armor's GENERIC_TOGGLE_STATE about 10 s from the press, the \
armored Tsunami at its square a reading before its twin (SPEED 125 %); the plain roar held its conscript 10 s, the one \
pressed _ON_NAMED nobody; the Sickle's leap 250 off landed within two readings. Off by one reading at the modifiers' end \
(bench s11 off, the simulator's a reading later): rows 11 / 12 skipped."""
let = {at = "dict(zip(times, vals(rows)))", bench = "{**{k: (101, 1, 11) for k in range(3, 7)}, 7: (1101, 1, 11), **{k: (3101, 1, 11) for k in (8, 9, 10)}, **{k: (3000, 0, 11) for k in range(13, 23)}}"}
expect = [
    "all(tuple(at[k + 2][:3]) == want for k, want in bench.items())",
    "at[4][0] == 101 and at[4][2] == 0",
]

