# Bench readings of checks/engine_modeldur.py, variants t / u (format: experimental/cnv/readings.py; runner:
# tests/conformance). The unit action's a / b are still the old test tests/test_modeldur_bench_c.py.

[[reading]]
id = "team_timed_condition_on_every_member_for_the_unit_span"
scene = {build = "engine_modeldur", check = "t", until = 16}
bench = "CampModelDurT_mcp_1121_165527: 状态 3 from s1 to f181, 0 from f188; e1帧 / e2帧 151 / 151 at the end; the loner (4) never"
proves = "act_object TEAM_SET_MODELCONDITION_FOR_DURATION: every team member the unit action's span (10 s -> 151 frames, boundary included), no one outside the team"
expect = ["counter('CNV_ModelDur_e1') == 151", "counter('CNV_ModelDur_e2') == 151",
          "all(r['状态'] in (0, 3) for r in rows)", "rows[-1]['状态'] == 0"]
item = "脚本动作 TEAM_SET_MODELCONDITION_FOR_DURATION"

[[reading]]
id = "team_condition_on_and_off_for_every_member"
scene = {build = "engine_modeldur", check = "u", until = 12}
bench = "CampModelDurU_mcp_1121_165736: 状态 3 from s1 to f120, 0 from f128; e1帧 / e2帧 90 / 90 at the end; the loner (4) never"
proves = "act_object TEAM_SET_MODELCONDITION: USER_2 on every team member until the off, no one outside the team"
expect = ["counter('CNV_ModelDur_e1') == 90", "counter('CNV_ModelDur_e2') == 90",
          "all(r['状态'] in (0, 3) for r in rows)", "rows[-1]['状态'] == 0"]
item = "脚本动作 TEAM_SET_MODELCONDITION"
