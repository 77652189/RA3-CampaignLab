# Bench readings of checks/engine_storestate_e.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# E223: Tanya's time belt and her StoreCurrentStateUpdate. Arms On (retail MaxTime 5 s), Long (12 s), Short (2 s);
# counters: each arm's health in percent; the belt pressed 187 frames after the first hurt.

[[reading]]
id = "the_belt_goes_back_to_the_oldest_kept_state"
scene = {build = "engine_storest_e", check = "a", until = 40}
bench = """CampStoreStA_mcp_1124_133629: 5 % off a second in all three from s25 to s35 (45), from s36 70 100 55 -- \
On back 83-97 frames (5 s kept), Long past the first hurt (12 s kept, TimeStepsBack 10 s: no cap), Short 38-52 (2 s)"""
proves = """StoreCurrentStateUpdate keeps MaxTime and some more, the belt takes its thing back to the oldest kept state's \
health whatever TimeStepsBack asks"""
item = "物体模块 Behaviors/StoreCurrentStateUpdate"
expect = "vals(rows)[-1] == [70, 100, 55]"

[[reading]]
id = "the_store_keeps_about_twelve_frames_past_its_max_time"
scene = {build = "engine_storest_e", check = "b", until = 40}
bench = """CampStoreStB_mcp_1124_133934: 1 hit point a frame, 39 % at s35, from s36 66 100 51 -- On back 85-88 frames \
(75 + 12), Short 40-43 (30 + 12); the bleed reads 1 % below the simulator's before the press as after it"""
proves = "the oldest state kept is MaxTime + 12 frames old (engine/modules/storestate.py SPAN, fitted on the two stores)"
let = {on = "rows[-1]['原版']", long = "rows[-1]['记12秒']", short = "rows[-1]['记2秒']"}
expect = "65 <= on <= 67 and long == 100 and 50 <= short <= 52"
