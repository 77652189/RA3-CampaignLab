[[reading]]
id = "an_opener_that_only_deposits_to_defense_builds_the_tower"
scene = {build = "aitowerdep", check = "a", until = 40.0}
bench = "aitowerdep: stop frame 451, the 350 ring 1 from s29"
proves = "simai base defense tower: the DEFENSE Deposit pays the build state turret"
expect = "abs(vals(rows)[-1][3] - 451) <= 7"

[[reading]]
id = "a_budget_state_line_uses_the_budget_its_state_names"
scene = {build = "aibsprod", check = "h", until = 150.0}
bench = """\
aibsprod h: the personality declares DEFENSE 50 % but its BudgetState line names ProductionOnlyBudget (DEFENSE 0 \
%): 塔在基地 0 throughout with 20000 at the wake, the money only grows by the miner trips"""
proves = "simai budget states: a BudgetState line uses the budget its State names"
expect = "all(r['塔在基地'] == 0 for r in rows) and rows[-1]['AI钱'] > rows[15]['AI钱']"

[[reading]]
id = "the_heavier_budget_state_runs_alone_though_listed_second"
scene = {build = "aibsmax", check = "i", until = 150.0}
bench = "aibsmax: DEFENSE 100 % at weight 0.4 first, PRODUCTION 100 % at 0.6: no turret with 20000"
proves = "simai budget states: only the heaviest budget state runs, though listed second"
expect = "all(r['塔在基地'] == 0 for r in rows)"

[[reading]]
id = "a_tie_between_budget_states_goes_to_the_earlier_line"
scene = {build = "aibstie", check = "i", until = 150.0}
bench = "aibstie: both weigh 0.5, DEFENSE first: turrets are built"
