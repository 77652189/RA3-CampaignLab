[[reading]]
id = "when_every_budget_state_weighs_0_the_first_line_runs"
scene = {build = "aibszero", check = "i", until = 150.0}
bench = "aibszero: no turret before s50, then every weight is 0 and the first line (DEFENSE) runs: turrets"
proves = "simai budget states: when every state weighs 0 the first line runs"
expect = "all(r['塔在基地'] == 0 for r in rows[:50]) and max(r['塔在基地'] for r in rows) >= 1"

[[reading]]
id = "the_retail_budgets_switch_to_defense_while_the_raid_is_near_and_back_after"
scene = {build = "aibsback", check = "r4", until = 125.0}
bench = """\
aibsback (r4, PASS 11-14): Coop (DEFENSE 5 %) no turret to s48; the raid s29-s57 -> Defense (20 %): one turret \
from s49; raid gone, +5000 at s73 -> Coop: no second to s128 (simulator: turret from s52)"""
proves = "simai budget states: retail budgets switch to Defense while the raid is near and back after"
let = {raid = "[i for i, r in enumerate(rows) if r['敌在'] > 0]", tower = "first('塔在基地')"}
expect = ["raid and raid[0] <= tower <= raid[-1]", "max(r['塔在基地'] for r in rows) == 1"]
