# Bench readings of checks/engine_cosmetic_e.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# E211: AimWeapon / ConvergingLaserState, the retail XML against the module taken out. On / Off = target health % x
# 1000 + frames from the order to its first loss. Each build three ways: e as written, s the arms trade places, o the
# control's objects made first.

[[reading]]
id = "the_athenas_converging_lasers_only_draw"
scene = {build = "engine_convlaser_e", check = "a", until = 34, shot_clock = true}
bench = """\
CampConvLsrEA_mcp_1124_022146 and a rerun: 230 58041 57041 15; CampConvLsrSA (arms swapped): 58041 57041 15; \
CampConvLsrOA (the control made first): 57041 58041 15 -- the 1 % follows which arm was made first, not the module"""
proves = """ConvergingLaserState (four beams, no SweepWeapon in retail) changes neither the Athena's first loss (41 frames) \
nor its damage; FIRING_OR_PREATTACK_A, its trigger, is on in both arms (gate 15). The simulator's Athena itself is \
off (43033: 33 frames, 43 % left -- the OCL strike's, C's engine_ocl)"""
expect = ["counter('E211Frame') == 230", "counter('E211On') % 1000 == counter('E211Off') % 1000",
          "abs(counter('E211On') // 1000 - counter('E211Off') // 1000) <= 1", "counter('E211Gate') & 12 == 12"]

[[reading]]
id = "aimweapon_holds_the_javelins_first_hit_a_frame"
scene = {build = "engine_aimweapon_e", check = "a", until = 20, shot_clock = true}
bench = """\
CampAimWpnEA_mcp_1124_022305 and a rerun: 120 62012 62011 13; CampAimWpnSA (arms swapped) and CampAimWpnOA (the \
control made first): 62012 62011 13 each -- with the module the Twinblade's first loss is one frame later, wherever \
and whenever the arm is made; at f120 both 62 %. Gate 13: AIM_HIGH on the module's arm only"""
proves = "AimWeapon is not presentation only: it holds a Javelin's first shot at a high target one script frame"
expect = ["counter('E211Frame') == 120", "counter('E211On') // 1000 == counter('E211Off') // 1000",
          "counter('E211On') % 1000 == counter('E211Off') % 1000 + 1", "counter('E211Gate') & 12 == 12"]
mismatch = """sim 45003 45003: no AimWeapon, and the Javelin on a Twinblade is off as a whole (first loss 3 frames for \
the bench's 11, 45 % left at f120 for 62 %: C's launcher / missile flight). What the frame waits for (aim pitch, \
AimHighThreshold 0.4) is not read: not fitted"""
