    "all(r['甲被我方打'] == 0 and r['乙被我方打'] == 0 for t, r in chg if t >= 7) and chg[-1][1]['甲被我方打'] == 0 and chg[-1][1]['乙被我方打'] == 0",
    "all(55 <= rows[-1][k] <= 75 for k in ('甲血量', '乙血量'))",
]
