[[reading]]
id = "attacked_by_player_holds_while_the_attacker_stands_as_the_bench"
scene = {build = "engine_attack", check = "gone", until = 17}
bench = """\
gone: NAMED_ATTACKED_BY_PLAYER holds while the last unit that hit the target stands (between its shots too) and is \
false the frame it is deleted (A) or killed (B) at 6 s, the targets alive, about a third of their health gone by then \
