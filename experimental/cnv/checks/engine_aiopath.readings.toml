bench = "bench 2026-11-09: aiopath1 兵营 s19 then 电厂 s29 (Standard); aiopathr the same, Island listed first; aiopathi 电厂 s19, 兵营 never (the probe's Island line)"
proves = "simai Brain.path_to_target: with a tester that has no locomotor the heuristic says a way, PathExists=true holds whichever is listed first; the probe's personality takes"
expect = "first(picked) is not None and (first(other) is None or first(picked) < first(other))"
