# Bench readings of checks/engine_wayatk.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# Bench 2026-11-10 (counters 敌血, 近敌, 段1): a Guardian on the path A -> B -> C, an enemy Guardian (NO_ATTACK) 150
# beside the A -> B leg. The bench's seconds run 1-2 s ahead of the mission's timers: the simulator's readings are
# asserted at most 2 s later. In a reading of several scenes the row index is the mission second (one row a second
# from 0).

[[reading]]
id = "wayatk_a_plain_path_walker_fires_on_the_way_and_does_not_stop"
scene = {build = "engine_wayatk", check = "plain", until = 51}
bench = "plain (NAMED_FOLLOW_WAYPOINTS): 段1 1 s3, 2 s7, 3 s10, two hits on the way (敌血 73 at the end) (bench 2026-11-10)"
proves = "sim order_follow with fire: a plain path walker fires at the enemy beside its way and does not stop for it"
let = {chg = "[(t, r) for i, (t, r) in enumerate(zip(times, rows)) if i == 0 or r != rows[i - 1]]", at = "lambda k, p: next((t for t, r in chg if p(r[k])), None)", hit = "lambda k, v, b: (lambda g: g is not None and b <= g <= b + 2)(at(k, lambda x: x == v))"}
expect = [
    "hit('段1', 1, 3) and hit('段1', 2, 7) and hit('段1', 3, 10)",
    "0 < rows[-1]['敌血'] < 100",
]

[[reading]]
id = "wayatk_an_attack_walker_stops_to_fight_and_goes_on_once_it_is_dead_atk"
scenes = {r = {build = "engine_wayatk", check = "atk", until = 51}, p = {build = "engine_wayatk", check = "plain", until = 51}}
bench = """\
atk (NAMED_ATTACK_FOLLOW_WAYPOINTS), second by second on the bench: first hit s4, a shot every 2 s (13.9 %) to 3 at s16 \
(the counter keeps a dead unit's last value), on to B at s21 -- 14 s after plain's. GAP (the fire model, not the path): \
the simulator's continuous fire (6.25 %/s from s6) kills at s21 and reaches B at s24; asserted: the first hit within \
LAG, B only after the kill, 10+ s after plain's (bench 2026-11-10)"""
proves = "sim attack_chase: an attack-follow walker stops to fight, goes on only once the enemy is dead, B 10+ s after the plain walker"
let = {at = "lambda rs, k, p: next((i for i, r in enumerate(rs) if p(r[k])), None)", hit = "at(r, '敌血', lambda v: v < 100)", dead = "at(r, '敌血', lambda v: v == 0)", at_b = "at(r, '段1', lambda v: v == 2)"}
expect = [
    "4 <= hit <= 6 and dead is not None and at_b is not None and at_b > dead",
    "at_b - at(p, '段1', lambda v: v == 2) >= 10",
]

