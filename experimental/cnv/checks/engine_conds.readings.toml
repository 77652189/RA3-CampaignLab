[[reading]]
id = "conds_sight_as_the_bench"
scene = {build = "engine_conds", check = "sight", until = 26}
bench = """sight, bench 11-13 `run_queue engine_conds:sight` (CampCondsSight, round 210): 视野 / 发现 / 海军 / 热点 s1-s2 4 13 88 1 | \
s3 4 12 88 1 | s4 4 13 88 1 | s5-s7 4 13 88 0 | s8 4 12 88 0 | s9 13 12 88 0 | s10-s12 13 15 88 0 | s13 5 14 88 0 | \
s14-s24 5 14 88 2 | s25 4 14 88 2"""
proves = """sim ENEMY_SIGHTED_BY_TEAM counts the member itself and a Guardian at 180, not at 230 (sight 200 centre to centre); \
TEAM_DISCOVERED off while the member moves; the Dreadnought (DEEP_WATER only) never for TEAM_INSIDE_AREA k 0, always for \
k 7; MISSION_HOT_SPOT_ACTIVE only the name as written, only SET_..._ACTIVENESS -- not VISIBILITY, LINK, a name the map \
lacks; settable after its linked unit died. 视野 compared until the kill: the bench's wreck is seen ~11 s, the \
simulator's Guardian lies 0 s."""
let = {S = "list(zip(times, vals(rows)))[1:]", held = "lambda xs: [k for k, g in __import__('itertools').groupby(xs) if len(list(g)) >= 2]", dedup = "lambda xs: [k for j, k in enumerate(xs) if j == 0 or xs[j - 1] != k]", column = "lambda col, before=None: dedup(held([v[col] for t, v in S if before is None or t < before]))"}
expect = [
    "column(0, 14.0) == [4, 13]",
    "column(1) == [13, 12, 15, 14]",
    "column(2) == [88]",
    "column(3) == [1, 0, 2]",
]
