# Bench readings of checks/engine_conds.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# Round 208: the retail-campaign conditions, batch 1. The bench's clock runs a second or two ahead of the simulator's
# here (fire, kills, the scripted seconds), so the readings compare the order of the states each held for two samples
# or more (one sample: the frame a kill lands in), not the seconds. A scene's until is the old test's seconds + 1.
# held(xs): the values held two samples or more in a row; column(col, before): one counter's held values, repeats
# merged (the row of second 0 dropped, as the old helpers did).

[[reading]]
id = "conds_team_as_the_bench"
scene = {build = "engine_conds", check = "team", until = 32}
bench = """team, bench 11-13 `run_queue engine_conds:team` (CampCondsTeam, a32ba54b + the 128 bits): 队形 / 状态 s1 4 13 | s2 12 13 | \
s3-s6 12 15 | s7-s8 5 15 | s9-s10 5 75 | s11-s21 7 75 | s22-s31 128 74; 离开 1, 建队帧 1"""
proves = """sim TEAM_CREATED one frame after the reinforcement is made, a map team never; a reinforcement team TEAM_KILLed never \
reads destroyed, a map team does; PARTIALLY with k 1 / 3 / 7 holds for no Guardian; ALL_HAS on an emptied team. The \
bench's s1 / s2 states hold one sample each: dropped by the same rule."""
let = {S = "list(zip(times, vals(rows)))[1:]", held = "lambda xs: [k for k, g in __import__('itertools').groupby(xs) if len(list(g)) >= 2]"}
expect = [
    "held([tuple(v[:2]) for t, v in S]) == [(12, 15), (5, 15), (5, 75), (7, 75), (128, 74)]",
    "vals(rows)[-1][2:] == [1, 1]",
]

