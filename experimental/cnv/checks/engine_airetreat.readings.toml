# Bench readings of checks/engine_airetreat.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# The team state: retreat and EngagePassiveTargets (bench 2026-11-08 / 11-10; l4_micro_retreat.md, l4_micro_engage.md
# in the private notes). The simulator's team leaves ~8 s later than the bench's (s18 / s10): compared from the leave.
# Moved from tests/test_simai.py (T3 line B); rows[i] is the old _switch_run's rows[i] (same run, checked row by row).

[[reading]]
id = "outgunned_team_walks_home_alive_and_goes_again"
scene = {build = "airet", check = "a", until = 85.0}
bench = """\
airet: out s10-s12, 到远厂 2 @ s15, back home 4 @ s26 (步兵数 4 all along), out again s42, home again s54 \
(16 s out, nobody lost)"""
proves = "simai team retreat: an outgunned team walks home alive and goes again"
let = {out = "first('步兵在家', lambda v: v == 0)", back = "first('步兵在家', lambda v: v == 4, rows[out:]) + out", again = "first('步兵在家', lambda v: v == 0, rows[back:]) + back"}
expect = ["any(r['到远厂'] >= 1 for r in rows[out:back])", "back - out <= 16 and rows[back]['步兵数'] == 4",
          "any(r['到远厂'] >= 1 for r in rows[again:])"]

[[reading]]
id = "outgunned_team_home_stay_and_losses_match_the_bench"
scene = {build = "airet", check = "a", until = 85.0}
bench = """\
airet / airett (CampAIRetTA 1114_175624): 16.2 s home before going again (back f420, out again f663) and 4 alive \
to f1314 = s87.6 (wall s26 / s42 / s85). After a retreat the \
four stop at four spots round the yard (3790:3330 3850:3330 3930:3390 3830:3470) and trips 2-3 leave from there \
unformed, ~220 deep"""
proves = "simai team retreat: how long the team stays home, and that nobody is lost on the later trips"
let = {out = "first('步兵在家', lambda v: v == 0)", back = "first('步兵在家', lambda v: v == 4, rows[out:]) + out", again = "first('步兵在家', lambda v: v < 4, rows[back:]) + back"}
expect = "14 <= again - back <= 18 and all(r['步兵数'] == 4 for r in rows)"

[[reading]]
id = "disband_after_retreat_team_size_ends_the_tactic_as_on_the_bench"
scene = {build = "airetf", check = "a", until = 85.0}
each = [{build = "airetf", again = true}, {build = "airetfd", again = false}]
bench = """\
2026-11-10 (the state on a flag, off 8 s after the wake): airetf (size 0) home 4 @ s31-s48, out again s49; \
airetfd (999) home 4 from s31 to s85 -- the retreat's end ended the tactic"""
proves = "simai team retreat: DisbandAfterRetreatTeamSize ends the tactic when the team is that small"
let = {out = "first('步兵在家', lambda v: v == 0)", back = "first('步兵在家', lambda v: v == 4, rows[out:]) + out"}
expect = "any(r['步兵在家'] < 4 for r in rows[back:]) == again"

[[reading]]
id = "no_retreat_at_power_advantage_zero"
scene = {build = "airet0", check = "a", until = 85.0}
bench = "airet0: 到远厂 4 s17-s18, 步兵数 3 @ s19 ... 0 from s25; nobody home again"
proves = "simai team retreat: at power advantage 0 the team does not retreat"
let = {out = "first('步兵在家', lambda v: v == 0)"}
expect = "all(r['步兵在家'] == 0 for r in rows[out:]) and rows[-1]['步兵数'] == 0"

[[reading]]
id = "engage_passive_on_hits_the_side_plant_first"
scene = {build = "aipas1", check = "a", until = 60.0}
bench = "aipas1: 旁厂血量 94 @ s11 (1 s after the wake), 3 @ s25; nobody at the far plant to s85"
proves = "simai team state: EngagePassiveTargets on -- the team hits the side plant on its way first"
let = {hit = "first('旁厂血量', lambda v: v < 100)"}
expect = "all(r['到远厂'] == 0 for r in rows[:hit + 10])"

[[reading]]
id = "engage_passive_off_goes_straight_to_the_far_plant"
scene = {build = "aipas0", check = "a", until = 60.0}
bench = "aipas0: 到远厂 2 @ s15, 4 s17-s34; the side plant at 100 until s35, then RAMPAGE hurts it (97 @ s36)"
proves = "simai team state: EngagePassiveTargets off -- straight to the far plant, the side one only after"
let = {far = "first('到远厂')", hit = "first('旁厂血量', lambda v: v < 100)"}
expect = "far is not None and hit is not None and far < hit"
