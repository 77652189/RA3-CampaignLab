# Bench readings of checks/engine_aiprio.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# SKIRMISH_AI_SET_ENEMY_PLAYER_PRIORITY (bench 2026-11-10): the near plant is Soviet_4's, the far one the player's.
# Moved from tests/test_simai.py (T3 line B); rows[i] is the old _switch_run's rows[i] (same run, checked row by row).

[[reading]]
id = "one_priority_puts_the_top_scored_enemy_first"
scene = {build = "aiprio1", check = "a", until = 70.0}
bench = "aiprio1 (Soviet_4 30, Player_1 10, no SET_ALL): 到近厂 2 @ s14, 4 s15-s21, never 到远厂"
proves = "simai enemy priority: the top-scored enemy is the target first"
let = {near = "first('到近厂')"}
expect = "near is not None and abs(near - 14) <= 2 and first('到远厂') is None"

[[reading]]
id = "one_priority_alone_leaves_the_unnamed_enemies_out"
scene = {build = "aipriorm", check = "a", until = 70.0}
bench = "aipriorm (only Soviet_4 0 at the wake): 步兵在家 4 s1-s75 -- the player was not in the table either"
proves = "simai enemy priority: a table with one entry leaves the enemies it does not name out"
expect = "all(r['步兵在家'] == 4 and r['到近厂'] == 0 and r['到远厂'] == 0 for r in rows)"

[[reading]]
id = "two_enemies_in_one_tier_go_for_the_far_plant_first"
scene = {build = "aipriodef", check = "a", until = 70.0}
bench = "aipriodef (SET_ALL 20): 到远厂 2 @ s25, 4 s26-s44; 到近厂 only from s55 (RAMPAGE after the plant fell)"
proves = "simai enemy priority: two enemies in one tier -- which the game takes first"
let = {far = "first('到远厂')", near = "first('到近厂')"}
expect = "far is not None and (near is None or far < near)"
mismatch = """\
bench aipriodef: two enemies in one tier, the game went for the farther plant (the player's, s25); the simulator \
takes the nearest (Soviet_4's, s14) -- why NOT READ"""
