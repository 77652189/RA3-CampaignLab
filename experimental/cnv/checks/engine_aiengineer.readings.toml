# Bench readings of checks/engine_aiengineer.py (format: experimental/cnv/readings.py).

[[reading]]
id = "engineer_replays_observed_no_capture_without_claiming_recruitment"
scene = {build = "aieng", check = "a", until = 63}
each = [{build = "aieng"}, {build = "aiengctl"}]
bench = "Engineer s1-63 and SimpleAttack control s1-74 both read owner 0, near 0, live 1, target HP 100 (retail 2026-11-12)."
proves = "simai Engineer / SimpleAttack: replay an unchanged target and one live engineer outside its approach square"
let = {observed = "[r for t, r in zip(times, rows) if 1 <= t <= 62]"}
expect = [
    "observed",
    "{tuple(r[k] for k in ('目标归属', '到目标量', '工程师量', '目标血量')) for r in observed} == {(0, 0, 1, 100)}",
]
