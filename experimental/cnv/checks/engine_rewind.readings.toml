# Bench readings of checks/engine_rewind.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# Engine line D round 45, A8's Liberty rewind.

[[reading]]
id = "rewind_auto_as_the_bench"
scene = {build = "rewind_imm", check = "auto", until = 26}
bench = """\
CampRwIAuto_mcp_1111_162156 at s25: 血 1 回溯 1 原处 1 (the fatal blow rewound it home at full health, the one in the \
cooldown left it at 1 hp: NAMED_KILL does not kill an ImmortalBody)"""
proves = "sim time belt + ImmortalBody: the fatal blow is rewound home, a blow in the cooldown leaves 1 hp (NAMED_KILL does not kill an ImmortalBody)"
expect = "vals(rows)[-1] == [1, 1, 1]"
mismatch = "sim 血 0 回溯 1 原处 0 at s25 (no belt and no immortal body: the carrier dies at s19); bench 1 1 1"

[[reading]]
id = "rewind_swap_as_the_bench"
scene = {build = "rewind_swap", check = "swap", until = 21}
bench = """\
CampRwSWreck_mcp_1111_173301 (round 49: the carrier stays on as the new one): from s9 血 46-47 归我 1 残骸 1 -- its \
wreck button pressed, topped up to ~50 % (NAMED_SET_MAX_HEALTH full, NAMED_DAMAGE 3000), ours for good; the simulator \
reads 50 1 1"""
proves = "sim rewind swap: the wreck button's carrier stays ours at about half health"
let = {hp = "rows[-1]['血']", ours = "rows[-1]['归我']", wrecks = "rows[-1]['残骸']"}
expect = "(ours, wrecks) == (1, 1) and 45 <= hp <= 50"

[[reading]]
id = "rewind_wreck_as_the_bench"
scene = {build = "rewind_swap", check = "wreck", until = 13}
bench = "CampRwSWreck_mcp_1111_173301: 残骸数 1 at s9 (the OCL button dropped a wreck, LifetimeUpdate 1.5 s, 0 from s10)"
proves = "sim special powers: the wreck button's OCL drops a wreck for 1.5 s"
expect = "any(r['残骸数'] >= 1 for r in rows)"
mismatch = "sim 残骸数 0 all 13 s (it logs special powers without effect); bench 1 at s9"
