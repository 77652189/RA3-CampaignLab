# Bench readings of checks/engine_statusbits.py (format: experimental/cnv/readings.py; runner: tests/conformance).

[[reading]]
id = "test_status_bits_upgrade_the_heroic_grant_sets_weapon_upgraded_and_a_removal_clears_it"
scene = {build = "engine_statusbits", check = "b", until = 20}
bench = "bench engine_statusbits b s7-s41: 1 1 0 11 (s1-s6: 1 0 1 11)"
proves = "StatusBitsUpgrade: the HEROIC grant sets WEAPON_UPGRADED_01 / _02 and a removal takes it back"
expect = [
  "[rows[-1][k] for k in ('英雄位', '晚位', '去位', '兵守位')] == [1, 1, 0, 11]",
  "(rows[3]['晚位'], rows[3]['去位']) == (0, 1)",
]

[[reading]]
id = "kingbits_the_three_weapon_bits_change_nothing_on_the_mecha_king"
scene = {build = "engine_kingbits", check = "k", until = 20}
bench = "CampKbitsK_mcp_1122_151844: 设血 平血 位 s1-s4 75 75 111 | s4-s6 50 50 111 | s7 50 25 | s7-s9 25 25 | s10 25 0 | s10-s21 0 0 111"
proves = "WEAPON_UPGRADED_01 / 02 / 03 set on a JapanMechaKing read back (111) and its cuts are the same as an unset King's (no katana slot names a bit); a campaign unit outside the unit table reads its own weapons (units.fight)"
item = ["脚本动作 UNIT_CHANGE_OBJECT_STATUS:WEAPON_UPGRADED_01", "脚本动作 UNIT_CHANGE_OBJECT_STATUS:WEAPON_UPGRADED_02",
        "脚本动作 UNIT_CHANGE_OBJECT_STATUS:WEAPON_UPGRADED_03"]
expect = [
  "all(r['位'] == 111 for r in rows)",
  "sorted({r['设血'] for r in rows}) == sorted({r['平血'] for r in rows}) and len({r['设血'] for r in rows}) >= 4",
  "rows[-1]['设血'] == rows[-1]['平血'] == 0",
]

