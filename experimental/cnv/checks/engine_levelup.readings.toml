# Bench readings of checks/engine_levelup.py (format: experimental/cnv/readings.py; runner: tests/conformance).

[[reading]]
id = "test_levelup_elite_health_persists_at_heroic_and_freezes_before_healing"
scene = {build = "engine_levelhealth", check = "a", until = 12}
bench = "engine_levelhealth a: script-frame readings 80/80/84/84 after 100 damage"
proves = "LevelUpUpgrade health: elite health persists at heroic and freezes before healing"
expect = [
  "list(rows[-1].values()) == [80, 80, 84, 84]",
  "all(list(r.values()) == [80, 80, 84, 84] for r, t in zip(rows, times) if t >= 8)",
]

[[reading]]
id = "test_levelup_injured_elite_promotion_preserves_fraction_and_scales_current_health"
scene = {build = "engine_levelhealth", check = "b", until = 16}
bench = "engine_levelhealth b: 50/80/50/20, then 30/64/34/4 after 100 damage"
proves = "LevelUpUpgrade health: an injured elite's promotion preserves the fraction and scales current health"
expect = [
  "all(list(r.values()) == [50, 80, 50, 20] for r, t in zip(rows, times) if 9 <= t <= 10)",
  "all(list(r.values()) == [30, 64, 34, 4] for r, t in zip(rows, times) if t >= 14)",
]

[[reading]]
id = "test_levelup_creation_grants_reach_heroic_only_after_three_distinct_triggers"
scene = {build = "engine_levelup", check = "a", until = 12}
bench = "Bench 11-10 engine_levelup a: 0/0/1/0 early, 0/1/1/0 after late grants"
proves = "LevelUpUpgrade creation grants: heroic only after three distinct triggers (one CreationVeterancy_HEROIC adds one rank, repeated held grants none)"
expect = [
  "any(list(r.values()) == [0, 0, 1, 0] for r in rows)",
  "list(rows[-1].values()) == [0, 1, 1, 0]",
]

[[reading]]
id = "test_levelup_creation_remove_keeps_rank_and_regrant_can_trigger_twice"
scene = {build = "engine_levelup", check = "b", until = 29}
bench = "engine_levelup b: removal keeps heroic; two veteran regrants reach heroic (0/0/0/1, 0/0/1/1, then 0/1/1/1)"
proves = "LevelUpUpgrade creation: removal keeps the rank, two veteran regrants reach heroic, the one-grant lane only on the second"
expect = [
  "all(win(a, b, k) == [v] * (b - a + 1) for a, b, vs in ((2, 4, (0, 0, 0, 1)), (8, 10, (0, 0, 0, 1)), (14, 16, (0, 0, 1, 1)), (20, 22, (0, 0, 1, 1)), (26, 28, (0, 1, 1, 1))) for k, v in zip(('base heroic', 'high heroic', 'order heroic', 'removed heroic'), vs))",
]

[[reading]]
id = "test_levelup_elite_and_heroic_creation_regrants_each_need_two_reactivations"
scene = {build = "engine_levelup", check = "c", until = 29}
bench = "engine_levelup c: 0/0/0/1 through first regrant, then 0/1/1/1"
proves = "LevelUpUpgrade creation: the elite and heroic triggers are isolated, each needs two reactivations"
expect = [
  "all(win(a, b, k) == [v] * (b - a + 1) for a, b, vs in ((2, 4, (0, 0, 0, 1)), (8, 10, (0, 0, 0, 1)), (14, 16, (0, 0, 0, 1)), (20, 22, (0, 0, 0, 1)), (26, 28, (0, 1, 1, 1))) for k, v in zip(('base heroic', 'high heroic', 'order heroic', 'removed heroic'), vs))",
]
