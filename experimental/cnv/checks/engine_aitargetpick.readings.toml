[[reading]]
id = "forbidden_airborne_skips_the_kirov_as_on_the_bench"
item = "AI 目标/AITargetingHeuristic.ForbiddenObjectStatus"
scene = {build = "aitpairf", check = "a", until = 41.0}
each = [{build = "aitpairn", got = [3, 0]}, {build = "aitpairf", got = [0, 3]}]
bench = """\
aitpairn / aitpairf (B 11-23, CampAITPAirNA_mcp_1123_230526 / AirFA_230534; 到电厂 到坦克 到飞艇 在家): a player Kirov \
(airborne, HOLD_FIRE) nearer the Guardians than the tank. Empty ForbiddenObjectStatus: 到飞艇 3 s14-s16, 到坦克 0; \
retail ClosestSurfaceUnitHeuristic's "AIRBORNE_TARGET SUBMERGED": 到坦克 1 @ s13, 4 s16-s29, 到飞艇 0 throughout"""
proves = "simai targets: ForbiddenObjectStatus AIRBORNE_TARGET skips a thing in the air (the target view's status_now)"
expect = "[min(max(x['到飞艇'] for x in rows[:20]), 3), min(max(x['到坦克'] for x in rows[:20]), 3)] == got"

[[reading]]
id = "after_an_unhittable_kirov_rampage_takes_the_plant_as_on_the_bench"
scene = {build = "aitpairn", check = "a", until = 41.0}
bench = "aitpairn: the Guardians (no anti-air) leave the Kirov s17, 到电厂 4 from s21 to s55 -- RAMPAGE's nearest structure"
