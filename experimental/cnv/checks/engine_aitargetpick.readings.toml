# Bench readings of checks/engine_aitargetpick.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# Target pick, team priority, EndBehavior (bench 2026-11-09, B rounds 80-87; the readings in the check's docstring).
# Moved from tests/test_simai.py (T3 line B); rows[i] is the old _switch_run's rows[i] (same run, checked row by row).

[[reading]]
id = "target_pick_as_on_the_bench"
scene = {build = "aitpnear", check = "a", until = 41.0}
each = [{build = "aitpnear", got = [4, 0, 0, 0]}, {build = "aitpvk", got = [0, 4, 0, 0]},
        {build = "aitpfk", got = [0, 4, 0, 0]}, {build = "aitpunit", got = [0, 0, 4, 0]},
        {build = "aitpphi", got = [0, 4, 0, 0]}, {build = "aitpplo", got = [4, 0, 0, 0]},
        {build = "aitpmt1", got = [4, 0, 0, 4]}, {build = "aitpmt2", got = [4, 4, 0, 0]}]
bench = """\
(到电厂, 到兵营, 到坦克 at most, 在家) at s40: VitalKindOf / ForbiddenKindOf / EnemyUnit pick the target, the higher \
TargetHeuristic Priority is tried first, MaxTargets 2 sends a second team at the next unique target (the tank's \
count may fall as it shoots back)"""
proves = "simai targets: the TargetHeuristic kinds, Priority and MaxTargets pick the target"
let = {r = "rows[39]"}
expect = "[r['到电厂'], r['到兵营'], max(x['到坦克'] for x in rows), r['在家']] == got"

[[reading]]
id = "team_priority_higher_plant_team_as_on_the_bench"
scene = {build = "aitpprp", check = "a", until = 41.0}
bench = "aitpprp (B round 82): the plant's team HIGH over the barracks' STANDARD -> 到电厂 4 s15-s56, 到兵营 0"
proves = "simai teams: the higher team priority takes the men"
expect = "(rows[39]['到电厂'], rows[39]['到兵营'], rows[39]['在家']) == (4, 0, 0)"

[[reading]]
id = "team_priority_as_on_the_bench"
scene = {build = "aitpprh", check = "a", until = 41.0}
each = [{build = "aitpprh"}, {build = "aitpprl"}]
bench = """\
aitpprh (P STANDARD / B HIGH) / aitpprl (P LOW / B STANDARD): 在家 4 to s16, 到兵营 4 s23-s55, 到电厂 0 throughout \
(AI tactic teams are recruitable, l4_recruit.md: the higher team takes them)"""
proves = "simai teams: the higher team priority takes the men (recruit)"
expect = "(rows[39]['到电厂'], rows[39]['到兵营'], rows[39]['在家']) == (0, 4, 0)"

[[reading]]
id = "team_priority_as_on_the_bench_on_a_tie"
scene = {build = "aitpprs", check = "a", until = 41.0}
bench = "aitpprs (P STANDARD / B STANDARD): 到兵营 2 @ s21, 4 s23-s55; 到电厂 0 throughout -- the barracks' state on a tie"
proves = "simai teams: on a team priority tie the men go to the barracks' state"
expect = "(rows[39]['到电厂'], rows[39]['到兵营'], rows[39]['在家']) == (0, 4, 0)"
mismatch = """\
simai sends the plant's team (target first, s13) all 4 (到电厂 4 at s40); the bench gives them to the barracks' \
state on a tie -- handoff-b 84"""

[[reading]]
