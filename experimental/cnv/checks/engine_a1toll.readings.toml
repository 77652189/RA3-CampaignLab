[[reading]]
id = "r_a_scripted_attack_leaves_a_simple_object_prop_alone"
scenes = {r = {build = "engine_a1tollr", check = "r", until = 46}, g = {build = "engine_a1tollg", check = "g", until = 46}, h = {build = "engine_a1tollh", check = "h", until = 46}, l = {build = "engine_a1tolll", check = "l", until = 46}}
