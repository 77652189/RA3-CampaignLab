[[reading]]
id = "x_a_vehicle_drives_through_every_crushable_and_toppling_prop"
scene = {build = "engine_a1tollx", check = "x", until = 20}
bench = "CampA1TollXX (11-26 E266): 穿心 11111, 车存 33333 -- the zero truck straight through w's five walls (147-152), nothing crushed"
