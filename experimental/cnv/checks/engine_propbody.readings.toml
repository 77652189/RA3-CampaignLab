# Bench readings of checks/engine_propbody.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# PropBody, bench 2026-11-10 engine_propbody a / b / c: a street segment, a tree and a lantern, neutral. a: NAMED_DAMAGE
# 10 -- health percent 0 throughout, all three stay. b: NAMED_KILL -- the street stays, tree / lantern gone 61 / 121
# frames after (ToppleUpdate delay), never dying. c: a Hammer told to attack each never fires.

[[reading]]
id = "test_prop_body_no_health_a_kill_leaves_the_street_and_topples_the_tree_and_lantern_at_the_bench_frames"
scenes = {a = {build = "engine_propbody", check = "a", until = 21}, b = {build = "engine_propbody_b", check = "b", until = 21}, c = {build = "engine_propbody_c", check = "c", until = 21}}
bench = "bench 血1..3: 0 0 0 throughout, 存 333333333 (all three there); b: 332 332 61 121; c: 332 x 4 (none shot, none dying)"
proves = "PropBody: no health on damage, a kill leaves the street and topples the tree / lantern at the bench frames, a Hammer never fires at props"
let = {left = "a[-1]['存']"}
expect = [
  "all(r['血1'] == 0 and r['血2'] == 0 and r['血3'] == 0 for r in a)",
  "left == (left % 1000) * 1001001",
  "b[-1]['行1'] == b[-1]['帧数'] and (b[-1]['行2'], b[-1]['行3']) == (61, 121)",
  "[c[-1]['行1'], c[-1]['行2'], c[-1]['行3']] == [c[-1]['帧数']] * 3",
]
