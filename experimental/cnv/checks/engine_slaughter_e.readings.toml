[[reading]]
id = "the_placed_carriers_target_dies_before_the_paired_order"
scene = {build = "engine_slaughter_v", check = "v", until = 72}
bench = "CampSlaughterVV_mcp_1127_070427: placed target 100% through f203, 50% at f212 and f218, 0% from f227. ua: records damage at f210 and f218. Both typed aircraft peaks stay 0; built target stays 100%; yard/reference/order gate stays 0 through f1050."
proves = "the placed arm deals damage without a yard-built carrier in this setup. The built arm and the typed drone count yield no production or sortie comparison. See work/re/e290_slaughter_h4.md."
