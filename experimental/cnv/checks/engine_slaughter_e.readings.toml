[[reading]]
id = "the_athena_does_not_turn_to_the_ordered_plant"
mismatch = "sim: the Athena fires at its plant (雅典娜 > 0); bench 0, its turret never turned -- unexplained on the bench (E251 hypothesis table), the sim is not bent to it"
scene = {build = "engine_slaughter_s", check = "t", until = 132}
bench = "CampSlaughterST_mcp_1126_001943: f600, 出机位 0, 命中位 0, 雅典娜 0 (its plant unhealed: never attacked by p1, never under 100 %); frame s23.8 (f386, 86 after the order) shows the Athena 350 south of the plant still facing away, the turret not turned"
proves = """the control fails on its own: an OCL-only weapon (Athena, carrier) takes no NAMED_ATTACK_NAMED at a plant on this \
map, while engine_shield's V4s take the same NO_ATTACK-clear-then-order and hit; the carrier runs (e p q r s) measure \
