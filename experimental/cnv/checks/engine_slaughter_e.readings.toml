# Bench readings of checks/engine_slaughter_e.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# E170 (work/re/e170_slaughter.md): the retail Aircraft Carrier and a copy without SlaughterHordeContain, each told to
# attack a held target; counters frozen at script frames 180 (攻击期数量) and 600 (返航后数量).

[[reading]]
id = "the_carriers_show_no_drone_in_either_count"
scene = {build = "engine_slaughter_e", check = "a", until = 41}
bench = "E170 a and b (b counts AIRCRAFT in place of DRONE): both runs 完成帧 600, 宿主存活 11, 攻击期数量 0, 返航后数量 0"
proves = "a negative baseline only: the counts the map encodes see no drone at f180 or f600 with or without the module -- not evidence that sortie, return or the container's consumption is modelled (inventory TODO stays)"
expect = ["counter('E170Frame') == 600", "counter('E170Hosts') == 11",
          "all(r['攻击期数量'] == 0 and r['返航后数量'] == 0 for r in rows)"]

[[reading]]
id = "the_carriers_show_no_aircraft_either"
scene = {build = "engine_slaughter_e", check = "b", until = 41}
bench = "the same as a, counted as AIRCRAFT: 600 / 11 / 0 / 0"
proves = "a negative baseline only (as a)"
expect = ["counter('E170Frame') == 600", "counter('E170Hosts') == 11",
          "all(r['攻击期数量'] == 0 and r['返航后数量'] == 0 for r in rows)"]

[[reading]]
id = "neither_carrier_sends_a_drone_at_the_held_ship"
scene = {build = "engine_slaughter_p", check = "p", until = 41}
bench = "CampSlaughterPP_mcp_1123_221011: f600, OnLate 0, OffLate 0, gate 48 (hosts alive only: no drone hit the target, no p1 AIRCRAFT in either area f60-f240)"
proves = """a negative baseline (the third, with E170 a / b): the carrier told NAMED_ATTACK_NAMED at a held SovietAntiAirShip \
500 off launches nothing, so the container is never reached -- not evidence about SlaughterHordeContain (inventory TODO stays)"""
expect = ["counter('E170Frame') == 600", "counter('E170Gate') == 48",
          "all(r['原版晚段帧'] == 0 and r['删模块晚段帧'] == 0 for r in rows)"]

[[reading]]
id = "no_carrier_sends_a_drone_even_the_retail_one_at_a_plant"
scene = {build = "engine_slaughter_q", check = "q", until = 41}
bench = "CampSlaughterQQ_mcp_1123_223650: f600, 出机位 0, 命中位 0 (retail carrier at a ship, retail at a SovietPowerPlant ashore, the clone at the plant; told NAMED_ATTACK_NAMED at f300, the frames s18-s25 show the carrier still on the water, nothing on its deck or in the air)"
proves = """a negative baseline (the fourth): not the target (the weapon's RequiredAntiMask defaults to ANTI_GROUND ANTI_WATER \
ANTI_STRUCTURE and a plant ashore draws nothing either), not the clone (the retail carrier is as dark) -- the scripted \
attack order does not start this weapon; the container is never reached (inventory TODO stays)"""
expect = ["counter('E170Frame') == 600", "all(r['出机位'] == 0 and r['命中位'] == 0 for r in rows)"]

[[reading]]
id = "the_retail_carrier_sends_no_drone_even_by_hand"
scene = {build = "engine_slaughter_r", check = "r", until = 101}
bench = "CampSlaughterRR_mcp_1123_225828: the bench boxed the carrier (s26, its portrait up) and right-clicked the plant's dome (s40); f1500, gate 0, since-hit 0, late 0 to s123 -- the carrier never moves, nothing leaves its deck"
proves = """a negative baseline (the fifth): not the scripted order either -- a player's own attack order at a plant 350 off \
(inside the weapon's 200-1000) draws no sortie; the container is never reached (inventory TODO stays)"""
expect = ["counter('E170Frame') == 1500", "all(r['前置位'] == 0 and r['删后有机帧'] == 0 for r in rows)"]

[[reading]]
id = "no_carrier_lane_sends_a_drone_and_the_athena_control_is_dark_too"
