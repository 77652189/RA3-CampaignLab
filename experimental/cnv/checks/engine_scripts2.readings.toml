# Bench readings of checks/engine_scripts2.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# Inventory batch 1 (work/re/l2_scripts1.md): bench 11-09, CampScr2One / CampScr2All: counters A血 B血 比较数 类型数.
# A scene's until is the old test's seconds + 1 (the old bare Sim.run(u) read the row of second u last).

[[reading]]
id = "scripts2_a_relation_is_one_way_and_turns_back"
scene = {build = "engine_scripts2", check = "one", until = 25}
bench = "one: Soviet_1 neutral to Player_1 -- its Guardian holds fire (A血 100 to bench s8), shoots again from BACK_AT (10 s); a killed tank leaves the comparison's count at once, as the type counter (3 -> 2) (bench 11-09)"
proves = "sim Sim relations (PLAYER_RELATES_PLAYER one way, BACK_AT) and PLAYER_HAS_OBJECT_COMPARISON counting living objects"
let = {by = "dict(zip(times, vals(rows)))"}
expect = [
    "all(v[0] == 100 for s, v in by.items() if s <= 9)",
    "by[24][0] < 95",
    "all(v[2] == v[3] == 2 for s, v in by.items() if s >= 4)",
]

[[reading]]
id = "scripts2_all_players_in_a_relation_changes_nothing"
scene = {build = "engine_scripts2", check = "all", until = 25}
bench = "all: PLAYER_RELATES_PLAYER(Soviet_1, '<All Players>', Neutral) -- the Guardian shoots the player's MCV all along (bench A血 98 at s1, 80 at s25)"
proves = "sim Sim relations: '<All Players>' as the second player changes nothing"
let = {by = "dict(zip(times, vals(rows)))"}
expect = "by[24][0] < 95 and by[5][0] < 100"
