# Bench readings of checks/engine_spots.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# sim.HOLD_SPOTS: bench 2026-11-09 `cnv_check engine_spots same / late`.

[[reading]]
id = "spots_three_trucks_sent_alone_to_one_point_stand_apart_same"
scene = {build = "engine_spots", check = "same", until = 36}
bench = """\
Three trucks, each on a team of its own, sent to one point at once: the bench ends 4 2 1 (环k: nested squares 10 / 25 / \
45 / 80 round the point) -- the first on the point, the other two 10-80 off (bench 2026-11-09)"""
proves = "sim HOLD_SPOTS: trucks sent alone to one point do not pile up, the first holds the point, the others stand apart"
let = {ring = "vals(rows)[-1]"}
expect = "ring[0] == 4 and all(1 <= r <= 3 for r in ring[1:])"

[[reading]]
id = "spots_three_trucks_sent_alone_to_one_point_stand_apart_late"
scene = {build = "engine_spots", check = "late", until = 76}
bench = """\
Three trucks, each on a team of its own, sent to one point 20 s apart: the bench ends 4 2 1 (环k: nested squares 10 / 25 \
/ 45 / 80 round the point); the simulator 4 2 2 (truck 3 44.7 off, the bench's beyond 45) (bench 2026-11-09)"""
proves = "sim HOLD_SPOTS: trucks sent alone to one point 20 s apart stand apart too"
let = {ring = "vals(rows)[-1]"}
expect = "ring[0] == 4 and all(1 <= r <= 3 for r in ring[1:])"
