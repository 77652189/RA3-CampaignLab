proves = "simai micro UpdateTime: the first charge latches the measured frame for this update period"
expect = "{r['首冲帧'] for r in rows if r['首冲帧']} == {317}"
mismatch = "E102 D81 observers: retail first-charge latch fast 371 / slow 317, simulator fast 264 / slow 309. Low-health eligibility and preceding state updates remain unresolved."

[[reading]]
id = "micro_update_time_charge_and_survival"
scene = {build = "aimicupfast", check = "a", until = 56}
each = [{build = "aimicupfast"}, {build = "aimicupslow"}]
bench = "Both UpdateTime lanes latch a first charge with two alive; the probe checks production reached at least two."
proves = "simai micro UpdateTime: both periods still expose a first charge and the two live units"
