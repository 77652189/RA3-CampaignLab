# Bench readings of checks/engine_aigarrison.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# EnterGarrisons (bench 2026-11-09; counters 步兵在家 到远厂 步兵数 楼归AI, 步兵数 counts the ones inside too).

[[reading]]
id = "nobody_goes_in_where_the_bench_had_nobody"
scene = {build = "aigar0", check = "a", until = 60.0}
each = [{build = "aigar0"}, {build = "aigarfar"}]
bench = "aigar0 (EnterGarrisons off) / aigarfar (the house 450 south): 楼归AI 0 all along, the team dead by s28 / s30"
proves = "simai garrisons: with the switch off or the house beyond the pass's reach nobody of the team goes in"
expect = "all(r['楼归AI'] == 0 for r in rows)"

[[reading]]
id = "the_team_goes_into_the_house"
scene = {build = "aigar1", check = "a", until = 75.0}
bench = """\
aigar1: s17 0 4 4 0 | s18-s75 0 3 3 1 -- the house the AI's at s18, three alive to s75 (aigar0's die by s28): read \
as all three went in (alive at the end = inside)"""
proves = "simai garrisons: EnterGarrisons sends the team into the neutral house near its way, and they stay in"
expect = ["win(20, 74, '楼归AI') == [1] * 55", "rows[-1]['步兵数'] >= 3"]

[[reading]]
id = "one_of_the_four_dies_at_the_house_door"
scene = {build = "aigar1", check = "a", until = 75.0}
bench = "aigar1: 步兵数 4 to s17, 3 from s18 to s75 -- one dies about the door, three alive inside"
proves = "simai garrisons with the sim's fire: one of the four is shot on the way in"
expect = "rows[-1]['步兵数'] == 3"
mismatch = """\
sim 步兵数 4 at s75 (house the AI's from s19), bench 3: since state 2's per-member pick (tactics._assign, B round \
114) the men turn on the defenders on the way and take more fire (18 / 18 / 33 / 101 hp inside) but all four get \
in -- the sim's fire, not the garrison rule"""
