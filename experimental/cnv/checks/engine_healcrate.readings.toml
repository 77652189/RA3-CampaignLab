# Bench readings of checks/engine_healcrate.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# Includes the native right-click pickup. The simulator cannot replay that command yet.

[[reading]]
id = "no_mover_takes_a_crate_it_passes"
scene = {build = "engine_healcrate", check = "a", until = 18}
bench = "engine_healcrate:a, run_queue CampHealCrateA_mcp_1122_202401: 箱子位 / 满血位 / On 兵血 / Off 兵血 15 0 50 50 at s1-s18"
proves = """HealCrateCollide (negative): a neutral retail HealCrate stays and heals nobody when a script-moved unit of the \
human player (a Peacekeeper, a Guardian) or of s2 is sent through it -- not the module's effect (E146 sent them onto it: \
the same)"""
expect = "all(r['箱子位'] == 15 and r['满血位'] == 0 and r['On 兵血'] == 50 and r['Off 兵血'] == 50 for r in rows)"

[[reading]]
id = "the_movers_do_cross_the_crates"
scene = {build = "engine_healcrate", check = "b", until = 18}
bench = """engine_healcrate:b, run_queue CampHealCrateB_mcp_1122_202838: 箱子位 / 路过位 / On 兵血 / Off 兵血 15 0 50 50 to s3, 15 8 50 50 s3-s4, \
15 15 50 50 s4-s17"""
proves = """the movers of a stand within 12 of their crate's centre (the Veh tank's bit from s3, all four from s4) and still no \
crate goes: going round it is not why none is taken"""
expect = ["all(r['箱子位'] == 15 and r['On 兵血'] == 50 and r['Off 兵血'] == 50 for r in rows)",
          "rows[-1]['路过位'] == 15"]
mismatch = """sim 路过位 7 from s6 (the three men, ~2 s late; the Veh tank's coarse-tick steps jump the 24-wide square), \
bench 8 from s3, 15 from s4"""

[[reading]]
id = "a_player_ordered_mover_takes_no_crate_either"
scene = {build = "engine_healcrate", check = "c", until = 18}
bench = """engine_healcrate:c, run_queue CampHealCrateC_mcp_1123_070441: 箱子位 / 满血位 / On 兵血 / Off 兵血 15 0 50 50 at s1-s61; \
frames 7-8 the Peacekeeper boxed (its panel up) and right-clicked east, frame 8 on the crate, frame 37 at the click"""
proves = """HealCrateCollide (negative): the bench's own box select and right-click send On's Peacekeeper across its crate and \
the crate stays and heals nobody. The click targets ground beyond the crate (the sim moves nobody here: no clicks)"""
expect = "all(r['箱子位'] == 15 and r['满血位'] == 0 and r['On 兵血'] == 50 and r['Off 兵血'] == 50 for r in rows)"

[[reading]]
id = "the_retail_named_crate_is_not_taken_either"
scene = {build = "engine_healcrate_r", check = "a", until = 18}
bench = "engine_healcrate_r:a, run_queue CampHCRealA_mcp_1123_071522: 箱子位 / 满血位 / On 兵血 / Off 兵血 15 0 50 50 at s1-s17"
proves = """HealCrateCollide (negative): a with On, Foe and Veh placing the retail HealCrate by its own name (no clone, no new id) -- \
still none taken, none healed: the clone's id is not why (hypothesis 5)"""
expect = "all(r['箱子位'] == 15 and r['满血位'] == 0 and r['On 兵血'] == 50 and r['Off 兵血'] == 50 for r in rows)"

[[reading]]
id = "right_clicking_the_retail_heal_crate_takes_it"
scene = {build = "engine_healcrate_r", check = "b", until = 18}
bench = """CampHCRealB_mcp_1127_025831, counters (箱子位, 满血位, On 兵血, Off 兵血): \
s1–s25 15 0 50 50; s38–s61 14 1 100 50. Frame 7 shows the selected Peacekeeper and the crate at the click pixel; \
frame 8 shows the Peacekeeper at the crate after pickup."""
proves = """Direct right-click on the retail HealCrate: that crate disappears and the Peacekeeper and friendly Guardian \
70 units away reach full health. The friendly Guardian 180 units away, the opposing Guardian 70 units away and the \
uncommanded Peacekeeper in the Off lane stay below full health. Check a uses the same retail crate with script movement."""
expect = "[rows[0][k] for k in ('箱子位', '满血位', 'On 兵血', 'Off 兵血')] == [15, 0, 50, 50] and [rows[-1][k] for k in ('箱子位', '满血位', 'On 兵血', 'Off 兵血')] == [14, 1, 100, 50]"
mismatch = "The simulator executes no native click or crate-collect order here and stays at 15 0 50 50. Bench ends at 14 1 100 50. See work/re/handoff-e.md and E283."

[[reading]]
id = "neither_the_campaign_human_gate_nor_contact_nor_relationship_is_what_is_missing"
scene = {build = "engine_healcrate_h", check = "a", until = 18}
bench = "engine_healcrate_h:a, run_queue CampHCHypA_mcp_1126_011501: 箱子位 / 满血位 15 0 at s1-s17"
proves = """HealCrateCollide (negative, D191's table): a p1 Peacekeeper at 50% takes no crate and heals none when the crate's \
IsHumanOnlyPickupInSinglePlayerCampaign is false (H2), when it starts on the crate's centre and is never ordered (H1), when \
the crate's filter is given Relationship ALLIES ENEMIES NEUTRAL SAME_PLAYER (H3), or with all three -- none of them is the \
missing gate (that the game read the edited XML: engine_healcrate_v below)"""
expect = "all(r['箱子位'] == 15 and r['满血位'] == 0 for r in rows)"

[[reading]]
id = "the_hypothesis_clones_edited_xml_is_what_the_game_runs"
scene = {build = "engine_healcrate_v", check = "a", until = 18}
bench = "engine_healcrate_v:a, run_queue CampHCHypVA_mcp_1126_042402: 箱子位 / 满血位 15 0 at s1-s10, 2 0 at s10-s17"
proves = """engine_healcrate_h with each edited clone (Hum, Rel, All) also given a 12 s LifetimeUpdate by the same text edit: \
those three crates go together (箱子位 15 -> 2, Sit's unedited crate stays), still nobody healed -- the edited XML is what \
the game ran, so h's negatives are about the fields, not a build that dropped the edits"""
expect = "rows[0]['箱子位'] == 15 and rows[-1]['箱子位'] == 2 and all(r['满血位'] == 0 for r in rows)"

