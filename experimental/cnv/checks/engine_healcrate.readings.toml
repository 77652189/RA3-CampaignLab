[[reading]]
id = "right_clicking_the_retail_heal_crate_takes_it"
scene = {build = "engine_healcrate_r", check = "b", until = 18, script = "2 拾取 On man 去 On crate"}
item = "物体模块 Behaviors/HealCrateCollide"
bench = """CampHCRealB_mcp_1127_025831, counters (箱子位, 满血位, On 兵血, Off 兵血): \
s1–s25 15 0 50 50; s38–s61 14 1 100 50. Frame 7 shows the selected Peacekeeper and the crate at the click pixel; \
frame 8 shows the Peacekeeper at the crate after pickup."""
proves = """Direct right-click on the retail HealCrate: that crate disappears and the Peacekeeper and friendly Guardian \
70 units away reach full health. The friendly Guardian 180 units away, the opposing Guardian 70 units away and the \
uncommanded Peacekeeper in the Off lane stay below full health. Check a uses the same retail crate with script movement."""
expect = "[rows[0][k] for k in ('箱子位', '满血位', 'On 兵血', 'Off 兵血')] == [15, 0, 50, 50] and [rows[-1][k] for k in ('箱子位', '满血位', 'On 兵血', 'Off 兵血')] == [14, 1, 100, 50]"

[[reading]]
id = "neither_the_campaign_human_gate_nor_contact_nor_relationship_is_what_is_missing"
scene = {build = "engine_healcrate_h", check = "a", until = 18}
bench = "engine_healcrate_h:a, run_queue CampHCHypA_mcp_1126_011501: 箱子位 / 满血位 15 0 at s1-s17"
proves = """HealCrateCollide (negative, D191's table): a p1 Peacekeeper at 50% takes no crate and heals none when the crate's \
IsHumanOnlyPickupInSinglePlayerCampaign is false (H2), when it starts on the crate's centre and is never ordered (H1), when \
the crate's filter is given Relationship ALLIES ENEMIES NEUTRAL SAME_PLAYER (H3), or with all three -- none of them is the \
missing gate (that the game read the edited XML: engine_healcrate_v below)"""
expect = "all(r['箱子位'] == 15 and r['满血位'] == 0 for r in rows)"

[[reading]]
id = "the_hypothesis_clones_edited_xml_is_what_the_game_runs"
scene = {build = "engine_healcrate_v", check = "a", until = 18}
bench = "engine_healcrate_v:a, run_queue CampHCHypVA_mcp_1126_042402: 箱子位 / 满血位 15 0 at s1-s10, 2 0 at s10-s17"
proves = """engine_healcrate_h with each edited clone (Hum, Rel, All) also given a 12 s LifetimeUpdate by the same text edit: \
those three crates go together (箱子位 15 -> 2, Sit's unedited crate stays), still nobody healed -- the edited XML is what \
the game ran, so h's negatives are about the fields, not a build that dropped the edits"""
expect = "rows[0]['箱子位'] == 15 and rows[-1]['箱子位'] == 2 and all(r['满血位'] == 0 for r in rows)"

[[reading]]
id = "a_script_move_through_an_attribute_crate_neither_takes_nor_opens_it"
scene = {build = "engine_secretfile_e", check = "a", until = 14}
bench = "CampSecretFileA_mcp_1127_060542, counters (存活, 经过, 箱盖): 7 0 0 f44–f82; 7 7 0 f90–f257"
proves = """AttributeCrateCollide (RA3's: the Uprising secret files cloned on RA3's schema, no KillOnPickup / ApplyToSelf, \
modifier USER_1): one neutral creation action makes both clones and the retail HealCrate (存活 7); a Peacekeeper sent \
through each by a script move crosses its centre (经过 7 from f90) and all three crates stay, no crate shows USER_1 \
(箱盖 0) -- a script move is no collect order, for the attribute crate as for the heal crate (a397_crate.md)"""
expect = "rows[-1]['存活'] == 7 and all(r['箱盖'] == 0 for r in rows)"

