[[reading]]
id = "vision_a_permanent_reveal_holds_and_its_undo_shuts_at_once"
scenes = {perm = {build = "engine_vision", check = "perm", until = 31}, undo = {build = "engine_vision", check = "undo", until = 31}}
bench = "perm: 揭开 = 帧数 all along; undo at Go + 10 s: 揭开 stays 151, nothing after the undo (撤后 0) (bench 11-09)"
proves = "sim Sim map reveal: a permanent reveal holds, its undo shuts at once"
let = {p = "vals(perm)[-1]", u = "vals(undo)[-1]"}
expect = "p[0] == p[1] > 400 and u[0] == 151 and u[2] == 0"

[[reading]]
id = "vision_reveal_all_lapses_unless_perm_and_its_undo_shuts_at_once"
scenes = {whole = {build = "engine_vision", check = "all", until = 31}, undo = {build = "engine_vision", check = "allundo", until = 31}}
bench = "Bench 11-10 (engine line A round 149): all -- MAP_REVEAL_ALL lapses as a waypoint reveal, 揭开 137 then still (CampVisAll_mcp_1110_192524); allundo -- MAP_REVEAL_ALL_PERM, MAP_REVEAL_ALL_UNDO_PERM at Go + 10 s: 揭开 stops at 151, 撤后 0 (CampVisAllundo_mcp_1110_192316)"
proves = "sim Sim map reveal: MAP_REVEAL_ALL lapses unless permanent, its undo shuts at once (the old model kept it for good: 揭开 436)"
let = {w = "vals(whole)[-1]", u = "vals(undo)[-1]"}
expect = "w[0] == 137 < w[1] and u[0] == 151 and u[2] == 0"
