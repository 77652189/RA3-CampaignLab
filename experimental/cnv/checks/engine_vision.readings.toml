# Bench readings of checks/engine_vision.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# Bench 11-06 reshroud / resh*, 11-09 perm / undo, 11-10 all / allundo: counters 揭开 帧数 [撤后] at 30 s.
# A scene's until is the old test's seconds + 1 (the old bare Sim.run(u) read the row of second u last).

[[reading]]
id = "vision_a_plain_reveal_holds_15n_minus_13_frames[reshroud]"
scene = {build = "engine_vision", check = "reshroud", until = 31}
bench = "MAP_REVEAL_AT_WAYPOINT goes back to fog 137 frames after (default): 揭开 137 at 30 s (bench 11-06)"
proves = "sim Sim map reveal: a waypoint reveal lasts 137 frames by default"
expect = "vals(rows)[-1][0] == 137"

[[reading]]
id = "vision_a_plain_reveal_holds_15n_minus_13_frames[resh0]"
scene = {build = "engine_vision", check = "resh0", until = 31}
bench = "RESHROUD_TIME 0: 揭开 0 at 30 s (bench 11-06)"
proves = "sim Sim map reveal: 15 x N - 13 frames with RESHROUD_TIME N (N 0: none)"
expect = "vals(rows)[-1][0] == 0"

