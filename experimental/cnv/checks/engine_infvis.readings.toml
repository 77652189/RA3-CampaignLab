expect = "rows[-1]['allied'] > rows[-2]['allied'] and rows[-1]['soviet'] > rows[-2]['soviet']"

[[reading]]
id = "spy_vision_allied_alone_no_reveal"
scene = {build = "engine_infvis3", check = "b", until = 41}
bench = "A407 CampInfVis3B (head a9906d7a): only the Allied spy sent, gone at pass 184; allied still counting at s41 (465)"
