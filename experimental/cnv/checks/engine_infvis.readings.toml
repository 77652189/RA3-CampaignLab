# Bench readings of checks/engine_infvis.py.
# The runner's until is one second past the old bare Sim.run limit to include its last sample.

[[reading]]
id = "spy_ordinary_vision_enemy_consumed_ally_refused"
scenes = {a = {build = "engine_infvis", check = "a", until = 37}, b = {build = "engine_infvis", check = "b", until = 37}, c = {build = "engine_infvis", check = "c", until = 37}}
bench = "E76 a/b/c (Allied / Soviet / Japan yards): enemy/ally/vision = 11100/11100/0 s1-s10, 1100/11100/0 s11-s15 (a's first seen second s16; b s18, c s19)"
proves = "InfiltratorContain: the enemy spy enters a construction yard and is consumed, the allied spy is refused (s13-s15: the simulator's entry is s13, the clock is spy_vision_three_yards_entry_passes')"
let = {matches = "lambda rs, lo, hi, wanted: len(rs) > hi and all(v == wanted for v in vals(rs)[lo:hi + 1])"}
expect = "all(matches(rs, 1, 10, [11100, 11100, 0]) and matches(rs, 13, 15, [1100, 11100, 0]) for rs in (a, b, c))"

[[reading]]
id = "spy_ordinary_vision_near_marker_seen"
scenes = {a = {build = "engine_infvis", check = "a", until = 37}, b = {build = "engine_infvis", check = "b", until = 37}, c = {build = "engine_infvis", check = "c", until = 37}}
bench = "E76 a/b/c: vision 1 from s16 / s18 / s19 to s37 (marker 700 north, beyond the yards' VisionRange 150 / 100)"
proves = "not InfiltratorContain VISION: d (no entry) sees the same marker at s16 (A408 H4), the observer sees VisionRange only (H6)"
let = {matches = "lambda rs, lo, hi, wanted: len(rs) > hi and all(v == wanted for v in vals(rs)[lo:hi + 1])"}
expect = "matches(a, 16, 37, [1100, 11100, 1]) and matches(b, 18, 37, [1100, 11100, 1]) and matches(c, 19, 37, [1100, 11100, 1])"
mismatch = "simulator: the near marker is never discovered (vision 0 to s37); bench 1 from s16 / s18 / s19 -- its source unmodelled (H5)"

[[reading]]
id = "spy_vision_three_yards_entry_passes"
scene = {build = "engine_infvis3", check = "a", until = 41}
bench = "A406 CampInfVis3 (head 64219fd4): entries 187184184 from s11 -- Allied and Soviet spies gone at pass 184, Japan at 187"
proves = "InfiltratorContain VISION: the entry clock of three spies ordered into Allied / Soviet / Japan yards together"
expect = "rows[-1]['entries'] == 187184184"
mismatch = "simulator 182182182 (every spy at pass 182), bench 187184184"

[[reading]]
