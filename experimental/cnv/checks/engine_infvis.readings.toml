bench = "A412 CampInfUnitB: the conscript sent 1200 west at s10 (inf // 1000) 0 while away from its goal (there = 0 to s30, 6 at s31), seen from s32 (15 at s33) to 255 at s51 -- about 450 from the still conscript at entry, not seen; once stopped, on the same clock as the still one"
