[[reading]]
id = "spy_vision_units_seen_past_thirty_seconds"
scene = {build = "engine_infunit", check = "a", until = 52}
bench = "A411 CampInfUnitA: nothing seen to s10; the Tsunami (veh % 1000) 8 at s11, 374 at s41, 511 at s51; the still conscript (inf % 1000) 16 at s12, 369 at s41, 511 at s51 -- still rising 39 s after entry (XML UnitDuration 30 s)"
proves = "InfiltratorContain VISION_UNITS: every same-owner unit of the filter's kind, 1400+ from any spy, is discovered from entry and still is 39 s on"
expect = "rows[10]['veh'] == rows[10]['inf'] == 0 and all(rows[51][k] % 1000 - rows[41][k] % 1000 >= 120 for k in ('veh', 'inf'))"
mismatch = "simulator: no entry, nothing discovered (veh / inf 0 to s51)"

[[reading]]
id = "spy_vision_units_reveal_around_the_unit"
scene = {build = "engine_infunit", check = "a", until = 52}
bench = "A411 CampInfUnitA: the Japan infantry 300 east of the Tsunami (veh // 1000; the vehicle filter leaves it out) 10 at s11, 601 at s51 -- about every pass"
proves = "InfiltratorContain VISION_UNITS: the observer gives sight around a matched unit, not just the unit -- a neighbour outside the filter is seen too"
expect = "rows[10]['veh'] == 0 and rows[51]['veh'] // 1000 - rows[21]['veh'] // 1000 >= 400"
mismatch = "simulator: no entry, the neighbour never discovered"

[[reading]]
id = "spy_vision_units_walker_unseen_while_walking"
scene = {build = "engine_infunit", check = "a", until = 52}
bench = "A411 CampInfUnitA: the conscript sent 1200 west at s10 (inf // 1000) 0 from s11 to s31, 2 at s32, 255 at s51 (its arrival time not read)"
proves = "InfiltratorContain VISION_UNITS: a matched unit walking away is not discovered for 20 s, then is (stopping or reaching a place is not told apart)"
expect = "all(rows[s]['inf'] // 1000 == 0 for s in range(11, 32)) and rows[51]['inf'] // 1000 >= 200"
mismatch = "simulator: no entry, the walker never discovered"
