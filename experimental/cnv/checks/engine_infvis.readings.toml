# Bench readings of checks/engine_infvis.py.
# The runner's until is one second past the old bare Sim.run limit to include its last sample.

[[reading]]
id = "spy_ordinary_vision_japan_activation_as_on_the_bench"
scene = {build = "engine_infvis", check = "c", until = 21}
bench = "E76 c: enemy/ally/vision=1100/11100/0 at s18 and 1100/11100/1 at s19"
proves = "InfiltratorContain VISION: the Japan yard's nearby marker first becomes visible at s19 after enemy spy entry"
let = {sample = "lambda lo, hi: [v for t, v in zip(times, vals(rows)) if lo <= t <= hi]", matches = "lambda got, wanted: bool(got) and all(v == wanted for v in got)"}
expect = [
    "matches(sample(18, 18), [1100, 11100, 0])",
    "matches(sample(19, 19), [1100, 11100, 1])",
]
mismatch = "E196 Japan s18 visibility: bench 0, simulator 1; the simulator reveals the marker early."

[[reading]]
id = "spy_vision_three_yards_entry_passes"
scene = {build = "engine_infvis3", check = "a", until = 41}
bench = "A406 CampInfVis3 (head 64219fd4): entries 187184184 from s11 -- Allied and Soviet spies gone at pass 184, Japan at 187"
proves = "InfiltratorContain VISION: the entry clock of three spies ordered into Allied / Soviet / Japan yards together"
expect = "rows[-1]['entries'] == 187184184"
mismatch = "simulator 182182182 (every spy at pass 182), bench 187184184"

[[reading]]
id = "spy_vision_three_yards_only_the_last_entered_reveals"
scene = {build = "engine_infvis3", check = "a", until = 41}
bench = "A406 CampInfVis3: japan stops at 167 from s22 (its near marker seen 167 passes after its spy is gone); allied / soviet still counting at s41 (465): not seen in 30 s"
proves = "InfiltratorContain VISION: with three yards of one owner entered together, only the last entered (Japan) reveals its near marker"
expect = "win(22, 40, 'japan') == [167] * 19 and rows[-1]['allied'] >= 440 and rows[-1]['soviet'] >= 440"
mismatch = "simulator: all three seen 74 passes after entry (allied / soviet / japan 74); bench japan 167, allied / soviet never in 30 s"

[[reading]]
id = "spy_vision_allied_alone_no_reveal"
scene = {build = "engine_infvis3", check = "b", until = 41}
bench = "A407 CampInfVis3B (head a9906d7a): only the Allied spy sent, gone at pass 184; allied still counting at s41 (465)"
proves = "InfiltratorContain VISION: an Allied yard entered alone (no later entry anywhere) does not reveal its near marker in 30 s"
expect = "rows[-1]['entries'] == 184 and rows[-1]['allied'] >= 440"
mismatch = "simulator: Allied spy gone at pass 182, near marker seen 74 passes later; bench 184, not seen in 30 s"

[[reading]]
id = "spy_vision_unentered_japan_marker_seen_anyway"
scene = {build = "engine_infvis3", check = "b", until = 41}
bench = "A407 CampInfVis3B: no spy sent to the Japan yard; its near marker seen at pass 353 (s22), the pass a's Japan was seen at (187 + 167 = 354)"
proves = "the a run's Japan reveal is not InfiltratorContain VISION: the same marker is discovered at the same pass with no entry"
expect = "win(22, 40, 'japan') == [353] * 19 and rows[-1]['soviet'] >= 600"
mismatch = "simulator: the Japan near marker is never discovered without an entry; bench sees it at pass 353"
