[[reading]]
id = "waypath_follows_the_links_waypoint_by_waypoint_near"
scene = {build = "engine_waypath", check = "near", until = 51}
bench = """\
near joins at B, the nearest, A never again: 段1 1 at s3 (truck 1 drives through A on its way from (1130, 2225) to N, \
turning east from its start), 2 at s15, 3 at s21; 近B 4 at s16 (bench 2026-11-10)"""
proves = "sim order_follow: a follow-waypoints order started away from the path joins it at the nearest waypoint, A never again"
let = {chg = "[(t, r) for i, (t, r) in enumerate(zip(times, rows)) if i == 0 or r != rows[i - 1]]", at = "lambda k, p: next((t for t, r in chg if p(r[k])), None)", hit = "lambda k, v, b: (lambda g: g is not None and b <= g <= b + 2)(at(k, lambda x: x == v))"}
expect = [
    "hit('段1', 1, 3) and hit('段1', 2, 15) and hit('近B', 4, 16) and hit('段1', 3, 21)",
    "rows[-1]['段1'] == 3 and all(r['段1'] != 1 for t, r in chg if t >= 15)",
]
mismatch = """\
sim 段1 0 -> 2 at s17 (never 1: the straight line passes A's corner (x 1297) at y 2265.8, 0.8 outside -- it was in by 0.9 \
with N unsnapped (1600, 2335), on the grid (1600, 2340) not; the start's heading and turn are not modelled), 近B 4 at \
s18, 段1 3 at s23; bench 段1 1 at s3, 2 at s15, 近B 4 at s16, 3 at s21 (2026-11-18)"""

