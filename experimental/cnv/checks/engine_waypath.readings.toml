# Bench readings of checks/engine_waypath.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# Waypoint paths (Sim.order_follow): bench 2026-11-10. Each reading is (counter, value, bench second); the simulator's
# first second at that value is at most 2 s later (the bench's seconds run 1-2 s ahead of the mission's timers).

[[reading]]
id = "waypath_follows_the_links_waypoint_by_waypoint_line"
scene = {build = "engine_waypath", check = "line", until = 51}
bench = """\
line walks A -> B (within 10 of it: no corner cut) -> C and stays: 段1 1 at s3, 2 at s9, 3 at s15; 近B 4 at s9 (bench \
2026-11-10)"""
proves = "sim order_follow: a truck follows the waypoint links A -> B -> C and stays at C"
let = {chg = "[(t, r) for i, (t, r) in enumerate(zip(times, rows)) if i == 0 or r != rows[i - 1]]", at = "lambda k, p: next((t for t, r in chg if p(r[k])), None)", hit = "lambda k, v, b: (lambda g: g is not None and b <= g <= b + 2)(at(k, lambda x: x == v))"}
expect = [
    "hit('段1', 1, 3) and hit('段1', 2, 9) and hit('近B', 4, 9) and hit('段1', 3, 15)",
    "rows[-1]['段1'] == 3",
]

