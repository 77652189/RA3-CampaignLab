[[reading]]
id = "waypath_loop_goes_round_and_round_a_lap_about_20_s"
scene = {build = "engine_waypath", check = "loop", until = 91}
bench = "loop: C linked back to A -- 段1 back at A at s23 43 63 84 (laps 20-21 s); the simulator 2-3 s later (bench 2026-11-10)"
proves = "sim order_follow: a path linked back to its start goes round and round, a lap about 20 s"
let = {chg = "[(t, r) for i, (t, r) in enumerate(zip(times, rows)) if i == 0 or r != rows[i - 1]]", back = "[t for (t, v), (_, w) in zip(chg[1:], chg) if v['段1'] == 1 and w['段1'] == 3]"}
expect = "len(back) >= 4 and all(b <= s <= b + 3 for b, s in zip((23, 43, 63, 84), back))"

