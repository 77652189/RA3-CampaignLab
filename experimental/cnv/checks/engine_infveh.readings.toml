scene = {build = "engine_infveh", check = "c", until = 47}
bench = "E194 c: position=111 in every sample; enemy/ally=1100/11100 from sampled s14 onward. Direct bit=0 at s1-s12, s18, s22, s29-s30, s35-s36, s45; 1 in the other samples. No s13/s23/s31 samples."
proves = "InfiltratorContain VISION_UNITS: direct vehicle discovery at the measured times with the markers stationary"
let = {sample = "lambda lo, hi: [v for t, v in zip(times, vals(rows)) if lo <= t <= hi]", matches = "lambda got, wanted: bool(got) and all(v == wanted for v in got)"}
expect = [
    "matches(sample(1, 12), [11100, 11100, 0, 111])",
    "matches(sample(14, 17), [1100, 11100, 1, 111])",
    "matches(sample(18, 18), [1100, 11100, 0, 111])",
    "matches(sample(19, 21), [1100, 11100, 1, 111])",
    "matches(sample(22, 22), [1100, 11100, 0, 111])",
    "matches(sample(24, 28), [1100, 11100, 1, 111])",
    "matches(sample(29, 30), [1100, 11100, 0, 111])",
    "matches(sample(32, 34), [1100, 11100, 1, 111])",
    "matches(sample(35, 36), [1100, 11100, 0, 111])",
    "matches(sample(37, 44), [1100, 11100, 1, 111])",
    "matches(sample(45, 45), [1100, 11100, 0, 111])",
    "matches(sample(46, 46), [1100, 11100, 1, 111])",
]
mismatch = "E194 c: with position=111, the bench direct bit flickers 1/0; at a sampled bench 0 the simulator still reads 1. Observer scheduling and lifetime remain unresolved."
