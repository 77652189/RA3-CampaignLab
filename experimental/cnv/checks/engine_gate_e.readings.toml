# Bench readings of checks/engine_gate_e.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# E190 bench (work/re/e190_gate.md): one run, a PASS, f180 = 180/0/0/1 (frame / Romania door / Sanitarium door /
# sentinel); the three creates at f30. No gate effect is read: GateOpenAndCloseBehavior stays unmodelled, no item.

[[reading]]
id = "a_retail_building_made_at_f30_lives_to_f180"
scene = {build = "engine_gate_e", check = "a", until = 13}
bench = "frame 180, sentinel 1 at f180 (AlliedPowerPlant made by CREATE_NAMED_ON_TEAM_AT_WAYPOINT at f30)"
proves = "脚本动作 CREATE_NAMED_ON_TEAM_AT_WAYPOINT: the same create the doors use makes a known building (the doors' control)"
expect = ["rows[-1]['frame'] == 180", "rows[-1]['sentinel'] == 1"]

[[reading]]
id = "the_romania_and_sanitarium_doors_are_not_there_at_f180"
scene = {build = "engine_gate_e", check = "a", until = 13}
bench = "Romania 0, Sanitarium 0 at f180 (RM_AlliedBlastDoor, SS_Door made by the same create at f30)"
proves = "脚本动作 CREATE_NAMED_ON_TEAM_AT_WAYPOINT: a map's own door template made from a script on another map"
expect = ["rows[-1]['Romania'] == 0", "rows[-1]['Sanitarium'] == 0"]
mismatch = "sim 1 and 1 (the simulator makes any template a script names); bench 0 and 0. Both templates sit under their maps' Civilian/<map>/Destructible_Props and outside the SageXML game-object index: not made off their own map is the leaning, INFERRED (not made, refused, or gone before f180 not told apart)"
