# Bench readings of checks/engine_area.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# Area counts (E1), bench 2026-10-25 / 11-04.

[[reading]]
id = "area_counts_whose_units_as_the_bench"
scenes = {field = {build = "engine_area", check = "field", until = 13}, camp = {build = "engine_area", check = "camp", until = 13}}
bench = """\
In the west field, three of the player's Guardians -- the player's kind count 3, the enemy's kind count 3 too (a KindOf \
count takes every player's), the enemy's template count 0 and SKIRMISH_PLAYER_HAS_UNITS_IN_AREA(enemy) false (those \
take only the named player's); at the north base the player's kind count 2 (the enemy's warriors), the template count \
0. The bench measured "has units" only where the named player has none (the half that matters: it does not take \
another player's) (bench 2026-10-25 / 11-04)"""
proves = "sim area counts: a KindOf count takes every player's units, a template count and 'has units' only the named player's"
expect = "vals(field)[-1] == [3, 3, 0, 0] and vals(camp)[-1] == [2, 0]"

[[reading]]
id = "area_alias_masks_set_each_enemy_and_count_any"
scene = {build = "engine_area", check = "als", until = 10}
bench = "als (A347, CampAreaAls_mcp_1124_031222), 钱 有 every 0.5 s: s1.1-s1.6 12 5 | s2.1-s11.1 13 5"
proves = """PLAYER_SET_MONEY("<1st Human Player's Enemies>", 7000) sets Soviet_1 (>= 5000 after) and not the human (1000 \
kept); SKIRMISH_PLAYER_HAS_UNITS_IN_AREA with an alias is any player of the mask: the enemies at the camp yes, in the \
field (the player's Guardians) no, Allies incl Self yes, Allies (not self) no"""
expect = ["all(v[1] == 5 for v in vals(rows))", "vals(rows)[-1] == [13, 5]"]

[[reading]]
id = "area_alias_another_enemy_starts_with_money"
