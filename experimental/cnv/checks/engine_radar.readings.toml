# Bench readings of checks/engine_radar.py (format: experimental/cnv/readings.py; runner: tests/conformance).
# E158-E162: one retail Allied radar dish, the native PlayerSpellBook radar removed (work/re/e158_radar.md ...).
# The counters are the scene's prerequisites (dish / support alive, PLAYER_HAS_POWER, owner), NOT the radar: the
# minimap was read off the saved HUD frames, which the simulator does not model -- so no reading carries
# 物体模块 Behaviors/RadarBehavior (inventory.py keeps it 推断).

[[reading]]
id = "the_dish_goes_at_12_s_and_its_supports_stay_powered"
each = [{build = "engine_radar", alive = 151, gone = 303}, {build = "engine_radaroff", alive = 149, gone = 308}]
scene = {check = "a", until = 22}
bench = "E158 (bench 11-15): dish / support / power f151 = 1 / 1 / 1, f303 = 0 / 1 / 1 (off build f149 / f308 the same); HUD minimap terrain then the Allied emblem with the module, the emblem both times without it"
proves = "the RadarBehavior scene's prerequisites: NAMED_DELETE at 12 s takes the dish, the yard and plant stay, PLAYER_HAS_POWER holds (the radar itself is the HUD's, not read here)"
let = {at = "lambda f: [[r[k] for k in ('宿主量', '前置量', '供电量')] for r in rows if r['帧数'] <= f][-1]"}
expect = ["at(alive) == [1, 1, 1]", "at(gone) == [0, 1, 1]", "verdicts() and all(ok for ok, _ in verdicts())"]

[[reading]]
id = "the_plant_goes_at_12_s_and_the_power_with_it"
scene = {build = "engine_radarlow", check = "a", until = 22}
bench = "E159 (bench 11-15): dish / consumers / power f147 = 1 / 1 / 1, f302 = 1 / 1 / 0 (supply / demand 150 / 75 -> 50 / 75 after the plant's delete); HUD minimap terrain at both frames"
proves = "the low-power scene's prerequisites: NAMED_DELETE of the only plant at 12 s, PLAYER_HAS_POWER false with 50 supply for 75 demand, the dish and the barracks stay (the dish's radar staying is the HUD's, not read here)"
let = {at = "lambda f: [[r[k] for k in ('宿主量', '前置量', '供电量')] for r in rows if r['帧数'] <= f][-1]"}
expect = ["at(147) == [1, 1, 1]", "at(302) == [1, 1, 0]", "verdicts() and all(ok for ok, _ in verdicts())"]

[[reading]]
id = "two_dishes_go_one_at_12_s_one_at_24_s"
scene = {build = "engine_radartwo", check = "a", until = 27}
bench = "E160 (bench 11-15): first / second / power-and-supports f114 = 1 / 1 / 1, f197 = 0 / 1 / 1, f386 = 0 / 0 / 1; HUD minimap terrain, terrain, then the Allied emblem (the run was slow: its wall-time expectations failed, these logic-frame readings are what holds)"
proves = "the two-provider scene's prerequisites: two same-template dishes deleted by name one at 12 s and one at 24 s, the yard, the plant and PLAYER_HAS_POWER throughout (the radar going only with the last one is the HUD's, not read here)"
let = {at = "lambda f: [[r[k] for k in ('宿主量', '第二宿主', '供电量')] for r in rows if r['帧数'] <= f][-1]"}
expect = ["at(114) == [1, 1, 1]", "at(197) == [0, 1, 1]", "at(386) == [0, 0, 1]"]

[[reading]]
id = "the_dish_is_hurt_at_6_s_and_killed_at_12_s"
scene = {build = "engine_radardeath", check = "a", until = 26}
bench = "E161 (bench 11-15): gone / HP / power-and-supports f87 = 0 / 100 / 1, f95 and f173 = 0 / 50 / 1, f182 / f192 / f374 = 1 / 0 / 1 (500 HP, NAMED_DAMAGE 250 at 6 s, 1000 at 12 s); HUD terrain to f173, the off transition at f182, the emblem after; the check's expectations PASS"
proves = "the death scene's prerequisites: NAMED_DAMAGE halves the 500 HP dish, the second kills it (NAMED_DESTROYED), the yard, the plant and PLAYER_HAS_POWER stay (the radar going with the death is the HUD's, not read here)"
let = {at = "lambda f: [[r[k] for k in ('死亡', '血量', '供电前置')] for r in rows if r['帧数'] <= f][-1]"}
expect = ["at(87) == [0, 100, 1]", "at(173) == [0, 50, 1]", "[r['帧数'] for r in rows if r['死亡']][0] == 196", "at(374)[0::2] == [1, 1]",
          "verdicts() and all(ok for ok, _ in verdicts())"]

[[reading]]
id = "the_killed_dish_reads_0_health"
scene = {build = "engine_radardeath", check = "a", until = 26}
bench = "E161: the health counter (SET_UNIT_HEALTH_PERCENTAGE_TO_COUNTER every frame, the script listed before the lethal NAMED_DAMAGE) reads 0 at f182 / f192 / f374"
proves = "脚本动作 SET_UNIT_HEALTH_PERCENTAGE_TO_COUNTER of an object a script's damage killed: 0 the frames after (the dish's SlowDeath keeps it in the world; INFERRED)"
expect = "[at(f)[1] for f in (196, 374)] == [0, 0]"
let = {at = "lambda f: [[r[k] for k in ('死亡', '血量', '供电前置')] for r in rows if r['帧数'] <= f][-1]"}
mismatch = "sim 50 / 50 at f196 (the first once-a-second row after the death at f182) / f374 (engine/script/act_world.py: 0 only when the health script runs after the kill in the same frame, else the last value); bench 0 / 0"

[[reading]]
id = "a_script_hands_the_dish_over_at_12_s"
each = [{build = "engine_radarout", before = 91, owner_before = 1, after = 312, owner_after = 2},
        {build = "engine_radarin", before = 87, owner_before = 2, after = 282, owner_after = 1}]
scene = {check = "a", until = 22}
bench = "E162 (bench 11-15): owner / alive / both sides powered with four live supports, out f91 = 1 / 1 / 1 -> f312 = 2 / 1 / 1, in f87 = 2 / 1 / 1 -> f282 = 1 / 1 / 1 (NAMED_TRANSFER_OWNERSHIP_PLAYER at 12 s, not an engineer's capture); the local HUD as old owner terrain -> emblem, as new owner emblem -> terrain"
proves = "the owner-transfer scene's prerequisites: the transfer moves the dish between Player_1 and Soviet_4 both ways, it stays alive, both sides keep their yard, plant and PLAYER_HAS_POWER (the radar following the owner is the HUD's, not read here)"
let = {at = "lambda f: [[r[k] for k in ('归属量', '存活量', '供电前置')] for r in rows if r['帧数'] <= f][-1]"}
expect = ["at(before) == [owner_before, 1, 1]", "at(after) == [owner_after, 1, 1]"]
