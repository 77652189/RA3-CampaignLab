# Bench readings of checks/engine_dynamics.py (format: experimental/cnv/readings.py; runner: tests/conformance).

[[reading]]
id = "test_dynamics_update_a_hammer_without_it_crushes_and_goes_round_as_the_retail_one"
item = "物体模块 Behaviors/DynamicsUpdate"
scene = {build = "engine_dynamics", check = "a", until = 50}
bench = "engine_dynamics a / b, bench 11-10: the retail Hammer, a copy without DynamicsUpdate and the copy with it -- the three rows identical every second. a: conscript crushed at frame 43, dying 127, tank at its goal from 92; b: the Guardian never crushed, the tank round it, at its goal from 97"
proves = "DynamicsUpdate: no such module in the simulator, the three lanes alike (its frames are the known no-acceleration bands)"
each = [{build = "engine_dynamics", check = "a", lane = "a"}, {build = "engine_dynamics_b", check = "b", lane = "b"}]
let = {frames = "rows[-1]['帧数']", cells = "[rows[-1][k] for k in ('行1', '行2', '行3')]", row = "rows[-1]['行1']"}
expect = [
  "len(set(cells)) == 1",
  "(39 <= row % 1000 <= 55 and abs(row // 1000 % 1000 - 127) <= 2) if lane == 'a' else (row % 1000 == frames and row // 1000 % 1000 == 0)",
  "80 <= frames - row // 1000000 + 1 <= 100",
]
