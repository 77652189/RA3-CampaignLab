# Bench readings of checks/engine_aivital.py (format: experimental/cnv/readings.py; runner: tests/conformance).

[[reading]]
id = "vital_named_bench_replay[aivitalon lane0]"
scene = {build = "aivitalon", check = "a", until = 61}
bench = "aivitalon:a s55-s60: lane 0 (counter lane0) reads 24 every second."
proves = "simai native-status filter: the script-controlled ATTACHED slice and the lane counters"
expect = "[v[0] for t, v in zip(times, vals(rows)) if 55 <= t <= 60] == [24] * 6"
mismatch = "sim 114; bench 24"

